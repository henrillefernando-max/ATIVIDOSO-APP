<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ATIVIDOSO</title>
  <link rel="icon" href="Logo_ATV_2024_Colorido_v2.png?v=3" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{blue:'#202b5c',dark:'#161e42',light:'#4d60b5',red:'#e63946',ia:'#8b5cf6'}}}}}
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body{font-family:'Inter',sans-serif;overscroll-behavior-x:none}
    .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    .animate-fade-in{animation:fadeIn 0.2s ease-out forwards}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SUPABASE_URL = "https://rewkwzxuogdopzkqliwi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WtX-V75sKhWRnm7G_x6W1Q_fzuagXGH"; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PRELOADED_EXERCISES = [
      { id: 'pre_1', title: 'Fortalecimento de Pernas na Cadeira', category: 'mmii', muscleGroup: 'Quadriceps', difficulty: 'Iniciante', equipment: 'Cadeira', dosage: '3x10', instructions: '1. Sente-se.\n2. Estique uma perna.\n3. Segure 2s e retorne.', precautions: 'Não estenda além do conforto.', videoUrl: 'https://www.youtube.com/watch?v=8CE4CGCXyAA', status: 'approved', author: 'Coordenação' },
      { id: 'pre_2', title: 'Mobilidade de Ombros', category: 'mmss', muscleGroup: 'Ombro', difficulty: 'Iniciante', equipment: 'Bastão', dosage: '2x12', instructions: '1. Segure o bastão.\n2. Eleve acima da cabeça.\n3. Desça devagar.', precautions: 'Bursite: elevar só até 90 graus.', videoUrl: 'https://www.youtube.com/watch?v=A2wqkcjzIvk', status: 'approved', author: 'Coordenação' },
      { id: 'pre_3', title: 'Equilíbrio (Prevenção Quedas)', category: 'dual', muscleGroup: 'Equilíbrio', difficulty: 'Moderado', equipment: 'Cadeira', dosage: '3x 20s', instructions: '1. Em pé atrás da cadeira.\n2. Levante um pé.\n3. Solte as mãos se seguro.', precautions: 'Sempre próximo a uma parede.', videoUrl: 'https://www.youtube.com/watch?v=nC-L0H_2PBE', status: 'approved', author: 'Coordenação' },
      { id: 'pre_4', title: 'Caminhada Estacionária', category: 'aerobic', muscleGroup: 'Marcha', difficulty: 'Iniciante', equipment: 'Nenhum', dosage: '5 a 10 min', instructions: 'Simule caminhada sem sair do lugar, elevando joelhos.', precautions: 'Ambiente livre de tapetes.', videoUrl: 'https://www.youtube.com/watch?v=Ev6yE55dvOU', status: 'approved', author: 'Coordenação' },
      { id: 'pre_5', title: 'Bomba Muscular (Panturrilha)', category: 'mmii', muscleGroup: 'Panturrilha', difficulty: 'Iniciante', equipment: 'Parede', dosage: '3x15', instructions: 'Fique na ponta dos pés apoiado na parede e desça.', precautions: 'Fazer devagar para evitar cãibra.', videoUrl: 'https://www.youtube.com/watch?v=t1r-I6yQJj8', status: 'approved', author: 'Coordenação' },
      { id: 'pre_6', title: 'Alongamento Lombar', category: 'core', muscleGroup: 'Lombar', difficulty: 'Iniciante', equipment: 'Cadeira', dosage: '2x 30s', instructions: 'Sentado, incline o tronco para frente soltando os braços.', precautions: 'Subir devagar para não causar tontura.', videoUrl: 'https://www.youtube.com/watch?v=r3Pj-X-H1oA', status: 'approved', author: 'Coordenação' }
    ];

    const AGENDA_DATA = [
      { act: "17", date: "14/08/2026", title: "RETORNO DAS ATIVIDADES", resp: "Todos" },
      { act: "18", date: "21/08/2026", title: "Mobilidade e fortalecimento MMSS", resp: "E1" },
      { act: "19", date: "28/08/2026", title: "Mobilidade e fortalecimento MMII", resp: "E2" },
      { act: "20", date: "04/09/2026", title: "Aeróbicos e cardiorrespiratório", resp: "E3" },
      { act: "21", date: "11/09/2026", title: "Dupla tarefa e postura", resp: "E4" }
    ];

    const CATS = {
      mmss: { t: "Membros Superiores", ic: "fa-hand-fist", sub: ["Costas", "Tríceps", "Biceps", "Ombro", "Peito"] },
      mmii: { t: "Membros Inferiores", ic: "fa-shoe-prints", sub: ["Isquiostibiais", "Quadriceps", "Panturrilha", "Glúteos"] },
      core: { t: "Core e Tronco", ic: "fa-child-reaching", sub: ["Abdômen", "Lombar", "Postura"] },
      aerobic: { t: "Aeróbico", ic: "fa-heart-pulse", sub: ["Marcha", "Resistência", "Agilidade"] },
      dual: { t: "Dupla Tarefa", ic: "fa-brain", sub: ["Cognitiva + Motora", "Equilíbrio"] }
    };

    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [form, setForm] = useState({email:'', pass:'', name:'', team:'E1'});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        if (isLogin) {
          const { data, error: err } = await supabase.auth.signInWithPassword({ email: form.email, password: form.pass });
          if (err) { setError('Credenciais incorretas.'); setLoading(false); } 
          else if (data.session) {
            const { data: prof } = await supabase.from('profiles').select('*').eq('id', data.session.user.id).single();
            onLogin({ ...data.session.user, full_name: prof?.full_name||'Monitor', role: prof?.role||'Monitor', team_group: prof?.team_group });
          }
        } else {
          const { data, error: err } = await supabase.auth.signUp({ email: form.email, password: form.pass });
          if (err) { setError(err.message); setLoading(false); } 
          else if (data.user) {
            await supabase.from('profiles').insert([{ id: data.user.id, full_name: form.name, role: 'Monitor', team_group: form.team }]);
            onLogin({ ...data.user, full_name: form.name, role: 'Monitor', team_group: form.team });
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 animate-fade-in">
            <div className="text-center mb-8"><img src="Logo_ATV_2024_Colorido_v2.png" className="h-20 mx-auto mb-4" onError={e=>e.target.style.display='none'}/><h2 className="text-2xl font-bold">Acesso Restrito</h2></div>
            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <>
                  <input type="text" placeholder="Nome Completo" onChange={e=>setForm({...form, name:e.target.value})} required className="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-950 border dark:border-slate-700 outline-none focus:border-brand-blue" />
                  <select onChange={e=>setForm({...form, team:e.target.value})} className="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-950 border dark:border-slate-700 outline-none"><option value="E1">E1</option><option value="E2">E2</option><option value="E3">E3</option><option value="E4">E4</option></select>
                </>
              )}
              <input type="email" placeholder="E-mail" onChange={e=>setForm({...form, email:e.target.value})} required className="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-950 border dark:border-slate-700 outline-none focus:border-brand-blue" />
              <input type="password" placeholder="Senha" onChange={e=>setForm({...form, pass:e.target.value})} required className="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-950 border dark:border-slate-700 outline-none focus:border-brand-blue" />
              {error && <div className="text-red-500 text-xs text-center font-bold">{error}</div>}
              <button type="submit" disabled={loading} className="w-full bg-brand-blue text-white py-3 rounded-lg font-bold">{loading ? '...' : (isLogin ? 'Entrar' : 'Registrar')}</button>
            </form>
            <p className="text-center text-xs mt-6 text-brand-blue cursor-pointer" onClick={()=>{setIsLogin(!isLogin); setError('');}}>{isLogin ? "Criar conta" : "Fazer Login"}</p>
          </div>
        </div>
      );
    };

    const Dashboard = ({ session, onLogout, setDarkMode, darkMode }) => {
      const isAdmin = session.role?.includes('Admin');
      const [view, setView] = useState('home');
      const [cMode, setCircuitMode] = useState('agenda');
      const [menuOpen, setMenuOpen] = useState(false);
      
      const [exs, setExercises] = useState([]);
      const [circuits, setCircuits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [participants, setParticipants] = useState([{id:'1',name:'José'}, {id:'2',name:'Maria'}]);
      
      const [plan, setPlan] = useState({ num:'', theme:'', date:'', stds:'', wUp:'', cDown:'', resp:['','','','',''], act:'', obj:'', vitals:'', media:'', mat:'', dev:'', ev:'', count:'', att:[] });
      const [stations, setStations] = useState([[],[],[],[],[]]);
      const [viewCirc, setViewCirc] = useState(null);

      useEffect(() => {
        const fetchAll = async () => {
          const [{data:e}, {data:c}, {data:a}] = await Promise.all([supabase.from('exercises').select('*'), supabase.from('circuits').select('*'), supabase.from('announcements').select('*')]);
          setExercises(e ? [...PRELOADED_EXERCISES, ...e] : PRELOADED_EXERCISES);
          if(c) setCircuits(c); if(a) setAnnouncements(a);
        }; fetchAll();
      }, [view, cMode]);

      const nav = (v, m=null) => { setView(v); if(m) setCircuitMode(m); setMenuOpen(false); };

      // === INTEGRAÇÃO IA (EDGE FUNCTION) ===
      const handleAIGen = async (field, prompt) => {
         setPlan(p => ({...p, [field]: 'Gerando com IA... Aguarde.'}));
         try {
            const { data, error } = await supabase.functions.invoke('gerar-evolucao', { body: { prompt } });
            if (error) throw error;
            setPlan(p => ({...p, [field]: data.resultado}));
         } catch (e) {
            alert("Erro IA: " + e.message); setPlan(p => ({...p, [field]: ''}));
         }
      };

      const gerarEvolucaoIA = () => {
         const pres = plan.att.filter(p => p.present);
         if (!pres.length) return alert("Marque presença na lista primeiro.");
         const vitals = pres.map(p => `${p.name}: PA ${p.pa_in||'?'}->${p.pa_out||'?'}, FC ${p.fc_in||'?'}->${p.fc_out||'?'}`).join(', ');
         const prompt = `Fisioterapeuta gerontológico redigindo prontuário. Sintetize a evolução clínica baseada nos sinais vitais: ${vitals}. Atividade: ${plan.act}. Texto direto e profissional em 1 parágrafo.`;
         handleAIGen('ev', prompt);
      };

      const savePlan = async () => {
         if(!plan.date) return alert('Data obrigatória.');
         const { data } = await supabase.from('circuits').insert([{ activity_date: plan.date, stations, details: plan, author: session.full_name }]).select();
         if(data) { alert('Salvo!'); setCircuits([data[0], ...circuits]); setCircuitMode('history'); }
      };

      return (
        <div className="flex h-screen bg-slate-50 dark:bg-slate-950">
          {menuOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={()=>setMenuOpen(false)}></div>}
          
          <aside className={`w-64 bg-white dark:bg-slate-900 border-r dark:border-slate-800 flex flex-col fixed md:relative h-full z-50 transition-transform ${menuOpen?'translate-x-0':'-translate-x-full'} md:translate-x-0`}>
            <div className="p-6 text-center border-b dark:border-slate-800"><h2 className="font-black text-xl text-brand-blue">ATIVIDOSO</h2><p className="text-[10px] text-slate-500 uppercase mt-1">{session.full_name}</p></div>
            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              <button onClick={()=>nav('home')} className="w-full text-left p-3 rounded bg-slate-100 dark:bg-slate-800 font-bold text-sm"><i className="fa-solid fa-home mr-2"></i> Painel</button>
              <button onClick={()=>nav('circuito','agenda')} className="w-full text-left p-3 rounded bg-slate-100 dark:bg-slate-800 font-bold text-sm"><i className="fa-solid fa-clipboard-check mr-2"></i> Aulas e Diário</button>
              <button onClick={()=>nav('library')} className="w-full text-left p-3 rounded bg-slate-100 dark:bg-slate-800 font-bold text-sm"><i className="fa-solid fa-book-medical mr-2"></i> Acervo Clínico</button>
              {isAdmin && <button onClick={()=>nav('admin')} className="w-full text-left p-3 rounded bg-slate-100 dark:bg-slate-800 font-bold text-sm"><i className="fa-solid fa-lock mr-2"></i> Admin</button>}
            </nav>
            <button onClick={onLogout} className="p-4 text-sm text-red-500 font-bold border-t dark:border-slate-800"><i className="fa-solid fa-power-off mr-2"></i> Sair</button>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="h-16 bg-white dark:bg-slate-900 border-b dark:border-slate-800 flex justify-between items-center px-6">
              <button onClick={()=>setMenuOpen(true)} className="md:hidden"><i className="fa-solid fa-bars"></i></button>
              <h2 className="font-bold uppercase tracking-wider text-slate-500 text-sm">Dashboard</h2>
              <button onClick={()=>setDarkMode(!darkMode)} className="text-xl"><i className={`fa-solid ${darkMode?'fa-sun':'fa-moon'}`}></i></button>
            </header>

            <div className="flex-1 overflow-y-auto p-6">
              {view === 'home' && (
                <div className="space-y-6 max-w-5xl mx-auto">
                  <div className="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-sm"><h1 className="text-2xl font-bold">Olá, {session.full_name}</h1><p className="text-sm text-slate-500">Gestão Atividoso</p></div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-brand-blue text-white p-6 rounded-xl shadow-sm cursor-pointer" onClick={()=>nav('circuito','plan')}><h3 className="font-black text-lg"><i className="fa-solid fa-plus"></i> Criar Aula</h3></div>
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border dark:border-slate-800"><h3 className="font-bold text-xl">{circuits.length}</h3><p className="text-xs uppercase text-slate-500">Relatórios Salvos</p></div>
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border dark:border-slate-800"><h3 className="font-bold text-xl">{exs.length}</h3><p className="text-xs uppercase text-slate-500">Exercícios no Acervo</p></div>
                  </div>
                </div>
              )}

              {view === 'circuito' && (
                <div className="max-w-5xl mx-auto space-y-6">
                  <div className="flex gap-2 overflow-x-auto border-b dark:border-slate-800 pb-2">
                    {['agenda', 'plan', 'history'].map(m => (
                      <button key={m} onClick={()=>setCircuitMode(m)} className={`px-4 py-2 font-bold text-sm uppercase rounded ${cMode===m?'bg-brand-blue text-white':'bg-slate-200 dark:bg-slate-800'}`}>{m}</button>
                    ))}
                  </div>

                  {cMode === 'agenda' && (
                    <div className="bg-white dark:bg-slate-900 rounded-xl p-6 shadow-sm border dark:border-slate-800">
                      <h2 className="font-bold mb-4">Agenda 2026.2</h2>
                      {AGENDA_DATA.map((a,i)=><div key={i} className="p-3 border-b dark:border-slate-700 flex justify-between"><span className="font-bold text-sm">{a.date} - {a.title}</span><span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">{a.resp}</span></div>)}
                    </div>
                  )}

                  {cMode === 'plan' && (
                    <div className="bg-white dark:bg-slate-900 rounded-xl p-8 shadow-sm border dark:border-slate-800 space-y-6">
                      <h2 className="font-bold text-xl">Novo Planejamento</h2>
                      <div className="grid grid-cols-2 gap-4">
                        <input type="date" className="p-3 border rounded dark:bg-slate-800 dark:border-slate-700 w-full outline-none" onChange={e=>setPlan({...plan, date:e.target.value})} />
                        <input type="text" placeholder="Equipe Responsável" className="p-3 border rounded dark:bg-slate-800 dark:border-slate-700 w-full outline-none" onChange={e=>setPlan({...plan, stds:e.target.value})} />
                      </div>
                      
                      <div className="space-y-4">
                         <div className="flex justify-between items-center"><label className="font-bold text-sm">Objetivos Fisioterapêuticos</label><button onClick={()=>handleAIGen('obj', `Fisioterapeuta gerontológico. Crie objetivos em tópicos para aula de fisioterapia tema: ${plan.theme||'geral'}`)} className="text-[10px] bg-brand-ia text-white px-2 py-1 rounded font-bold"><i className="fa-solid fa-wand-magic-sparkles"></i> Gerar IA</button></div>
                         <textarea rows="3" value={plan.obj} onChange={e=>setPlan({...plan, obj:e.target.value})} className="w-full p-3 border rounded dark:bg-slate-800 dark:border-slate-700 outline-none"></textarea>
                      </div>

                      <div className="space-y-4">
                         <div className="flex justify-between items-center"><label className="font-bold text-sm">Aquecimento</label><button onClick={()=>handleAIGen('wUp', `Crie uma dinâmica lúdica de aquecimento de 10 min para idosos. Tema: ${plan.theme||'fisioterapia'}`)} className="text-[10px] bg-brand-ia text-white px-2 py-1 rounded font-bold"><i className="fa-solid fa-wand-magic-sparkles"></i> Gerar IA</button></div>
                         <textarea rows="3" value={plan.wUp} onChange={e=>setPlan({...plan, wUp:e.target.value})} className="w-full p-3 border rounded dark:bg-slate-800 dark:border-slate-700 outline-none"></textarea>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {stations.map((st, i) => (
                          <div key={i} className="p-4 border rounded-xl dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                            <h4 className="font-bold text-sm mb-3">Estação {i+1}</h4>
                            <select onChange={(e)=>{if(!e.target.value)return; const ex=exs.find(x=>x.id===e.target.value); const ns=[...stations]; if(!ns[i].find(x=>x.id===ex.id)) ns[i].push(ex); setStations(ns);}} className="w-full p-2 text-xs mb-2 outline-none rounded"><option value="">+ Adicionar Exercício</option>{exs.map(x=><option key={x.id} value={x.id}>{x.title}</option>)}</select>
                            {st.map(x=><div key={x.id} className="text-xs p-2 bg-white dark:bg-slate-900 rounded mb-1 flex justify-between"><span>{x.title}</span><i className="fa-solid fa-xmark text-red-500 cursor-pointer" onClick={()=>{const ns=[...stations]; ns[i]=ns[i].filter(y=>y.id!==x.id); setStations(ns);}}></i></div>)}
                          </div>
                        ))}
                      </div>

                      <div className="space-y-4">
                         <div className="flex justify-between items-center"><label className="font-bold text-sm">Desaquecimento</label><button onClick={()=>handleAIGen('cDown', `Descreva atividade volta à calma 10 min idosos.`)} className="text-[10px] bg-brand-ia text-white px-2 py-1 rounded font-bold"><i className="fa-solid fa-wand-magic-sparkles"></i> Gerar IA</button></div>
                         <textarea rows="3" value={plan.cDown} onChange={e=>setPlan({...plan, cDown:e.target.value})} className="w-full p-3 border rounded dark:bg-slate-800 dark:border-slate-700 outline-none"></textarea>
                      </div>

                      <div className="text-right"><button onClick={savePlan} className="bg-brand-blue text-white px-8 py-3 rounded-lg font-bold">Salvar Planejamento</button></div>
                    </div>
                  )}

                  {cMode === 'history' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {circuits.map(c => (
                        <div key={c.id} className="bg-white dark:bg-slate-900 p-5 rounded-xl border dark:border-slate-800 shadow-sm cursor-pointer" onClick={()=>{setViewCirc(c); setCircuitMode('view');}}>
                          <p className="text-xs text-slate-400 font-bold mb-2">{c.activity_date}</p><h3 className="font-bold text-lg mb-1">{c.details?.theme || 'Sem Tema'}</h3><p className="text-sm">Resp: {c.details?.stds}</p>
                        </div>
                      ))}
                    </div>
                  )}

                  {cMode === 'view' && viewCirc && (
                    <div className="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-sm border dark:border-slate-800 space-y-6">
                      <div className="flex justify-between"><button onClick={()=>setCircuitMode('history')} className="text-slate-500 font-bold text-sm"><i className="fa-solid fa-arrow-left"></i> Voltar</button><button onClick={()=>setCircuitMode('report_edit')} className="bg-brand-blue text-white px-4 py-2 rounded text-xs font-bold">Preencher Evolução</button></div>
                      <h2 className="text-2xl font-black">{viewCirc.details?.theme}</h2><p className="text-sm">Data: {viewCirc.activity_date} | Equipe: {viewCirc.details?.stds}</p>
                      <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded"><p className="font-bold mb-2">Evolução Clínica Registrada:</p><p className="text-sm whitespace-pre-wrap">{viewCirc.details?.ev || 'Ainda não preenchida.'}</p></div>
                    </div>
                  )}

                  {cMode === 'report_edit' && (
                    <div className="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-sm border dark:border-slate-800 space-y-6">
                      <h2 className="font-bold text-xl border-b pb-2 dark:border-slate-700">Preencher Relatório/Evolução</h2>
                      
                      <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-lg">
                        <h4 className="font-bold text-sm mb-4">Lista de Presença e Sinais Vitais</h4>
                        {plan.att.map((p,i) => (
                          <div key={p.id} className="flex flex-col sm:flex-row gap-4 items-center border-b dark:border-slate-700 py-2">
                             <label className="font-bold text-sm w-32 truncate"><input type="checkbox" checked={p.present} onChange={e=>{const l=[...plan.att]; l[i].present=e.target.checked; setPlan({...plan, att:l});}} className="mr-2"/>{p.name}</label>
                             {p.present && ( <div className="flex gap-2"><input placeholder="PA Ex: 120/80" className="p-1 text-xs border rounded w-24 outline-none" onChange={e=>{const l=[...plan.att]; l[i].pa_in=e.target.value.split('/')[0]; l[i].pa_out=e.target.value.split('/')[1]; setPlan({...plan, att:l});}}/><input placeholder="FC Ex: 80/90" className="p-1 text-xs border rounded w-24 outline-none" onChange={e=>{const l=[...plan.att]; l[i].fc_in=e.target.value.split('/')[0]; l[i].fc_out=e.target.value.split('/')[1]; setPlan({...plan, att:l});}}/></div> )}
                          </div>
                        ))}
                      </div>

                      <div className="space-y-4">
                         <div className="flex justify-between items-center"><label className="font-bold text-sm">Relato Comportamental</label><button onClick={()=>handleAIGen('dev', `Escreva relato comportamental de grupo de idosos em fisioterapia.`)} className="text-[10px] bg-brand-ia text-white px-2 py-1 rounded font-bold"><i className="fa-solid fa-wand-magic-sparkles"></i> IA</button></div>
                         <textarea rows="3" value={plan.dev} onChange={e=>setPlan({...plan, dev:e.target.value})} className="w-full p-3 border rounded dark:bg-slate-800 dark:border-slate-700 outline-none"></textarea>
                      </div>

                      <div className="space-y-4">
                         <div className="flex justify-between items-center"><label className="font-bold text-sm">Evolução Sistêmica (Sinais Vitais)</label><button onClick={gerarEvolucaoIA} className="text-[10px] bg-brand-ia text-white px-2 py-1 rounded font-bold"><i className="fa-solid fa-wand-magic-sparkles"></i> Sintetizar IA</button></div>
                         <textarea rows="5" value={plan.ev} onChange={e=>setPlan({...plan, ev:e.target.value})} className="w-full p-3 border rounded dark:bg-slate-800 dark:border-slate-700 outline-none"></textarea>
                      </div>

                      <div className="text-right"><button onClick={async()=>{await supabase.from('circuits').update({details:plan}).eq('id',viewCirc.id); alert('Atualizado'); setCircuitMode('view');}} className="bg-emerald-600 text-white px-8 py-3 rounded-lg font-bold">Salvar Relatório</button></div>
                    </div>
                  )}
                </div>
              )}

              {view === 'library' && (
                <div className="max-w-6xl mx-auto">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
                    {exs.map(e => {
                       const ytId = getYouTubeId(e.videoUrl); const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null;
                       return (
                         <div key={e.id} className="bg-white dark:bg-slate-900 rounded-xl overflow-hidden shadow-sm border dark:border-slate-800">
                           <div className="h-40 bg-slate-200 dark:bg-slate-800 relative flex items-center justify-center">
                             {thumb ? <><img src={thumb} className="w-full h-full object-cover opacity-80"/><i className="fa-brands fa-youtube absolute text-4xl text-red-600 drop-shadow-md"></i></> : <i className="fa-solid fa-dumbbell text-4xl text-slate-400"></i>}
                           </div>
                           <div className="p-4"><p className="text-[10px] uppercase font-bold text-brand-blue mb-1">{CATS[e.category]?.t || 'Geral'}</p><h3 className="font-bold text-sm line-clamp-2">{e.title}</h3></div>
                         </div>
                       )
                    })}
                  </div>
                </div>
              )}

              {view === 'admin' && isAdmin && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-sm border dark:border-slate-800"><h2 className="text-xl font-bold mb-4">Painel Administrativo</h2><p className="text-sm text-slate-500">Integração funcional restrita a gestores.</p></div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const AppContainer = () => {
      const [user, setUser] = useState(null);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

      useEffect(() => {
        if (darkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); } 
        else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
      }, [darkMode]);

      useEffect(() => {
        supabase.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
            setUser({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', team_group: profile?.team_group });
          }
        });
      }, []);

      return user ? <Dashboard session={user} onLogout={async () => { await supabase.auth.signOut(); setUser(null); }} setDarkMode={setDarkMode} darkMode={darkMode} /> : <LoginPage onLogin={setUser} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppContainer />);
  </script>
</body>
</html>
