  <script>
    window.onerror = function(msg, url, lineNo) {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `<div style="padding: 40px; background: #fff1f2; color: #be123c; min-height: 100vh; font-family: sans-serif;">
            <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 10px;">Ops! Ocorreu um erro</h1>
            <div style="background: #fecdd3; padding: 20px; border-radius: 12px; margin-top: 20px; font-family: monospace;">
              <strong>Mensagem:</strong> ${msg}<br/><br/><strong>Linha:</strong> ${lineNo}
            </div></div>`;
      }
      return false;
    };
  </script>

  <!-- Bibliotecas Principais -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>

      theme: { extend: { colors: { brand: { blue: '#202B5C', dark: '#161E42', red: '#D12836', redDark: '#A81A26', light: '#F8FAFC' } } } }
    }

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    const SUPABASE_URL = "https://rewkwzxuogdopzkqliwi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld2t3enh1b2dkb3B6a3FsaXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDc3MjYsImV4cCI6MjEwMzI4MzcyNn0.ZW_KB3wl21aB00zCcyEqBQbOOFpGdOoxuctwU-6ICFM";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // CATEGORIAS & AGENDA 2026.2
    // ==========================================
    const CATEGORIES = {
      'mmss': { title: 'Exercícios de mobilidade e fortalecimento de MMSS e tronco', shortTitle: 'MMSS e Tronco', icon: 'fa-child-reaching', subgroups: ['Todos', 'Bíceps', 'Tríceps', 'Peito', 'Costas', 'Abdômen', 'Ombro', 'Punho', 'Outro'] },
      'mmii': { title: 'Exercícios de mobilidade e fortalecimento muscular de membros inferiores', shortTitle: 'Membros Inferiores', icon: 'fa-person-walking', subgroups: ['Todos', 'Quadríceps', 'Glúteos', 'Isquiotibiais', 'Panturrilhas', 'Tornozelo e Pé', 'Outro'] },
      'cardio': { title: 'Exercícios aeróbicos e condicionamento cardiorrespiratório', shortTitle: 'Aeróbicos e Cardio', icon: 'fa-heart-pulse', subgroups: ['Todos', 'Caminhada', 'Marcha', 'Circuitos', 'Resistência Contínua', 'Outro'] },
      'dupla_tarefa': { title: 'Exercícios de dupla tarefa (motora, cognitiva e controle postural)', shortTitle: 'Dupla Tarefa', icon: 'fa-brain', subgroups: ['Todos', 'Motora', 'Cognitiva', 'Motora + Cognitiva', 'Controle Postural', 'Equilíbrio', 'Coordenação', 'Atenção Dividida', 'Outro'] }

    const AGENDA_DATA = [
      { act: 17, date: "14/08/2026", title: "RETORNO DAS ATIVIDADES: Gincana/ dinâmica", resp: "Todos os integrantes do projeto" },
      { act: 18, date: "21/08/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros superiores", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 19, date: "28/08/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros inferiores", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 20, date: "04/09/2026", title: "Exercícios aeróbicos e condicionamento cardiorrespiratório", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 21, date: "11/09/2026", title: "Exercícios de dupla tarefa (motora, cognitiva e controle postural)", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 22, date: "18/09/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros superiores", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 23, date: "25/09/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros inferiores", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 24, date: "02/10/2026", title: "Exercícios aeróbicos e condicionamento cardiorrespiratório", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 25, date: "09/10/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros inferiores", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 26, date: "16/10/2026", title: "Atividade educativa em saúde e promoção do autocuidado", resp: "Todos" },
      { act: 27, date: "23/10/2026", title: "Exercícios aeróbicos e condicionamento cardiorrespiratório", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 28, date: "30/10/2026", title: "Exercícios de dupla tarefa (motora, cognitiva e controle postural)", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 29, date: "06/11/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros superiores", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 30, date: "13/11/2026", title: "Exercícios de mobilidade e fortalecimento muscular de membros inferiores", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 31, date: "27/11/2026", title: "Avaliação participativa dos participantes e planejamento", resp: "Todos" },
      { act: 32, date: "04/12/2026", title: "Atividade temática de integração/confraternização e encerramento", resp: "Todos" }
    ];

    // ==========================================
    // TELA DE LOGIN & CADASTRO
    // ==========================================
    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError(''); setSuccessMsg('');

        if (isLogin) {
          const { data, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (authError) {
            setError(authError.message.includes("Invalid login") ? "E-mail ou senha incorretos." : "Erro: " + authError.message);
            setLoading(false); return;
          }
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
          onLogin({ 
            id: data.user.id, 
            email: data.user.email, 
            full_name: profile?.full_name || data.user?.user_metadata?.full_name || 'Monitor', 
            role: profile?.role || 'Monitor' 
          });
        } else {
          const { data, error: signUpError } = await supabaseClient.auth.signUp({ 
            email, password, options: { data: { full_name: name } } 
          });
          if (signUpError) { setError("Erro ao criar conta: " + signUpError.message); } 
          else {
            if (data.user) {
              await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name: name, role: 'Monitor' }]);
              setSuccessMsg("Conta criada com sucesso! Faça o login agora.");
              setIsLogin(true); setPassword('');
            }
          }
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
            <div className="bg-brand-blue p-8 text-center relative">
              <img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo ATIVIDOSO" className="h-16 mx-auto mb-4 object-contain" onError={(e) => { e.target.style.display = 'none'; document.getElementById('fallbackLogo').classList.remove('hidden'); }} />
              <div id="fallbackLogo" className="hidden"><div className="w-16 h-16 bg-white rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg"><i className="fa-solid fa-lock text-brand-red text-3xl"></i></div><h2 className="text-2xl font-black text-white">ATIVIDOSO</h2></div>
              <p className="text-emerald-400 text-xs font-bold uppercase tracking-widest opacity-90">{isLogin ? 'Acesso ao Sistema' : 'Novo Cadastro'}</p>
            </div>
            <div className="p-8">
              {successMsg && <div className="bg-emerald-50 text-emerald-700 p-4 rounded-xl text-xs font-bold border border-emerald-200 mb-6 text-center"><i className="fa-solid fa-check-circle mr-1"></i> {successMsg}</div>}
              <form onSubmit={handleSubmit} className="space-y-5">
                {!isLogin && (
                  <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nome Completo</label><input type="text" value={name} onChange={e=>setName(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-blue outline-none text-sm transition" placeholder="Seu nome verdadeiro" /></div>
                )}
                <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-blue outline-none text-sm transition" placeholder="seu@email.com" /></div>
                <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Senha {(!isLogin) && "(Mínimo 6 caracteres)"}</label>
                  <div className="relative">
                    <input type={showPassword ? "text" : "password"} value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-blue outline-none text-sm transition" placeholder="••••••••" />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3 text-slate-400 hover:text-brand-blue transition"><i className={showPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye"}></i></button>
                  </div>
                </div>
                {error && <div className="bg-rose-50 text-rose-600 p-4 rounded-xl text-xs font-bold border border-rose-200"><i className="fa-solid fa-circle-exclamation mr-1"></i> {error}</div>}
                <button type="submit" disabled={loading} className="w-full bg-brand-blue hover:bg-brand-dark text-white font-bold py-3.5 rounded-xl transition shadow-md mt-2">{loading ? 'Aguarde...' : (isLogin ? 'Entrar' : 'Criar Conta de Monitor')}</button>
              </form>
              <div className="mt-6 text-center">
                <button onClick={() => {setIsLogin(!isLogin); setError(''); setSuccessMsg('');}} className="text-xs font-bold text-slate-500 hover:text-brand-blue transition">{isLogin ? "Primeira vez? Cadastre-se aqui." : "Já possui conta? Clique para Entrar."}</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // PLATAFORMA / DASHBOARD
    // ==========================================
    const Dashboard = ({ session, onLogout }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      // Estados de Navegação e Responsividade
      const [currentView, setCurrentView] = useState('library');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [selectedExercise, setSelectedExercise] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      
      // Dados do Banco
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      
      // FORMULÁRIO DE CADASTRO DE EXERCÍCIO (COM UPLOAD)
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ 
        title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', 
        videoUrl: '', instructions: '', precautions: '' 
      });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false, error: '' });

      // ESTAÇÕES, AULA E RELATÓRIO
      // Modos: 'agenda', 'plan' (Planejar Aula), 'history' (Lista), 'view' (Ver PDF/Aula), 'report_edit' (Preencher Relatório)
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);

      // ÚNICO ESTADO PARA O PLANO DE AULA E RELATÓRIO
      const [planDetails, setPlanDetails] = useState({
        activityNum: '', theme: '', date: '', students: '', 
        warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''],
        proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', 
        specialCare: '', materials: '', developmentNarrative: '', resultObtained: '', attendanceCount: ''
      });

      // Busca Inicial
      useEffect(() => {
        const fetchData = async () => {
          const { data: exData } = await supabaseClient.from('exercises').select('*').order('created_at', { ascending: false });
          if (exData) setExercises(exData);
          const { data: circData } = await supabaseClient.from('circuits').select('*').order('created_at', { ascending: false });
          if (circData) setSavedCircuits(circData);
        };
        fetchData();
      }, [currentView, circuitMode]);

      const pendingCount = exercises.filter(ex => ex.status === 'pending').length;
      const approvedExercises = exercises.filter(ex => ex.status === 'approved');

      // Função Auxiliar para Navegação Mobile
      const handleNavClick = (view, mode = null) => {
        setCurrentView(view);
        if(mode) setCircuitMode(mode);
        setIsMobileMenuOpen(false); 
      };

      // Extrator de Thumb do YouTube
      const getYouTubeId = (url) => {
        if (!url) return null;
        const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
        return match ? match[1] : null;
      };

      const filteredExercises = useMemo(() => {
        return approvedExercises.filter(ex => {
          const matchCat = filterCat === 'all' || ex.category === filterCat;
          const matchSub = filterSub === 'Todos' || ex.muscleGroup === filterSub;
          const matchSearch = ex.title.toLowerCase().includes(searchQuery.toLowerCase()) || ex.muscleGroup.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSub && matchSearch;
        });
      }, [searchQuery, filterCat, filterSub, approvedExercises]);

      // ======= FUNÇÕES DE EXERCÍCIOS =======
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        setFormStatus({ loading: true, success: false, error: '' });
        
        let uploadedMediaUrl = null;

        if (mediaFile) {
          const fileExt = mediaFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          
          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('midia_exercicios')
            .upload(fileName, mediaFile);

          if (uploadError) {
            setFormStatus({ loading: false, success: false, error: 'Erro ao enviar mídia. Verifique permissões do Supabase.' });
            return;
          }

          const { data: publicUrlData } = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName);
          uploadedMediaUrl = publicUrlData.publicUrl;
        }

        const finalMuscleGroup = formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect;
        
        const newExercise = {
          title: formData.title, category: formCat, "muscleGroup": finalMuscleGroup,
          difficulty: formData.difficulty, equipment: formData.equipment, dosage: formData.dosage,
          "videoUrl": formData.videoUrl, "mediaUrl": uploadedMediaUrl, instructions: formData.instructions, precautions: formData.precautions,
          status: 'pending', author: session.full_name
        };
        
        const { error } = await supabaseClient.from('exercises').insert([newExercise]);
        if (error) {
          setFormStatus({ loading: false, success: false, error: error.message });
        } else {
          setFormStatus({ loading: false, success: true, error: '' });
          setFormData({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
          setFormCat(''); setFormMuscleSelect(''); setFormCustomMuscle(''); setMediaFile(null);
        }
      };

      const handleApprove = async (id) => {
        await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id);
        setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex));
      };
      
      const handleReject = async (id) => {
        await supabaseClient.from('exercises').delete().eq('id', id);
        setExercises(exercises.filter(ex => ex.id !== id));
      };

      const handleDeleteExercise = async (id) => {
        if(window.confirm("ATENÇÃO: Você está prestes a apagar este exercício.\nEsta ação não tem volta. Tem certeza?")) {
          await supabaseClient.from('exercises').delete().eq('id', id);
          setExercises(exercises.filter(ex => ex.id !== id));
          setCurrentView('library');
        }
      };

      // ======= FUNÇÕES DE RELATÓRIOS E PLANEJAMENTO =======
      const startPlanning = () => {
        setPlanDetails({ activityNum: '', theme: '', date: '', students: '', proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], developmentNarrative: '', resultObtained: '', attendanceCount: '' });
        setCircuit([[], [], [], [], []]);
        setCircuitMode('plan');
      };

      const startEditingReport = () => {
        setPlanDetails(viewingCircuit.details);
        setCircuitMode('report_edit');
      };

      const handleDeleteCircuit = async (id) => {
        if(window.confirm("ATENÇÃO: Deseja apagar este Registro permanentemente?")) {
          await supabaseClient.from('circuits').delete().eq('id', id);
          setSavedCircuits(savedCircuits.filter(c => c.id !== id));
          setCircuitMode('history');
        }
      };

      const addToCircuit = (stationIndex, exerciseId) => {
        if (!exerciseId) return;
        const exercise = approvedExercises.find(ex => ex.id === exerciseId);
        if (!exercise) return;
        const newCircuit = [...circuit];
        if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) {
          newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise];
          setCircuit(newCircuit);
        }
      };

      const removeFromCircuit = (stationIndex, exerciseId) => {
        const newCircuit = [...circuit];
        newCircuit[stationIndex] = newCircuit[stationIndex].filter(ex => ex.id !== exerciseId);
        setCircuit(newCircuit);
      };

      const updateStationResponsible = (index, value) => {
        const updated = [...planDetails.stationResponsibles];
        updated[index] = value;
        setPlanDetails({ ...planDetails, stationResponsibles: updated });
      };

      // Salva o Planejamento (Apenas a estrutura da aula)
      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Preencha Número, Tema e Data!');
        const newSavedCircuit = { activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name };
        const { data, error } = await supabaseClient.from('circuits').insert([newSavedCircuit]).select();
        if (error) {
          alert('Erro ao salvar planejamento: ' + error.message);
        } else {
          alert('Atividade Planejada com Sucesso!');
          setSavedCircuits([data[0], ...savedCircuits]);
          setCircuitMode('history');
        }
      };

      // Salva a atualização do Relatório (Após a aula)
      const handleUpdateReport = async () => {
        const updatedCircuit = { ...viewingCircuit, details: planDetails };
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (error) {
          alert('Erro ao atualizar relatório: ' + error.message);
        } else {
          alert('Relatório preenchido com sucesso!');
          setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? updatedCircuit : c));
          setViewingCircuit(updatedCircuit);
          setCircuitMode('view');
        }
      };

      const handleGeneratePDF = (circuitData) => {
        const d = circuitData.details;
        const dateFormatted = circuitData.activity_date.split('-').reverse().join('/');
        
        let stationsHtml = '';
        circuitData.stations.forEach((station, idx) => {
          let exercisesHtml = station.length === 0 ? '<p style="font-size: 13px; color: #555;"><i>Sem exercícios vinculados.</i></p>' : '<ul style="margin-top: 5px; padding-left: 20px; font-size: 13px;">' + station.map(ex => `<li><strong>${ex.title}</strong> (${ex.dosage})</li>`).join('') + '</ul>';
          stationsHtml += `
            <div style="margin-bottom: 15px; border-left: 2px solid #D12836; padding-left: 10px;">
              <strong>Estação ${idx + 1} ${idx === 4 ? '- Circuito Funcional' : ''}</strong><br/>
              Responsáveis: ${d.stationResponsibles?.[idx] || 'Não informado'}<br/>
              ${exercisesHtml}
            </div>
          `;
        });

        const element = document.createElement('div');
        element.innerHTML = `
          <div style="font-family: Arial, sans-serif; font-size: 14px; color: #333; line-height: 1.6; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
              <img src="Logo_ATV_2024_Colorido_v2.png" alt="ATIVIDOSO" style="max-height: 80px; margin-bottom: 10px;" />
              <h2 style="margin: 0; font-size: 18px; color: #161E42; text-transform: uppercase;">
                ATIVIDADE ${d.activityNum || 'X'} – ${d.theme || 'TEMA NÃO INFORMADO'}
              </h2>
            </div>
            
            <p><strong>DATA DE REALIZAÇÃO:</strong> ${dateFormatted}</p>
            <p><strong>DISCENTES RESPONSÁVEIS:</strong> ${d.students || 'Não informado'}</p>
            <br/>
            
            <p><strong>ATIVIDADE(S) PROPOSTA(S):</strong><br/>

                        <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Quantitativo de Idosos Presentes</label><input type="text" value={planDetails.attendanceCount} onChange={e=>setPlanDetails({...planDetails, attendanceCount: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm" placeholder="Ex: 32 pessoas idosas." /></div>

                        <div className="pt-6 mt-8 border-t border-slate-200 flex justify-end">
                          <button onClick={handleUpdateReport} className="w-full sm:w-auto px-8 py-3.5 bg-brand-blue hover:bg-brand-dark text-white font-black rounded-xl shadow-md transition flex items-center justify-center gap-2"><i className="fa-solid fa-save"></i> Salvar Relatório</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ABA: HISTÓRICO EM LISTA */}
                  {circuitMode === 'history' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-in">
                      {savedCircuits.length === 0 ? (
                        <div className="col-span-full text-center py-12"><i className="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i><p className="text-slate-500">Nenhum registro salvo no histórico ainda.</p></div>
                      ) : (
                        savedCircuits.map(circ => (
                          <div key={circ.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-lg transition cursor-pointer flex flex-col" onClick={() => {setViewingCircuit(circ); setCircuitMode('view');}}>
                            <div className="flex justify-between items-start mb-4">
                              <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${circ.details?.resultObtained ? 'bg-brand-blue/10 text-brand-blue' : 'bg-emerald-100 text-emerald-600'}`}>
                                <i className={`fa-solid ${circ.details?.resultObtained ? 'fa-file-pdf' : 'fa-calendar-check'}`}></i>
                              </div>
                              <span className="text-[10px] font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">{circ.activity_date.split('-').reverse().join('/')}</span>
                            </div>
                            <h3 className="text-lg font-black text-slate-800 mb-1 leading-tight">Atividade {circ.details?.activityNum || '-'}</h3>
                            <p className="text-xs font-bold text-slate-500 mb-4 line-clamp-2">{circ.details?.theme || 'Tema não informado'}</p>
                            <button className={`mt-auto pt-4 border-t border-slate-100 text-sm font-bold flex items-center gap-2 group ${circ.details?.resultObtained ? 'text-brand-blue' : 'text-emerald-600'}`}>
                              {circ.details?.resultObtained ? 'Abrir Relatório Final / PDF' : 'Ver Aula / Preencher Relatório'} <i className="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  )}

                  {/* ABA: VISUALIZANDO AULA / RELATÓRIO SALVO */}
                  {circuitMode === 'view' && viewingCircuit && (
                    <div className="space-y-6 animate-fade-in pb-12">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
                        <button onClick={() => setCircuitMode('history')} className="w-full md:w-auto px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition text-sm flex items-center justify-center"><i className="fa-solid fa-arrow-left mr-2"></i> Voltar</button>
                        <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                          {isAdmin && (
                             <button onClick={() => handleDeleteCircuit(viewingCircuit.id)} className="w-full sm:w-auto px-5 py-2.5 bg-white border border-rose-200 text-rose-500 hover:bg-rose-50 font-bold rounded-xl transition text-sm flex items-center justify-center"><i className="fa-solid fa-trash mr-2"></i> Apagar</button>
                          )}
                          <button onClick={startEditingReport} className="w-full sm:w-auto px-5 py-2.5 bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 font-bold rounded-xl transition text-sm shadow-sm flex items-center justify-center"><i className="fa-solid fa-pen-to-square mr-2"></i> Preencher / Editar Relatório</button>
                          <button onClick={() => handleGeneratePDF(viewingCircuit)} className="w-full sm:w-auto px-5 py-2.5 bg-brand-blue hover:bg-brand-dark text-white font-bold rounded-xl transition text-sm shadow-md flex items-center justify-center"><i className="fa-solid fa-download mr-2"></i> Baixar PDF</button>
                        </div>
                      </div>

                      <div className="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-slate-200 text-sm text-slate-800 leading-relaxed font-serif overflow-x-hidden">
                        <div className="text-center mb-8">
                          <img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo" className="h-16 mx-auto mb-4 object-contain" onError={(e) => e.target.style.display='none'} />
                          <h2 className="font-black uppercase text-base break-words">ATIVIDADE {viewingCircuit.details?.activityNum || 'X'} – {viewingCircuit.details?.theme}</h2>
                        </div>
                        
                        <p className="mb-2"><strong>DATA DE REALIZAÇÃO DA ATIVIDADE:</strong> {viewingCircuit.activity_date.split('-').reverse().join('/')}</p>
                        <p className="mb-6"><strong>DISCENTES RESPONSÁVEIS PELA ATIVIDADE:</strong> {viewingCircuit.details?.students || '-'}</p>
                        
                        <p className="font-bold mb-1">ATIVIDADE(S) PROPOSTA(S):</p>
                        <p className="mb-6 whitespace-pre-line break-words">{viewingCircuit.details?.proposedActivities || 'Não informado no planejamento.'}</p>

                        <p className="font-bold mb-1">OBJETIVO(S) DA(S) ATIVIDADE(S):</p>
                        <p className="mb-6 text-justify whitespace-pre-line break-words">{viewingCircuit.details?.objectives || 'Não informado.'}</p>

                        <p className="font-bold mb-1">OBSERVAÇÕES OPERACIONAIS:</p>
                        <ul className="mb-6 list-disc list-inside">
                          <li>Registro dos sinais vitais: {viewingCircuit.details?.vitalSigns || '-'}</li>
                          <li>Som, tempo e fotos: {viewingCircuit.details?.soundAndPhotos || '-'}</li>
                          <li>Cuidados especiais: {viewingCircuit.details?.specialCare || '-'}</li>
                        </ul>

                        <p className="font-bold mb-1">MATERIAIS UTILIZADOS:</p>
                        <p className="mb-6 whitespace-pre-line break-words">{viewingCircuit.details?.materials || 'Não informado.'}</p>

                        <p className="font-bold mb-1">DESENVOLVIMENTO DA ATIVIDADE:</p>
                        <p className="mb-2"><strong>Aquecimento:</strong> {viewingCircuit.details?.warmUp || 'Não informado.'}</p>
                        
                        <div className="mb-4 pl-4 border-l-2 border-slate-200 py-2">
                          {viewingCircuit.stations && viewingCircuit.stations.map((station, idx) => (
                            <div key={idx} className="mb-3">
                              <p className="font-bold">Estação {idx + 1} {idx === 4 ? "- Circuito Funcional" : ""}</p>
                              <p className="text-xs text-slate-500 mb-1">Responsáveis: {viewingCircuit.details?.stationResponsibles?.[idx]}</p>
                              <ul className="list-disc list-inside text-xs">
                                {station.length === 0 ? <li>Sem exercícios vinculados.</li> : station.map(ex => <li key={ex.id}>{ex.title} - {ex.dosage}</li>)}
                              </ul>
                            </div>
                          ))}
                        </div>

                        <p className="mb-6"><strong>Desaquecimento:</strong> {viewingCircuit.details?.coolDown}</p>

                        <p className="font-bold mb-1">RELATO NARRATIVO PÓS-AULA:</p>
                        <p className="mb-6 text-justify whitespace-pre-line break-words">{viewingCircuit.details?.developmentNarrative || 'Relatório ainda não preenchido.'}</p>

                        <p className="font-bold mb-1">RESULTADO OBTIDO COM A ATIVIDADE:</p>
                        <p className="mb-6 text-justify whitespace-pre-line break-words">{viewingCircuit.details?.resultObtained || 'Relatório ainda não preenchido.'}</p>

                        <p><strong>QUANTITATIVO DE IDOSOS:</strong> {viewingCircuit.details?.attendanceCount || 'Não informado.'}</p>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ==========================================
                  TELA: HOME
              ========================================== */}
              {currentView === 'home' && (
                <div className="max-w-6xl mx-auto space-y-6">
                  <div className="bg-gradient-to-r from-brand-blue to-brand-dark p-6 sm:p-8 rounded-3xl text-white shadow-lg relative overflow-hidden">
                    <h1 className="text-2xl sm:text-3xl font-black mb-2 relative z-10">Olá, {session.full_name.split(' ')[0]}! 👋</h1>
                    <p className="text-slate-300 font-medium relative z-10 text-sm sm:text-base">Bem-vindo(a) ao painel de controle do ATIVIDOSO.</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4"><div className="w-14 h-14 rounded-xl bg-blue-50 text-brand-blue flex items-center justify-center text-2xl shrink-0"><i className="fa-solid fa-dumbbell"></i></div><div><p className="text-xs font-bold text-slate-400 uppercase">Aprovados</p><p className="text-3xl font-black text-slate-800">{approvedExercises.length}</p></div></div>
                    {isAdmin && <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4"><div className="w-14 h-14 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl shrink-0"><i className="fa-solid fa-clock-rotate-left"></i></div><div><p className="text-xs font-bold text-slate-400 uppercase">Aprovações Pendentes</p><p className="text-3xl font-black text-slate-800">{pendingCount}</p></div></div>}
                  </div>
                </div>
              )}

              {/* ==========================================
                  TELA: BIBLIOTECA
              ========================================== */}
              {currentView === 'library' && (
                <div className="max-w-6xl mx-auto">
                  <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm mb-6">
                    <div className="relative flex-1 w-full mb-4">
                      <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                      <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Pesquisar por nome ou músculo..." className="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none text-sm" />
                    </div>
                    <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                      <button onClick={() => {setFilterCat('all'); setFilterSub('Todos');}} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition border shadow-sm ${filterCat === 'all' ? 'bg-brand-blue text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>Visão Geral</button>
                      {Object.keys(CATEGORIES).map(key => (
                        <button key={key} onClick={() => {setFilterCat(key); setFilterSub('Todos');}} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition border shadow-sm ${filterCat === key ? 'bg-brand-blue text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>{CATEGORIES[key].shortTitle}</button>
                      ))}
                    </div>
                    {filterCat !== 'all' && (
                      <div className="flex gap-2 mt-3 overflow-x-auto pb-1 no-scrollbar items-center">
                        <i className="fa-solid fa-arrow-turn-up fa-rotate-90 text-slate-300 text-xs ml-2 mr-2 shrink-0"></i>
                        {CATEGORIES[filterCat].subgroups.map(sub => (
                          <button key={sub} onClick={() => setFilterSub(sub)} className={`px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition border ${filterSub === sub ? 'bg-brand-red text-white' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>{sub}</button>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredExercises.map(ex => {
                      const ytId = getYouTubeId(ex.videoUrl);
                      const ytThumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null;
                      const isImage = ex.mediaUrl && ex.mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)/i);
                      const isVideo = ex.mediaUrl && ex.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i);

                      return (
                        <div key={ex.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col group cursor-pointer" onClick={() => { setSelectedExercise(ex); setCurrentView('detail'); }}>
                          <div className="h-48 bg-slate-100 flex items-center justify-center relative overflow-hidden">
                            {ytThumb ? ( 
                              <img src={ytThumb} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /> 
                            ) : isImage ? (
                              <img src={ex.mediaUrl} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                            ) : isVideo ? (
                              <div className="w-full h-full bg-slate-200 flex flex-col items-center justify-center group-hover:bg-slate-300 transition">
                                 <i className="fa-solid fa-film text-4xl text-slate-400 mb-2"></i>
                                 <span className="text-xs font-bold text-slate-500 uppercase">Vídeo Anexado</span>
                              </div>
                            ) : ( 
                              <i className="fa-solid fa-dumbbell text-4xl text-slate-300"></i> 
                            )}
                            <div className="absolute inset-0 bg-brand-dark/10 group-hover:bg-brand-dark/30 transition flex items-center justify-center"><i className="fa-solid fa-eye text-white text-3xl opacity-0 group-hover:opacity-100 transition"></i></div>
                          </div>
                          
                          <div className="p-5 sm:p-6">
                            <span className="text-[10px] font-black uppercase tracking-widest text-brand-red bg-red-50 px-2 py-1 rounded border border-red-100 mb-2 inline-block">{ex.muscleGroup}</span>
                            <h3 className="font-black text-slate-800 text-lg leading-tight mb-2">{ex.title}</h3>
                          </div>
                        </div>
                      )
                    })}
                    {filteredExercises.length === 0 && (
                      <div className="col-span-full text-center py-12"><i className="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i><p className="text-slate-500">Nenhum exercício encontrado.</p></div>
                    )}
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    // INICIALIZAÇÃO
    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || session.user.user_metadata?.full_name || 'Monitor', role: profile?.role || 'Monitor' });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center"><p className="text-brand-blue font-bold">Iniciando...</p></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
