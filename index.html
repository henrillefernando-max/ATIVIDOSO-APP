      const getYouTubeId = (url) => {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      };

      const upcomingActivity = useMemo(() => {
        const hoje = new Date();
        const numeroHoje = parseInt(`${hoje.getFullYear()}${String(hoje.getMonth() + 1).padStart(2, '0')}${String(hoje.getDate()).padStart(2, '0')}`);
        for (let item of AGENDA_DATA) {
          const [d, m, y] = item.date.split('/'); 
          if (parseInt(`${y}${m}${d}`) >= numeroHoje) return item; 
        }
        return null; 
      }, []);

      const isMyTurn = useMemo(() => {
        if (!upcomingActivity || !session?.team_group || session.team_group === 'Nenhum') return false;
        return upcomingActivity.resp.toLowerCase().includes(session.team_group.toLowerCase()) || upcomingActivity.resp.toLowerCase().includes('todos');
      }, [upcomingActivity, session]);

      const handleSaveProfile = async (e) => {
        e.preventDefault(); setProfileStatus('Salvando alterações...');
        let newAvatarUrl = session.avatar_url;
        if (profileAvatarFile) {
          const fileName = `avatar_${session.id}_${Date.now()}.${profileAvatarFile.name.split('.').pop()}`;
          const { error } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, profileAvatarFile);
          if (!error) newAvatarUrl = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName).data.publicUrl;
        }
        const { error } = await supabaseClient.from('profiles').update({ full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }).eq('id', session.id);
        if(!error) { setProfileStatus('Perfil atualizado.'); updateSessionData({ ...session, full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }); } else { setProfileStatus('Erro.'); }
      };

      const handleUpdateMember = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.from('profiles').update({ full_name: editingMember.full_name, team_group: editingMember.team_group, role: editingMember.role }).eq('id', editingMember.id);
        if(!error) { setTeamMembers(teamMembers.map(m => m.id === editingMember.id ? editingMember : m)); setEditingMember(null); alert("Perfil modificado com sucesso."); } else { alert("Erro na atualização: " + error.message); }
      };

      const handlePostAnnouncement = async (e) => {
        e.preventDefault();
        const { data, error } = await supabaseClient.from('announcements').insert([{ title: newAnnouncement.title, content: newAnnouncement.content, link_url: newAnnouncement.link_url || null, author: session.full_name }]).select();
        if (error) alert("Falha na submissão: " + error.message); else if (data) { setAnnouncements([data[0], ...announcements]); setNewAnnouncement({ title: '', content: '', link_url: '' }); }
      };

      const handleDeleteAnnouncement = async (id) => { 
        if(window.confirm("Confirmar exclusão deste registro?")) { 
          const { error } = await supabaseClient.from('announcements').delete().eq('id', id); 
          if (error) alert("Erro na exclusão: " + error.message); else setAnnouncements(announcements.filter(a => a.id !== id)); 
        } 
      };

      const handleSendCustomEmail = async (e) => {
         e.preventDefault();
         if (!customEmailDest) return alert("Preencha o campo de e-mail do destinatário.");
         setEmailStatus('Processando envio...');
         try {
            const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
               method: 'POST', headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ service_id: 'service_kciprxo', template_id: 'template_0gf0p9l', user_id: 'GiJe0KFVPsrE8JpC8', template_params: { to_email: customEmailDest, message: customEmailMessage } })
            });
            if (response.ok) { setEmailStatus(''); setCustomEmailDest(''); setCustomEmailMessage(''); alert("E-mail encaminhado com sucesso."); } else { alert("Falha no servidor SMTP: " + await response.text()); setEmailStatus('Erro na operação.'); }
         } catch (err) { alert("Falha de rede: " + err.message); setEmailStatus('Erro na conexão.'); }
      };

      const handleSendEmail = () => {
         const subject = "Aviso Coordenação ATIVIDOSO - Planejamento";
         const body = `Monitor(a),\n\nLembramos que o seu grupo está responsável por realizar a próxima atividade.\n\nAcesse o sistema ATIVIDOSO para realizar o planejamento prévio e documentar a atividade na aba 'Aulas e Diário Clínico'.\n\nCoordenação ATIVIDOSO`;
         window.open(`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`, '_blank');
      }; 

      const handleFormSubmit = async (e) => {
        e.preventDefault(); setFormStatus({ loading: true, success: false });
        let url = null;
        if (mediaFile) {
          const fName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${mediaFile.name.split('.').pop()}`;
          await supabaseClient.storage.from('midia_exercicios').upload(fName, mediaFile);
          url = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fName).data.publicUrl;
        }
        const ex = { title: formData.title, category: formCat, "muscleGroup": formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect, difficulty: formData.difficulty, equipment: formData.equipment, dosage: formData.dosage, "videoUrl": formData.videoUrl, "mediaUrl": url, instructions: formData.instructions, precautions: formData.precautions, status: 'pending', author: session.full_name };
        const { error } = await supabaseClient.from('exercises').insert([ex]);
        if (!error) { setFormStatus({ loading: false, success: true }); setFormData({ title:'', difficulty:'Iniciante / Leve', equipment:'Nenhum', dosage:'', videoUrl:'', instructions:'', precautions:'' }); setFormCat(''); setFormMuscleSelect(''); setMediaFile(null); } else { setFormStatus({ loading: false, success: false }); alert("Falha no envio de dados: " + error.message); }
      };

      const handleApprove = async (id) => { await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id); setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex)); };
      const handleReject = async (id) => { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); };
      const handleDeleteExercise = async (id) => { if(window.confirm("Confirmar exclusão definitiva do registro clínico?")) { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); setCurrentView('library'); } };

      const handleAddParticipant = async () => {
        const name = prompt('Insira o nome completo do paciente/participante:');
        if(name) {
          const { data, error } = await supabaseClient.from('participants').insert([{ name }]).select();
          if(!error && data) {
            setParticipantsList([...participantsList, data[0]].sort((a,b)=>a.name.localeCompare(b.name)));
            if (circuitMode === 'report_edit') setPlanDetails({...planDetails, attendanceList: [...planDetails.attendanceList, { id: data[0].id, name: data[0].name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }].sort((a,b)=>a.name.localeCompare(b.name))});
          } else {
             const newP = { id: Date.now().toString(), name: name };
             setParticipantsList([...participantsList, newP].sort((a,b)=>a.name.localeCompare(b.name)));
             if (circuitMode === 'report_edit') setPlanDetails({...planDetails, attendanceList: [...planDetails.attendanceList, { ...newP, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }].sort((a,b)=>a.name.localeCompare(b.name))});
          }
        }
      };

      const updateAttendance = (idx, field, val) => {
         const list = [...planDetails.attendanceList]; list[idx][field] = val;
         setPlanDetails({ ...planDetails, attendanceList: list, attendanceCount: field === 'present' ? list.filter(p=>p.present).length.toString() : planDetails.attendanceCount });
      };

      const startPlanning = () => { setPlanDetails({ activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['','','','',''], proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] }); setCircuit([[],[],[],[],[]]); setCircuitMode('plan'); };
      
      const startEditingReport = () => { 
        let list = viewingCircuit.details.attendanceList || [];
        if (list.length === 0) list = participantsList.map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
        else { const ids = list.map(c=>c.id); const newParts = participantsList.filter(p=>!ids.includes(p.id)).map(p=>({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' })); list = [...list, ...newParts].sort((a,b)=>a.name.localeCompare(b.name)); }
        setPlanDetails({ ...viewingCircuit.details, attendanceList: list }); setCircuitMode('report_edit'); 
      };

      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Campos obrigatórios: Número, Tema e Data.');
        const { data, error } = await supabaseClient.from('circuits').insert([{ activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name }]).select();
        if (!error) { alert('Registro efetuado no sistema.'); setSavedCircuits([data[0], ...savedCircuits]); setCircuitMode('history'); clearDraft(); } else alert('Erro de persistência: ' + error.message);
      };

      const handleUpdateReport = async () => {
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (!error) { alert('Documento clínico atualizado.'); setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? { ...c, details: planDetails } : c)); setViewingCircuit({ ...viewingCircuit, details: planDetails }); setCircuitMode('view'); clearDraft(); } else alert('Falha na atualização: ' + error.message);
      };

      const handleDeleteCircuit = async (id) => { if(window.confirm("Confirmar exclusão deste documento na base de dados?")) { await supabaseClient.from('circuits').delete().eq('id', id); setSavedCircuits(savedCircuits.filter(c => c.id !== id)); setCircuitMode('history'); } };
      
      const addToCircuit = (stationIndex, exerciseId) => { if (!exerciseId) return; const exercise = approvedExercises.find(ex => ex.id === exerciseId); if (!exercise) return; const newCircuit = [...circuit]; if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) { newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise]; setCircuit(newCircuit); } };
      const removeFromCircuit = (stationIndex, exerciseId) => { const newCircuit = [...circuit]; newCircuit[stationIndex] = newCircuit[stationIndex].filter(ex => ex.id !== exerciseId); setCircuit(newCircuit); };

      const handleGenerateAutoEvolution = () => {
         const presentes = planDetails.attendanceList.filter(p => p.present);
         if (presentes.length === 0) return alert("Aviso: Requer presença confirmada e parâmetros vitais inseridos na ficha para processar evolução.");
         const vitalsText = presentes.map(p => `${p.name} (PA inicial: ${p.pa_in||'?'} mmHg; SpO₂: ${p.spo2_in||'?'}%; FC inicial: ${p.fc_in||'?'} bpm / PA final: ${p.pa_out||'?'} mmHg; SpO₂: ${p.spo2_out||'?'}%; FC final: ${p.fc_out||'?'} bpm)`).join(', ');
         const text = `Data: ${planDetails.date ? planDetails.date.split('-').reverse().join('/') : 'DD/MM/AAAA'}\nResponsáveis: ${planDetails.students || 'Não informados'}\n\nAntes e após a realização das atividades propostas, a pressão arterial (PA), frequência cardíaca (FC) e saturação periférica de oxigênio (SpO₂) dos participantes foram aferidas e registradas, conforme discriminado a seguir:\n\n${vitalsText}.\n\nForam propostas atividades: ${planDetails.proposedActivities || '[Descreva as atividades]'}.\nAo término da dinâmica, foi realizado o desaquecimento com ${planDetails.coolDown || '[Descreva o alongamento/relaxamento]'}.\n\nAs atividades foram conduzidas sem intercorrências, pelos discentes: ${planDetails.students || 'Não informados'}.`;
         setPlanDetails({...planDetails, dailyEvolution: text});
      };

      const handleGenerateReportPDF = (circuitData) => {
        const d = circuitData.details; let stHtml = ''; circuitData.stations.forEach((st, i) => { stHtml += `<div style="margin-bottom:10px;"><strong>Estação ${i+1}</strong> (Resp: ${d.stationResponsibles?.[i]||'-'}): ${st.length===0?'Sem ex.':st.map(e=>e.title).join(', ')}</div>`; });
        let vitHtml = ''; if(d.attendanceList && d.attendanceList.some(p=>p.present)) vitHtml = `<br><p><strong>FREQUÊNCIA NOMINAL:</strong></p><table style="width:100%;border-collapse:collapse;font-size:11px;margin:10px 0;text-align:center;"><tr style="background:#f1f5f9;border-bottom:2px solid #cbd5e1;"><th style="padding:6px;text-align:left;">NOME DO PACIENTE</th><th>PRESENÇA</th></tr>` + d.attendanceList.filter(p=>p.present).map(p=>`<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:6px;text-align:left;font-weight:bold;">${p.name}</td><td>PRESENTE</td></tr>`).join('') + `</table>`;
        const element = document.createElement('div'); element.innerHTML = `<div style="font-family:Arial; font-size:14px; color:#333; line-height:1.5; padding:30px;"><div style="text-align:center; margin-bottom:30px;"><img src="Logo_ATV_2024_Colorido_v2.png" style="max-height:80px; margin-bottom:10px;" onerror="this.style.display='none'"/><h2 style="margin:0; font-size:16px; color:#161E42; text-transform:uppercase; font-weight:bold;">RELATÓRIO DE ATIVIDADE ${d.activityNum||'X'} – ${d.theme||'-'}</h2></div><p><strong>DATA:</strong> ${circuitData.activity_date.split('-').reverse().join('/')}</p><p><strong>DISCENTES RESPONSÁVEIS:</strong> ${d.students||'-'}</p><br><p><strong>OBJETIVOS:</strong> ${d.objectives||'-'}</p><p><strong>ATIVIDADES PROPOSTAS:</strong> ${d.proposedActivities||'-'}</p><p><strong>MATERIAIS:</strong> ${d.materials||'-'}</p><p><strong>OPERAÇÃO (SV, Som, Cuid.):</strong> ${d.vitalSigns||'-'} | ${d.soundAndPhotos||'-'} | ${d.specialCare||'-'}</p><br><p><strong>AQUECIMENTO:</strong> ${d.warmUp||'-'}</p>${stHtml}<p><strong>DESAQUECIMENTO:</strong> ${d.coolDown||'-'}</p>${vitHtml}<br><p><strong>RELATO NARRATIVO DA DINÂMICA:</strong><br/>${d.developmentNarrative?d.developmentNarrative.replace(/\n/g, '<br/>'):'-'}</p><br><p><strong>RESULTADOS OBTIDOS:</strong><br/>${d.resultObtained?d.resultObtained.replace(/\n/g, '<br/>'):'-'}</p><br><p><strong>TOTAL DE PRESENTES:</strong> ${d.attendanceCount||'-'}</p></div>`;
        html2pdf().set({ margin: 0.4, filename: `Relatorio_Atividade_${d.activityNum||'00'}.pdf`, html2canvas: { scale: 2, useCORS: true } }).from(element).save();
      };

      const handleGenerateEvolutionPDF = (circuitData) => {
        const d = circuitData.details; const element = document.createElement('div'); element.innerHTML = `<div style="font-family:Arial; font-size:14px; color:#333; line-height:1.5; padding:30px;"><div style="text-align:center; margin-bottom:30px;"><img src="Logo_ATV_2024_Colorido_v2.png" style="max-height:80px; margin-bottom:10px;" onerror="this.style.display='none'"/><h2 style="margin:0; font-size:16px; color:#e63946; text-transform:uppercase; font-weight:bold;">DOCUMENTO DE EVOLUÇÃO CLÍNICA</h2><p style="margin:0; font-size:13px; color:#64748b;">ATIVIDADE ${d.activityNum||'X'} – ${d.theme||'-'}</p></div><p><strong>DATA:</strong> ${circuitData.activity_date.split('-').reverse().join('/')}</p><p><strong>DISCENTES RESPONSÁVEIS:</strong> ${d.students||'-'}</p><br><div style="padding: 20px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;"><h3 style="color: #334155; margin-top: 0; font-size: 13px; text-transform: uppercase;">Evolução Clínica, Sinais Vitais e Intercorrências</h3><p style="white-space: pre-wrap; font-size: 13px;">${d.dailyEvolution?d.dailyEvolution.replace(/\n/g, '<br/>'):'Sem anotações clínicas.'}</p></div><br><br><br><div style="text-align:center; margin-top: 50px;"><p>___________________________________________________</p><p style="font-size: 12px; color: #666;">Assinatura do Responsável Técnico</p></div></div>`;
        html2pdf().set({ margin: 0.4, filename: `Evolucao_Clinica_Ativ_${d.activityNum||'00'}.pdf`, html2canvas: { scale: 2, useCORS: true } }).from(element).save();
      };

      const handleNavClick = (view, mode = null) => { setCurrentView(view); if(mode) setCircuitMode(mode); setIsMobileMenuOpen(false); };

      const NavBtn = ({v, icon, text}) => ( 
        <button onClick={() => handleNavClick(v)} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${currentView === v ? 'bg-slate-100 dark:bg-slate-800 text-brand-blue dark:text-brand-light font-semibold border-l-4 border-brand-blue dark:border-brand-light' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 border-l-4 border-transparent'}`}>
          <i className={`fa-solid ${icon} w-5 text-center`}></i> {text}
        </button> 
      );
// --- FIM DA PARTE 1 ---
// --- INÍCIO DA PARTE 2 ---
    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registrations) => { for (let reg of registrations) { reg.unregister(); } });
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-950 transition-colors duration-300"><div className="flex flex-col items-center"><div className="w-24 h-24 bg-white rounded-full flex items-center justify-center p-2 mb-4 border border-slate-100"><img src="image_fa7f41.png" alt="Logo" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} /></div><p className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-2">Autenticando acesso...</p></div><div className="flex gap-2 mt-4"><div className="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600 animate-pulse"></div><div className="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 animate-pulse" style={{animationDelay: '0.2s'}}></div><div className="w-2 h-2 rounded-full bg-slate-500 dark:bg-slate-400 animate-pulse" style={{animationDelay: '0.4s'}}></div></div></div>;
      
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} updateSessionData={setSession} darkMode={darkMode} setDarkMode={setDarkMode} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
