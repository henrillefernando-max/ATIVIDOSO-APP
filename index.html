                                          {isPresent && <i className="fa-solid fa-check text-xs"></i>}
                                        </div>
                                        <input type="checkbox" checked={isPresent} onChange={e=>updateAttendance(i,'present',e.target.checked)} className="hidden"/>

                                      </label>

                          <button onClick={handleUpdateReport} className={btnPrimaryClass}><i className="fa-solid fa-check-double mr-2"></i> Firmar Prontuário</button>

                      </div>

                                  <span className={`text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider ${isComplete ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'}`}><i className={`fa-solid ${isComplete ? 'fa-check-double' : 'fa-hourglass-half'} mr-1`}></i> {isComplete ? 'Homologado' : 'Pendente'}</span>

                              </div>

                  ) : ( 
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {exercises.filter(ex => ex.status === 'pending').map(ex => { 
                        const ytId = getYouTubeId(ex.videoUrl); const ytThumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null; const isImage = ex.mediaUrl && ex.mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)/i); const isVideo = ex.mediaUrl && ex.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i); 
                        return ( 
                          <div key={ex.id} className={cardClass + " overflow-hidden flex flex-col hover:shadow-float transition-all duration-300 hover:-translate-y-1"}>
                            <div className="h-48 bg-slate-900 relative">
                              {ytThumb ? ( <img src={ytThumb} className="w-full h-full object-cover opacity-80" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /> ) : isImage ? ( <img src={ex.mediaUrl} className="w-full h-full object-cover opacity-80" /> ) : isVideo ? ( <div className="w-full h-full flex items-center justify-center"><i className="fa-solid fa-video text-4xl text-slate-600"></i></div> ) : ( <div className="w-full h-full flex items-center justify-center"><i className="fa-solid fa-image text-4xl text-slate-700"></i></div> )}
                              <div className="absolute top-3 right-3 bg-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-md uppercase tracking-wider">Pendente</div>
                            </div>
                            <div className="p-6 flex-1 flex flex-col">
                              <p className="text-[10px] font-bold text-brand-light uppercase tracking-wider mb-2"><i className="fa-solid fa-user-pen mr-1"></i> {ex.author || 'Monitor'}</p>
                              <h3 className="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight mb-3">{ex.title}</h3>
                              <div className="flex gap-2 mb-6"><span className="text-[10px] font-bold bg-surface-100 dark:bg-surface-900 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg uppercase tracking-wider">{ex.category}</span><span className="text-[10px] font-bold bg-surface-100 dark:bg-surface-900 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg uppercase tracking-wider">{ex.muscleGroup}</span></div>
                              <div className="mt-auto grid grid-cols-2 gap-3">
                                <button onClick={() => handleApprove(ex.id)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-sm active:scale-95 flex justify-center items-center gap-2"><i className="fa-solid fa-check"></i> Aprovar</button>
                                <button onClick={() => handleReject(ex.id)} className="bg-white dark:bg-surface-800 border border-slate-200 dark:border-slate-700 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 font-bold py-2.5 rounded-xl text-sm transition-all active:scale-95 flex justify-center items-center gap-2"><i className="fa-solid fa-xmark"></i> Recusar</button>
                              </div>
                            </div>
                          </div> 
                        ) 
                      })}
                    </div> 
                  )}
                </div>
              )}

              {/* ==========================================
                  TELA: EQUIPE E ACESSOS (ADMIN)
              ========================================== */}
              {currentView === 'equipe' && isAdmin && (
                <div className="max-w-5xl mx-auto space-y-6 animate-fade-in pb-12">
                  <div className={cardClass + " overflow-hidden"}>
                    <div className="p-6 sm:p-8 border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-surface-800 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Controle de Permissões</h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Gerenciamento de acessos e equipes ({teamMembers.length} ativos).</p>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left">
                        <thead className="bg-surface-50 dark:bg-surface-900/50 text-slate-500 dark:text-slate-400 font-bold text-xs uppercase tracking-wider border-b border-slate-200 dark:border-slate-800">
                          <tr><th className="px-6 py-4">Usuário</th><th className="px-6 py-4">Agrupamento</th><th className="px-6 py-4">Nível de Acesso</th><th className="px-6 py-4 text-center">Ações</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {teamMembers.map(member => ( 
                            <tr key={member.id} className="hover:bg-surface-50 dark:hover:bg-surface-800/80 transition-colors">
                              <td className="px-6 py-4"><div className="flex items-center gap-4">{member.avatar_url ? ( <img src={member.avatar_url} className="w-10 h-10 rounded-full object-cover border border-slate-200 dark:border-slate-700 shadow-sm" /> ) : ( <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-surface-200 to-surface-300 dark:from-surface-700 dark:to-surface-800 text-slate-700 dark:text-slate-200 flex items-center justify-center font-bold text-sm shadow-inner">{member.full_name.charAt(0)}</div> )}<p className="font-bold text-slate-800 dark:text-slate-200">{member.full_name}</p></div></td>
                              <td className="px-6 py-4"><span className="font-medium text-slate-700 dark:text-slate-300 bg-surface-100 dark:bg-surface-900 px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700">{member.team_group || 'Não designado'}</span></td>
                              <td className="px-6 py-4"><span className={`text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${member.role.includes('Admin') ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'}`}>{member.role}</span></td>
                              <td className="px-6 py-4 text-center"><button onClick={() => setEditingMember(member)} className="text-brand-blue dark:text-brand-light hover:underline text-xs font-bold">Modificar</button></td>
                            </tr> 
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {editingMember && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] flex items-center justify-center p-4 transition-opacity animate-fade-in">
                      <div className="bg-white dark:bg-surface-800 w-full max-w-sm rounded-[2rem] shadow-float ring-1 ring-slate-900/5 dark:ring-white/10 overflow-hidden scale-100 transition-transform">
                        <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center"><h3 className="text-lg font-bold text-slate-800 dark:text-slate-100">Alterar Usuário</h3><button onClick={() => setEditingMember(null)} className="w-8 h-8 rounded-full bg-surface-100 dark:bg-surface-700 flex items-center justify-center text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors"><i className="fa-solid fa-xmark"></i></button></div>
                        <form onSubmit={handleUpdateMember} className="p-6 space-y-5">
                          <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nome Completo</label><input type="text" value={editingMember.full_name} onChange={e=>setEditingMember({...editingMember, full_name: e.target.value})} required className={inputClass} /></div>
                          <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Agrupamento</label><select value={editingMember.team_group} onChange={e=>setEditingMember({...editingMember, team_group: e.target.value})} className={inputClass}><option value="Nenhum">Não designado</option><option value="E1">Grupo E1</option><option value="E2">Grupo E2</option><option value="E3">Grupo E3</option><option value="E4">Grupo E4</option></select></div>
                          <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nível de Acesso</label><select value={editingMember.role} onChange={e=>setEditingMember({...editingMember, role: e.target.value})} className={inputClass}><option value="Monitor">Monitor</option><option value="Coordenador / Admin">Administrador</option></select></div>
                          <div className="pt-4 flex justify-end gap-3"><button type="button" onClick={() => setEditingMember(null)} className={btnSecondaryClass}>Cancelar</button><button type="submit" className={btnPrimaryClass}>Salvar</button></div>
                        </form>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    const AppContainer = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

      useEffect(() => {
        if (darkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); } 
        else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
      }, [darkMode]);

      useEffect(() => {
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setUser({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      if (loadingAuth) {
         return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-surface-50 dark:bg-surface-900 relative overflow-hidden transition-colors duration-300">
               <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-light/10 blur-[100px] rounded-full pointer-events-none"></div>
               <div className="relative z-10 flex flex-col items-center">
                  <div className="w-24 h-24 bg-white dark:bg-surface-800 rounded-3xl shadow-float flex items-center justify-center mb-8 border border-slate-100 dark:border-slate-800 animate-fade-in"><img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo ATIVIDOSO" className="w-16 drop-shadow-sm" onerror="this.style.display='none'" /></div>
                  <div className="flex gap-2"><div className="w-2.5 h-2.5 rounded-full bg-brand-light animate-bounce"></div><div className="w-2.5 h-2.5 rounded-full bg-brand-light animate-bounce" style={{animationDelay: '0.1s'}}></div><div className="w-2.5 h-2.5 rounded-full bg-brand-light animate-bounce" style={{animationDelay: '0.2s'}}></div></div>
               </div>
            </div>
         );
      }

      return user ? <Dashboard session={user} onLogout={async () => { await supabaseClient.auth.signOut(); setUser(null); }} updateSessionData={setUser} darkMode={darkMode} setDarkMode={setDarkMode} /> : <LoginPage onLogin={setUser} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppContainer />);
  </script>
</body>
</html>
