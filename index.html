    const CATEGORIES = {

      dual: { title: "Dupla Tarefa", shortTitle: "Dupla Tarefa", icon: "fa-brain", color: "text-purple-600", bg: "bg-purple-50", border: "border-purple-100", subgroups: ["Todos", "Cognitiva + Motora", "Equilíbrio + Fala"] }

    const DEFAULT_PARTICIPANTS = [
      { id: "1", name: "Dona Maria Conceição" }, { id: "2", name: "Seu José Antonio" }, { id: "3", name: "Dona Raimunda Nonata" }, { id: "4", name: "Seu Francisco das Chagas" }
    ];

    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [teamGroup, setTeamGroup] = useState('E1');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        if (isLogin) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { setError('E-mail ou senha incorretos.'); setLoading(false); }
          else if (data.session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.session.user.id).single();
            onLogin({ ...data.session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { setError(error.message); setLoading(false); }
          else if (data.user) {
            await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name: fullName, role: 'Monitor', team_group: teamGroup }]);
            onLogin({ ...data.user, full_name: fullName, role: 'Monitor', team_group: teamGroup });
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-pattern p-6">

                  <div>

                  </div>
                  <div>
                    <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Grupo da Quadra</label>
                    <select value={teamGroup} onChange={e=>setTeamGroup(e.target.value)} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-bold text-emerald-700">
                      <option value="E1">Grupo E1</option><option value="E2">Grupo E2</option><option value="E3">Grupo E3</option><option value="E4">Grupo E4</option>
                    </select>
                  </div>
                </>
              )}
              <div>
                <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">E-mail</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-semibold" placeholder="seu.email@faculdade.com" />
              </div>
              <div>
                <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Senha</label>
                <div className="relative">
                  <input type={showPassword ? "text" : "password"} value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full pl-5 pr-12 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-semibold" placeholder="••••••••" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 p-1 hover:text-brand-blue transition-colors"><i className={showPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye"}></i></button>
                </div>
              </div>
                
              {error && <div className="bg-rose-50 text-rose-600 p-4 rounded-2xl text-xs font-bold border border-rose-100 flex items-center gap-2"><i className="fa-solid fa-circle-exclamation text-lg"></i> {error}</div>}
              <button type="submit" disabled={loading} className="w-full bg-brand-red hover:bg-brand-redDark text-white font-black py-4 rounded-2xl transition-all shadow-md mt-4 text-base">

    };

    // ==========================================
    // PLATAFORMA / DASHBOARD
    // ==========================================
    const Dashboard = ({ session, onLogout, updateSessionData }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      const [selectedExercise, setSelectedExercise] = useState(null);
      
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [participantsList, setParticipantsList] = useState(DEFAULT_PARTICIPANTS);
      
      // Cadastro Exercicio
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false });

      // Circuitos / Aula
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);
      const [planDetails, setPlanDetails] = useState({ 
        activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], 
        proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', 
        developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] 
      });

      // Perfil & Avisos
      const [newAnnouncement, setNewAnnouncement] = useState({ title: '', content: '', link_url: '' });
      const [profileForm, setProfileForm] = useState({ full_name: session.full_name, team_group: session.team_group || '' });
      const [profileAvatarFile, setProfileAvatarFile] = useState(null);
      const [profileStatus, setProfileStatus] = useState('');

      // Busca inicial
      useEffect(() => {
        const fetchAll = async () => {
          const [{data:ex}, {data:ci}, {data:an}, {data:pa}] = await Promise.all([
            supabaseClient.from('exercises').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('circuits').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('announcements').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('participants').select('*').order('name', { ascending: true })
          ]);
          if(ex) setExercises(ex); 
          if(ci) setSavedCircuits(ci); 
          if(an) setAnnouncements(an); 
          if(pa && pa.length > 0) setParticipantsList(pa);
        };
        fetchAll();
      }, [currentView, circuitMode]);

      // ======= VARIÁVEIS DERIVADAS E FUNÇÕES AUXILIARES =======
      const approvedExercises = exercises.filter(ex => ex.status === 'approved' || !ex.status);
      const pendingCount = exercises.filter(ex => ex.status === 'pending').length;

      const filteredExercises = approvedExercises.filter(ex => {
        const matchSearch = ex.title?.toLowerCase().includes(searchQuery.toLowerCase());
        const matchCat = filterCat === 'all' || ex.category === filterCat;
        const matchSub = filterSub === 'Todos' || ex.muscleGroup === filterSub;
        return matchSearch && matchCat && matchSub;
      });

      const getYouTubeId = (url) => {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      };

     // Alerta da Agenda (Cálculo de Data Blindado contra Fuso Horário)
      const upcomingActivity = useMemo(() => {
        if(!session.team_group || session.team_group === 'Nenhum') return null;
        
        // Pega o dia de HOJE de forma pura, sem horas, para não dar erro de fuso
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        const mesAtual = hoje.getMonth() + 1; // getMonth começa do 0, então +1
        const diaAtual = hoje.getDate();
        
        // Converte o hoje para um número grande (ex: 20260829) para facilitar a matemática
        const numeroHoje = parseInt(`${anoAtual}${String(mesAtual).padStart(2, '0')}${String(diaAtual).padStart(2, '0')}`);
        
        let atividadeDestaSemana = null;
        
        for (let item of AGENDA_DATA) {
          const [d, m, y] = item.date.split('/'); 
          
          // Converte a data da planilha para o mesmo formato de número (ex: 20260828)
          const numeroAtividade = parseInt(`${y}${m}${d}`);
          
          // A REGRA DE OURO: A atividade só é válida se o número dela for MAIOR ou IGUAL a hoje
          if (numeroAtividade >= numeroHoje) {
            atividadeDestaSemana = item;
            break; 
          }
        }

        if (!atividadeDestaSemana) return null;

        const grupoUsuario = session.team_group.toLowerCase();
        const responsaveis = atividadeDestaSemana.resp.toLowerCase();

        // A TRAVA BLINDADA:
        if (responsaveis.includes(grupoUsuario) || responsaveis.includes('todos')) {
          return atividadeDestaSemana; 
        }
        
        return null; 
      }, [session.team_group]);

      // ======= FUNÇÕES DE PERFIL =======
      const handleSaveProfile = async (e) => {
        e.preventDefault(); 
        setProfileStatus('Salvando...');
        let newAvatarUrl = session.avatar_url;
        
        if (profileAvatarFile) {
          const fileName = `avatar_${session.id}_${Date.now()}.${profileAvatarFile.name.split('.').pop()}`;
          const { error } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, profileAvatarFile);
          if (!error) {
            newAvatarUrl = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName).data.publicUrl;
          }
        }
        
        const { error } = await supabaseClient.from('profiles').update({ 
          full_name: profileForm.full_name, 
          team_group: profileForm.team_group, 
          avatar_url: newAvatarUrl 
        }).eq('id', session.id);
        
        if(!error) { 
          setProfileStatus('Salvo com sucesso!'); 
          updateSessionData({ ...session, full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }); 
        } else {
          setProfileStatus('Erro ao salvar.');
        }
      };

      // ======= FUNÇÕES DE AVISOS =======
      const handlePostAnnouncement = async (e) => {
        e.preventDefault();
        const { data } = await supabaseClient.from('announcements').insert([{
          title: newAnnouncement.title, 
          content: newAnnouncement.content, 
          link_url: newAnnouncement.link_url,
          author: session.full_name 
        }]).select();
        
        if(data) { 
          setAnnouncements([data[0], ...announcements]); 
          setNewAnnouncement({ title: '', content: '', link_url: '' }); 
        }
      };
      
      const handleDeleteAnnouncement = async (id) => { 
        if(window.confirm("Apagar este aviso permanentemente?")) { 
          await supabaseClient.from('announcements').delete().eq('id', id); 
          setAnnouncements(announcements.filter(a => a.id !== id)); 
        } 
      };

      // ======= FUNÇÃO NOTIFICAR POR EMAIL =======
      const handleSendEmail = () => {
         const subject = "ATIVIDOSO - Lembrete de Planejamento da Aula";
         const body = `Olá Monitor(a),\n\nLembramos que o seu grupo está responsável por realizar a próxima atividade na quadra.\n\nPor favor, acesse a plataforma ATIVIDOSO para realizar o planejamento prévio e enviar a aula na aba 'Aulas e Relatórios'.\n\nAtenciosamente,\nCoordenação ATIVIDOSO`;
         const emailLink = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
         window.open(emailLink, '_blank');
      };

      // ======= FUNÇÕES DE EXERCÍCIOS =======
      const handleFormSubmit = async (e) => {
        e.preventDefault(); 
        setFormStatus({ loading: true, success: false });
        let url = null;
        
        if (mediaFile) {
          const fName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${mediaFile.name.split('.').pop()}`;
          await supabaseClient.storage.from('midia_exercicios').upload(fName, mediaFile);
          url = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fName).data.publicUrl;
        }
        
        const ex = { 
          title: formData.title, 
          category: formCat, 
          "muscleGroup": formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect, 
          difficulty: formData.difficulty, 
          equipment: formData.equipment, 
          dosage: formData.dosage, 
          "videoUrl": formData.videoUrl, 
          "mediaUrl": url, 
          instructions: formData.instructions, 
          precautions: formData.precautions, 
          status: 'pending', 
          author: session.full_name 
        };
        
        const { error } = await supabaseClient.from('exercises').insert([ex]);
        
        if (!error) { 
          setFormStatus({ loading: false, success: true }); 
          setFormData({ title:'', difficulty:'Iniciante / Leve', equipment:'Nenhum', dosage:'', videoUrl:'', instructions:'', precautions:'' }); 
          setFormCat(''); 
          setFormMuscleSelect(''); 
          setMediaFile(null); 
        } else {
          setFormStatus({ loading: false, success: false });
          alert("Erro ao enviar: " + error.message);
        }
      };

      const handleApprove = async (id) => { 
        await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id); 
        setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex)); 
      };
      
      const handleReject = async (id) => { 
        await supabaseClient.from('exercises').delete().eq('id', id); 
        setExercises(exercises.filter(ex => ex.id !== id)); 
      };
      
      const handleDeleteExercise = async (id) => { 
        if(window.confirm("Apagar exercício definitivamente do acervo?")) { 
          await supabaseClient.from('exercises').delete().eq('id', id); 
          setExercises(exercises.filter(ex => ex.id !== id)); 
          setCurrentView('library'); 
        } 
      };

      // ======= FUNÇÕES DE RELATÓRIO E PRESENÇA =======
      const handleAddParticipant = async () => {
        const name = prompt('Digite o nome completo do idoso:');
        if(name) {
          const { data, error } = await supabaseClient.from('participants').insert([{ name }]).select();
          if(!error && data) {
            setParticipantsList([...participantsList, data[0]].sort((a,b)=>a.name.localeCompare(b.name)));
            if (circuitMode === 'report_edit') {
               const newP = { id: data[0].id, name: data[0].name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' };
               setPlanDetails({...planDetails, attendanceList: [...planDetails.attendanceList, newP].sort((a,b)=>a.name.localeCompare(b.name))});
            }
          } else {
             const fallbackId = Date.now().toString();
             const newP = { id: fallbackId, name: name };
             setParticipantsList([...participantsList, newP].sort((a,b)=>a.name.localeCompare(b.name)));
             if (circuitMode === 'report_edit') {
               setPlanDetails({...planDetails, attendanceList: [...planDetails.attendanceList, { ...newP, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }].sort((a,b)=>a.name.localeCompare(b.name))});
             }
          }
        }
      };

      const updateAttendance = (idx, field, val) => {
         const list = [...planDetails.attendanceList]; 
         list[idx][field] = val;
         setPlanDetails({
           ...planDetails, 
           attendanceList: list, 
           attendanceCount: field === 'present' ? list.filter(p=>p.present).length.toString() : planDetails.attendanceCount
         });
      };

      const startPlanning = () => { 
        setPlanDetails({ activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['','','','',''], proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] }); 
        setCircuit([[],[],[],[],[]]); 
        setCircuitMode('plan'); 
      };
      
      const startEditingReport = () => { 
        let list = viewingCircuit.details.attendanceList || [];
        if (list.length === 0) {
          list = participantsList.map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
        } else { 
          const ids = list.map(c=>c.id); 
          const newParts = participantsList.filter(p=>!ids.includes(p.id)).map(p=>({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
          list = [...list, ...newParts].sort((a,b)=>a.name.localeCompare(b.name)); 
        }
        setPlanDetails({ ...viewingCircuit.details, attendanceList: list }); 
        setCircuitMode('report_edit'); 
      };

      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Por favor, preencha o Número, Tema e Data!');
        const { data, error } = await supabaseClient.from('circuits').insert([{ activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name }]).select();
        if (!error) { 
          alert('Planejamento Salvo com Sucesso!'); 
          setSavedCircuits([data[0], ...savedCircuits]); 
          setCircuitMode('history'); 
        } else {
          alert('Erro ao salvar: ' + error.message);
        }
      };

      const handleUpdateReport = async () => {
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (!error) { 
          alert('Relatório Clínico Salvo!'); 
          setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? { ...c, details: planDetails } : c)); 
          setViewingCircuit({ ...viewingCircuit, details: planDetails });

          alert('Erro ao atualizar: ' + error.message);

        } 
      };
      
      const addToCircuit = (stationIndex, exerciseId) => { 
        if (!exerciseId) return; 
        const exercise = approvedExercises.find(ex => ex.id === exerciseId); 
        if (!exercise) return; 
        const newCircuit = [...circuit]; 
        if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) { 
          newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise]; 
          setCircuit(newCircuit); 
        }

      const removeFromCircuit = (stationIndex, exerciseId) => {

            <p><strong>TOTAL DE PRESENTES:</strong> ${d.attendanceCount||'-'}</p>
          </div>
        `;

                                <td className="px-6 py-5"><p className="font-bold text-slate-700 mb-1">{item.title}</p><p className="text-xs font-semibold text-slate-400 bg-white border border-slate-200 px-3 py-1 rounded-lg inline-block shadow-sm"><i className="fa-solid fa-users text-slate-300 mr-1"></i> {item.resp}</p></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* ABA: PLANEJAR ATIVIDADE */}

                            <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Data da Ativ.</label><input type="date" value={planDetails.date} onChange={e=>setPlanDetails({...planDetails, date: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-emerald-500 outline-none text-sm transition-all font-semibold text-slate-700" /></div>
                            <div>
                              <label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Tema Principal</label>
                              <select value={planDetails.theme} onChange={e=>setPlanDetails({...planDetails, theme: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-emerald-500 outline-none text-sm transition-all font-semibold text-slate-700">
                                <option value="">Selecione...</option><option value="EXERCÍCIOS DE DUPLA TAREFA">Dupla Tarefa</option><option value="EXERCÍCIOS DE MOBILIDADE E FORTALECIMENTO DE MMSS E TRONCO">Mobilidade/Fortalecimento MMSS</option><option value="EXERCÍCIOS DE MOBILIDADE E FORTALECIMENTO DE MMII">Mobilidade/Fortalecimento MMII</option><option value="EXERCÍCIOS AERÓBICOS E CONDICIONAMENTO CARDIORRESPIRATÓRIO">Aeróbicos e Condicionamento</option><option value="OUTRA ATIVIDADE">Outra (Gincana/Avaliação)</option>
                              </select>
                            </div>
                          </div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Discentes Responsáveis Pela Aula</label><input type="text" value={planDetails.students} onChange={e=>setPlanDetails({...planDetails, students: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-emerald-500 outline-none text-sm transition-all font-semibold text-slate-700" placeholder="Ex: Francyellen, Sarah, Raissa..." /></div>
                        </div>

                        <div className="space-y-6 pt-8 border-t border-slate-100">
                          <div className="flex items-center gap-3 mb-6"><div className="w-10 h-10 bg-brand-red/10 text-brand-red rounded-xl flex items-center justify-center text-lg"><i className="fa-solid fa-map-location-dot"></i></div><div><h3 className="text-base font-black text-slate-800">Montagem do Circuito</h3><p className="text-xs font-semibold text-slate-400">Distribua os exercícios e responsáveis.</p></div></div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Descreva o Aquecimento Coletivo</label><textarea rows="2" value={planDetails.warmUp} onChange={e=>setPlanDetails({...planDetails, warmUp: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-emerald-500 outline-none text-sm font-medium transition-all" placeholder="Ex: Dança funcional e alongamento..."></textarea></div>
                          
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                            {circuit.map((stationExercises, index) => (
                              <div key={index} className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden flex flex-col hover-lift">
                                <div className={`p-4 sm:p-5 flex items-center gap-4 ${index === 4 ? 'bg-gradient-to-r from-amber-50 to-orange-50 border-b border-amber-100' : 'bg-gradient-to-r from-emerald-50 to-teal-50 border-b border-emerald-100'}`}>
                                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black shadow-inner ${index === 4 ? 'bg-amber-500 text-white' : 'bg-emerald-500 text-white'}`}>{index + 1}</div>
                                  <div><h4 className={`text-sm font-black uppercase tracking-widest ${index === 4 ? 'text-amber-800' : 'text-emerald-800'}`}>Estação {index + 1}</h4>{index === 4 && <p className="text-[10px] font-bold text-amber-600">Circuito Funcional</p>}</div>
                                </div>
                                <div className="p-5 flex flex-col gap-4 bg-white/50">
                                  <div><label className="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 pl-1">Monitores Responsáveis</label><input type="text" value={planDetails.stationResponsibles[index]} onChange={(e) => updateStationResponsible(index, e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm bg-slate-50 focus:bg-white transition-colors font-semibold" placeholder="Nome dos monitores..." /></div>
                                  <div className="space-y-2">
                                    {stationExercises.map(ex => (
                                      <div key={ex.id} className="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-100 shadow-sm relative overflow-hidden group">
                                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-brand-red rounded-l-xl"></div>
                                        <div className="pl-3 pr-2 w-full"><h3 className="font-bold text-slate-700 text-sm leading-tight truncate" title={ex.title}>{ex.title}</h3><p className="text-[10px] font-bold text-slate-400 mt-0.5"><i className="fa-solid fa-clock-rotate-left"></i> {ex.dosage}</p></div>
                                        <button onClick={() => removeFromCircuit(index, ex.id)} className="w-8 h-8 rounded-lg bg-rose-50 text-rose-500 flex items-center justify-center hover:bg-rose-500 hover:text-white transition-colors shrink-0"><i className="fa-solid fa-trash text-xs"></i></button>
                                      </div>
                                    ))}
                                  </div>
                                  <select value="" onChange={(e) => addToCircuit(index, e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 hover:bg-slate-100 focus:border-emerald-500 outline-none text-xs font-extrabold text-slate-500 cursor-pointer transition-colors mt-auto">
                                    <option value="">+ Vincular exercício da biblioteca...</option>
                                    {approvedExercises.map(ex => ( <option key={ex.id} value={ex.id}>[{ex.muscleGroup}] {ex.title}</option> ))}
                                  </select>
                                </div>
                              </div>
                            ))}
                          </div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2 mt-6">Descreva o Desaquecimento</label><textarea rows="2" value={planDetails.coolDown} onChange={e=>setPlanDetails({...planDetails, coolDown: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-emerald-500 outline-none text-sm font-medium transition-all" placeholder="Relaxamento, roda de conversa..."></textarea></div>
                        </div>

                        <div className="pt-8 border-t border-slate-100 flex justify-end">
                          <button onClick={handleSavePlan} className="w-full sm:w-auto px-10 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl shadow-[0_8px_20px_-6px_rgba(16,185,129,0.4)] transition-all hover:-translate-y-1 text-base flex items-center justify-center gap-2"><i className="fa-solid fa-check-to-slot"></i> Concluir Planejamento</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ABA: PREENCHER RELATÓRIO PÓS-AULA */}
                  {circuitMode === 'report_edit' && viewingCircuit && (
                    <div className="space-y-6 animate-fade-in pb-12">
                      <div className="bg-white p-6 sm:p-10 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-brand-blue/5 rounded-bl-full pointer-events-none"></div>
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-6 gap-4 relative z-10">
                          <div><h2 className="text-2xl font-black text-slate-800 flex items-center gap-3"><i className="fa-solid fa-pen-to-square text-brand-blue bg-blue-50 w-10 h-10 rounded-xl flex items-center justify-center"></i> Preenchimento Pós-Aula</h2><p className="text-sm font-semibold text-slate-500 mt-2">Relatório Oficial da Atividade {planDetails.activityNum} - {planDetails.theme}</p></div>
                          <button onClick={() => setCircuitMode('view')} className="w-10 h-10 bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-500 rounded-full flex items-center justify-center transition-colors"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <div className="bg-slate-50 p-4 rounded-xl border relative z-10">
                          <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-brand-blue uppercase text-xs tracking-widest"><i className="fa-solid fa-heart-pulse mr-2"></i>Sinais Vitais e Presença</h3><button onClick={handleAddParticipant} className="text-[10px] sm:text-xs bg-brand-blue text-white px-3 py-1.5 rounded-lg font-bold"><i className="fa-solid fa-plus mr-1"></i>Novo Idoso</button></div>
                          <div className="max-h-80 overflow-y-auto space-y-2 pr-2">
                            {planDetails.attendanceList.map((p, i) => (
                              <div key={p.id} className={`p-3 border rounded-xl transition-colors ${p.present ? 'bg-blue-50 border-brand-blue/30' : 'bg-white'}`}>
                                <label className="flex items-center gap-3 font-bold cursor-pointer"><input type="checkbox" checked={p.present} onChange={e=>updateAttendance(i,'present',e.target.checked)} className="w-5 h-5 accent-brand-blue"/>{p.name}</label>
                                {p.present && <div className="mt-3 grid grid-cols-3 gap-2">
                                  <div><p className="text-[10px] font-bold text-slate-400 text-center mb-1">FC (Início / Fim)</p><input placeholder="Ex: 80/95" value={p.fc_in ? `${p.fc_in}/${p.fc_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'fc_in',v[0]||'');updateAttendance(i,'fc_out',v[1]||'');}} className="w-full text-xs p-2 border text-center rounded-lg font-bold text-slate-700 outline-none focus:border-brand-blue"/></div>
                                  <div><p className="text-[10px] font-bold text-slate-400 text-center mb-1">SpO2 (Início / Fim)</p><input placeholder="Ex: 98/97" value={p.spo2_in ? `${p.spo2_in}/${p.spo2_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'spo2_in',v[0]||'');updateAttendance(i,'spo2_out',v[1]||'');}} className="w-full text-xs p-2 border text-center rounded-lg font-bold text-slate-700 outline-none focus:border-brand-blue"/></div>
                                  <div><p className="text-[10px] font-bold text-slate-400 text-center mb-1">PA (Início / Fim)</p><input placeholder="Ex: 12x8/13x8" value={p.pa_in ? `${p.pa_in}/${p.pa_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'pa_in',v[0]||'');updateAttendance(i,'pa_out',v[1]||'');}} className="w-full text-xs p-2 border text-center rounded-lg font-bold text-slate-700 outline-none focus:border-brand-blue"/></div>
                                </div>}
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="space-y-5 relative z-10">
                           <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest pl-2">Objetivos e Recursos</h3>
                           <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Objetivos da Atividade</label><textarea rows="3" value={planDetails.objectives} onChange={e=>setPlanDetails({...planDetails, objectives: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm font-medium transition-all"></textarea></div>
                           <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Atividades Propostas (Itens)</label><textarea rows="2" value={planDetails.proposedActivities} onChange={e=>setPlanDetails({...planDetails, proposedActivities: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm font-medium transition-all"></textarea></div>
                           <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Materiais Utilizados na Quadra</label><textarea rows="2" value={planDetails.materials} onChange={e=>setPlanDetails({...planDetails, materials: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm font-medium transition-all"></textarea></div>
                        </div>

                        <div className="space-y-5 relative z-10">
                          <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest pl-2">Organização Operacional</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50/50 p-6 rounded-[2rem] border border-slate-100">
                            <div><label className="block text-xs font-extrabold text-slate-500 mb-2 pl-2">Responsáveis pelos Sinais Vitais</label><input type="text" value={planDetails.vitalSigns} onChange={e=>setPlanDetails({...planDetails, vitalSigns: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 focus:border-brand-blue outline-none text-sm transition-all font-semibold" /></div>
                            <div><label className="block text-xs font-extrabold text-slate-500 mb-2 pl-2">Responsáveis pelo Som e Fotos</label><input type="text" value={planDetails.soundAndPhotos} onChange={e=>setPlanDetails({...planDetails, soundAndPhotos: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 focus:border-brand-blue outline-none text-sm transition-all font-semibold" /></div>
                            <div className="md:col-span-2"><label className="block text-xs font-extrabold text-slate-500 mb-2 pl-2">Participantes com cuidados especiais nas estações</label><input type="text" value={planDetails.specialCare} onChange={e=>setPlanDetails({...planDetails, specialCare: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 focus:border-brand-blue outline-none text-sm transition-all font-semibold" placeholder="Detalhes..." /></div>
                          </div>
                        </div>

                        <div className="space-y-5 relative z-10">
                          <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest pl-2">Relato da Atividade</h3>
                          <div><label className="block text-xs font-black text-brand-blue mb-2 pl-2">Texto Narrativo do Desenvolvimento</label><textarea rows="6" value={planDetails.developmentNarrative} onChange={e=>setPlanDetails({...planDetails, developmentNarrative: e.target.value})} className="w-full p-5 rounded-2xl bg-blue-50/30 border border-brand-blue/20 focus:bg-white focus:border-brand-blue outline-none text-sm leading-relaxed transition-all font-medium text-slate-700 shadow-inner"></textarea></div>
                          <div><label className="block text-xs font-black text-amber-600 mb-2 pl-2"><i className="fa-solid fa-file-medical mr-1"></i> Evolução Clínica / Intercorrências</label><textarea rows="4" placeholder="Como foi a resposta dos idosos? Houve tontura, dor, pressão alta?..." value={planDetails.dailyEvolution} onChange={e=>setPlanDetails({...planDetails, dailyEvolution: e.target.value})} className="w-full p-5 rounded-2xl bg-amber-50 border border-amber-200 focus:bg-white focus:border-amber-400 outline-none text-sm leading-relaxed text-amber-900 transition-all font-medium"></textarea></div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Resultados Obtidos</label><textarea rows="3" value={planDetails.resultObtained} onChange={e=>setPlanDetails({...planDetails, resultObtained: e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm font-medium transition-all"></textarea></div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Quantitativo Final de Idosos Presentes</label><input type="text" value={planDetails.attendanceCount} onChange={e=>setPlanDetails({...planDetails, attendanceCount: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm transition-all font-semibold text-slate-700" placeholder="Ex: 32 pessoas idosas" /></div>
                        </div>

                        <div className="pt-8 border-t border-slate-100 flex justify-end relative z-10">
                          <button onClick={handleUpdateReport} className="w-full sm:w-auto px-10 py-4 bg-brand-blue hover:bg-brand-dark text-white font-black rounded-2xl shadow-[0_8px_20px_-6px_rgba(32,43,92,0.4)] transition-all hover:-translate-y-1 text-base flex items-center justify-center gap-2"><i className="fa-solid fa-file-pdf"></i> Salvar e Gerar Relatório</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ABA: HISTÓRICO */}
                  {circuitMode === 'history' && (
                    <div className="animate-fade-in">
                      {savedCircuits.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-20 text-center bg-white rounded-[3rem] border border-slate-100 shadow-sm px-6"><div className="w-32 h-32 rounded-full bg-blue-50 flex items-center justify-center mb-6 relative"><div className="absolute inset-0 bg-brand-blue/10 animate-ping rounded-full"></div><i className="fa-solid fa-folder-open text-5xl text-brand-blue relative z-10"></i></div><h3 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">O histórico está limpo</h3><p className="text-slate-500 font-medium max-w-sm mx-auto">Vá na aba "Planejar Aula" para criar o primeiro registro e começar a preencher a biblioteca de aulas!</p></div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                          {savedCircuits.map(circ => {
                            const isComplete = circ.details?.resultObtained;
                            return (
                              <div key={circ.id} className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 shadow-sm hover-lift cursor-pointer flex flex-col group relative overflow-hidden" onClick={() => {setViewingCircuit(circ); setCircuitMode('view');}}>
                                <div className={`absolute top-0 left-0 w-full h-1.5 ${isComplete ? 'bg-brand-blue' : 'bg-emerald-400'}`}></div>
                                
                                <div className="flex justify-between items-start mb-5">
                                  <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-inner ${isComplete ? 'bg-blue-50 text-brand-blue' : 'bg-emerald-50 text-emerald-500'}`}>
                                    <i className={`fa-solid ${isComplete ? 'fa-file-signature' : 'fa-calendar-day'}`}></i>
                                  </div>
                                  <span className="text-[10px] font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full tracking-widest">{circ.activity_date.split('-').reverse().join('/')}</span>
                                </div>
                                <h3 className="text-lg font-black text-slate-800 mb-1 leading-tight group-hover:text-brand-blue transition-colors">Atividade {circ.details?.activityNum || '-'}</h3>
                                <p className="text-xs font-bold text-slate-400 mb-6 line-clamp-2 leading-relaxed">{circ.details?.theme || 'Tema não informado'}</p>
                                
                                <button className={`mt-auto pt-5 border-t border-slate-50 text-xs uppercase tracking-widest font-black flex items-center gap-2 ${isComplete ? 'text-brand-blue' : 'text-emerald-500'}`}>
                                  {isComplete ? 'Ver Relatório PDF' : 'Preencher Pós-Aula'} <i className="fa-solid fa-arrow-right group-hover:translate-x-1.5 transition-transform"></i>
                                </button>
                              </div>
                            )
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ABA: VISUALIZANDO RELATÓRIO SALVO */}
                  {circuitMode === 'view' && viewingCircuit && (
                    <div className="space-y-6 animate-fade-in pb-12">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-slate-100 gap-4">
                        <button onClick={() => setCircuitMode('history')} className="w-full sm:w-auto px-6 py-3 bg-slate-50 hover:bg-slate-100 text-slate-600 font-extrabold rounded-2xl transition-colors text-sm flex items-center justify-center"><i className="fa-solid fa-arrow-left mr-2"></i> Voltar</button>
                        <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                          {isAdmin && ( <button onClick={() => handleDeleteCircuit(viewingCircuit.id)} className="w-full sm:w-auto px-6 py-3 bg-white border border-rose-200 text-rose-500 hover:bg-rose-50 font-extrabold rounded-2xl transition-colors text-sm flex items-center justify-center"><i className="fa-solid fa-trash mr-2"></i> Apagar</button> )}
                          <button onClick={startEditingReport} className="w-full sm:w-auto px-6 py-3 bg-emerald-50 text-emerald-600 border border-emerald-100 hover:bg-emerald-100 font-extrabold rounded-2xl transition-colors text-sm flex items-center justify-center"><i className="fa-solid fa-pen-to-square mr-2"></i> Preencher / Editar</button>
                          <button onClick={() => handleGeneratePDF(viewingCircuit)} className="w-full sm:w-auto px-6 py-3 bg-brand-blue hover:bg-brand-dark text-white font-extrabold rounded-2xl transition-all shadow-[0_4px_15px_-4px_rgba(32,43,92,0.4)] text-sm flex items-center justify-center"><i className="fa-solid fa-download mr-2"></i> Baixar PDF</button>
                        </div>
                      </div>

                      <div className="bg-white p-6 sm:p-12 rounded-[2.5rem] shadow-sm border border-slate-100 text-sm text-slate-800 leading-relaxed font-serif overflow-x-hidden relative">
                        <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-brand-blue to-brand-red"></div>
                        
                        <div className="text-center mb-10 pt-4 border-b border-slate-100 pb-8">
                          <img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo" className="h-16 mx-auto mb-6 object-contain drop-shadow-md" onError={(e) => e.target.style.display='none'} />
                          <h2 className="font-black uppercase text-lg sm:text-xl tracking-wide">ATIVIDADE {viewingCircuit.details?.activityNum || 'X'} – {viewingCircuit.details?.theme}</h2>
                        </div>
                        
                        <div className="max-w-3xl mx-auto space-y-8">
                          <div className="flex justify-between border-b border-dashed border-slate-200 pb-4">
                            <p><strong>DATA:</strong> {viewingCircuit.activity_date.split('-').reverse().join('/')}</p>
                            <p className="text-right"><strong>DISCENTES:</strong> {viewingCircuit.details?.students}</p>
                          </div>
                          
                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">ATIVIDADE(S) PROPOSTA(S)</p><p className="whitespace-pre-line text-slate-600 bg-slate-50 p-4 rounded-xl">{viewingCircuit.details?.proposedActivities || 'Não informado.'}</p></div>
                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">OBJETIVO(S) DA(S) ATIVIDADE(S)</p><p className="text-justify whitespace-pre-line text-slate-600">{viewingCircuit.details?.objectives || 'Não informado.'}</p></div>

                          <div className="bg-amber-50 p-5 rounded-2xl border border-amber-100 text-amber-900">
                            <p className="font-bold mb-3 text-xs uppercase tracking-widest text-amber-700">OBSERVAÇÕES OPERACIONAIS</p>
                            <ul className="list-disc list-inside space-y-1">
                              <li><strong>Sinais vitais:</strong> {viewingCircuit.details?.vitalSigns || '-'}</li>
                              <li><strong>Som, tempo e fotos:</strong> {viewingCircuit.details?.soundAndPhotos || '-'}</li>
                              <li><strong>Cuidados especiais:</strong> {viewingCircuit.details?.specialCare || '-'}</li>
                            </ul>
                          </div>

                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">MATERIAIS UTILIZADOS</p><p className="whitespace-pre-line text-slate-600">{viewingCircuit.details?.materials || 'Não informado.'}</p></div>

                          <div className="border-l-4 border-emerald-400 pl-6 space-y-6">
                            <p className="font-black text-emerald-600 text-sm uppercase tracking-widest">DESENVOLVIMENTO (Prática)</p>
                            <p><strong className="text-slate-800">Aquecimento:</strong> <span className="text-slate-600">{viewingCircuit.details?.warmUp || 'Não informado.'}</span></p>
                            
                            <div className="space-y-4">
                              {viewingCircuit.stations && viewingCircuit.stations.map((station, idx) => (
                                <div key={idx} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                  <p className="font-black text-slate-800">Estação {idx + 1} {idx === 4 && <span className="text-brand-red font-bold text-xs ml-2">FUNCIONAL</span>}</p>
                                  <p className="text-[10px] uppercase font-bold text-slate-400 mb-2 mt-1 border-b border-slate-100 pb-2">Resp: {viewingCircuit.details?.stationResponsibles?.[idx]}</p>
                                  <ul className="list-inside space-y-1 mt-2">
                                    {station.length === 0 ? <li className="text-xs text-slate-400 italic">Nenhum exercício vinculado.</li> : station.map(ex => <li key={ex.id} className="text-sm font-semibold text-slate-700"><i className="fa-solid fa-check text-emerald-400 mr-2"></i> {ex.title} <span className="text-xs font-normal text-slate-400">({ex.dosage})</span></li>)}
                                  </ul>
                                </div>
                              ))}
                            </div>

                            <p><strong className="text-slate-800">Desaquecimento:</strong> <span className="text-slate-600">{viewingCircuit.details?.coolDown || 'Não informado.'}</span></p>
                          </div>

                          {/* TABELA DE SINAIS VITAIS */}
                          {viewingCircuit.details?.attendanceList && viewingCircuit.details.attendanceList.some(p => p.present) && (
                            <div className="mt-8 border border-slate-200 rounded-2xl overflow-hidden">
                              <div className="bg-slate-100 p-4 border-b border-slate-200"><p className="font-black text-slate-700 text-xs uppercase tracking-widest text-center"><i className="fa-solid fa-clipboard-user mr-1 text-brand-red"></i> Quadro Clínico e Frequência</p></div>
                              <div className="overflow-x-auto">
                                <table className="w-full text-xs text-center whitespace-nowrap">
                                  <thead className="bg-slate-50 text-slate-500 border-b border-slate-200">
                                    <tr><th className="p-3 text-left pl-6">Nome do Idoso</th><th className="p-3">FC (I/F)</th><th className="p-3">SpO2 (I/F)</th><th className="p-3">PA (I/F)</th></tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                    {viewingCircuit.details.attendanceList.filter(p => p.present).map(p => (
                                      <tr key={p.id} className="hover:bg-slate-50 font-medium text-slate-700">
                                        <td className="p-3 text-left pl-6 truncate max-w-[200px] font-bold">{p.name}</td>
                                        <td className="p-3">{p.fc_in || '-'} / {p.fc_out || '-'}</td>
                                        <td className="p-3">{p.spo2_in || '-'} / {p.spo2_out || '-'}</td>
                                        <td className="p-3">{p.pa_in || '-'} / {p.pa_out || '-'}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}

                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest mt-8">RELATO NARRATIVO PÓS-AULA</p><p className="text-justify whitespace-pre-line text-slate-600 bg-blue-50/50 p-6 rounded-2xl border border-blue-100">{viewingCircuit.details?.developmentNarrative || 'Relatório ainda não preenchido.'}</p></div>
                          <div><p className="font-bold text-amber-600 mb-2 text-xs uppercase tracking-widest mt-8">EVOLUÇÃO E INTERCORRÊNCIAS</p><p className="whitespace-pre-line text-amber-900 bg-amber-50 p-6 rounded-2xl border border-amber-200">{viewingCircuit.details?.dailyEvolution || 'Sem anotações clínicas.'}</p></div>
                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">RESULTADO OBTIDO</p><p className="text-justify whitespace-pre-line text-slate-600">{viewingCircuit.details?.resultObtained || '-'}</p></div>
                          
                          <div className="text-center pt-8 border-t border-dashed border-slate-200"><p className="text-xl font-black text-slate-800 bg-slate-100 inline-block px-6 py-3 rounded-2xl shadow-inner"><strong>Público Atendido:</strong> <span className="text-brand-red">{viewingCircuit.details?.attendanceCount || 'Não informado.'}</span></p></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* === TELA: BIBLIOTECA === */}
              {currentView === 'library' && (
                <div className="max-w-6xl mx-auto space-y-6">
                  <div className="bg-white p-4 sm:p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col gap-4">
                    <div className="relative w-full">
                      <i className="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-400 text-lg"></i>
                      <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Encontre exercícios por nome, foco..." className="w-full pl-14 pr-4 py-4 rounded-2xl bg-slate-50 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10 outline-none text-sm font-semibold transition-all shadow-inner text-slate-700" />
                    </div>
                    
                    <div className="flex gap-2 sm:gap-3 overflow-x-auto pb-2 pt-1 px-1 no-scrollbar">
                      <button onClick={() => {setFilterCat('all'); setFilterSub('Todos');}} className={`px-5 py-2.5 rounded-full text-xs font-black uppercase tracking-widest whitespace-nowrap transition-all shadow-sm ${filterCat === 'all' ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:border-slate-300'}`}>Tudo</button>
                      {Object.keys(CATEGORIES).map(key => (
                        <button key={key} onClick={() => {setFilterCat(key); setFilterSub('Todos');}} className={`px-5 py-2.5 rounded-full text-xs font-black uppercase tracking-widest whitespace-nowrap transition-all shadow-sm flex items-center gap-2 ${filterCat === key ? `${CATEGORIES[key].bg} ${CATEGORIES[key].color} ring-2 ring-offset-1 ring-${CATEGORIES[key].color.split('-')[1]}-300` : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}`}><i className={`fa-solid ${CATEGORIES[key].icon}`}></i> {CATEGORIES[key].shortTitle}</button>
                      ))}
                    </div>
                    
                    {filterCat !== 'all' && (
                      <div className="flex gap-2 mt-2 overflow-x-auto pb-2 px-1 no-scrollbar items-center bg-slate-50 p-2 rounded-2xl border border-slate-100">
                        <span className="text-[10px] font-black uppercase text-slate-400 ml-2 mr-2 shrink-0 tracking-widest">Foco:</span>
                        {CATEGORIES[filterCat].subgroups.map(sub => (
                          <button key={sub} onClick={() => setFilterSub(sub)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-colors ${filterSub === sub ? `bg-white ${CATEGORIES[filterCat].color} shadow-sm border ${CATEGORIES[filterCat].border}` : 'bg-transparent text-slate-500 hover:bg-white hover:shadow-sm'}`}>{sub}</button>
                        ))}
                      </div>
                    )}
                  </div>

                  {filteredExercises.length === 0 ? (
                    <div className="flex flex-col items-center justify-center py-20 bg-white rounded-[3rem] border border-slate-100 shadow-sm px-6 text-center">
                      <div className="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-magnifying-glass text-3xl text-slate-300"></i></div>
                      <h3 className="text-xl font-black text-slate-800">Nenhum exercício encontrado</h3>
                      <p className="text-sm font-medium text-slate-500 mt-2">Tente buscar por outro termo ou cadastre um novo conteúdo.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                      {filteredExercises.map(ex => {
                        const ytId = getYouTubeId(ex.videoUrl);
                        const ytThumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null;
                        const isImage = ex.mediaUrl && ex.mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)/i);
                        const isVideo = ex.mediaUrl && ex.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i);
                        const cat = CATEGORIES[ex.category] || CATEGORIES['mmss'];

                        return (
                          <div key={ex.id} className="bg-white rounded-[2rem] border border-slate-100 shadow-sm hover-lift flex flex-col group cursor-pointer overflow-hidden" onClick={() => { setSelectedExercise(ex); setCurrentView('detail'); }}>
                            <div className="h-44 bg-slate-100 flex items-center justify-center relative overflow-hidden">
                              {ytThumb ? ( <img src={ytThumb} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /> ) : 
                               isImage ? ( <img src={ex.mediaUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /> ) : 
                               isVideo ? ( <div className="w-full h-full bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center group-hover:scale-105 transition-transform duration-700"><i className="fa-solid fa-circle-play text-4xl text-brand-red mb-2 drop-shadow-md"></i><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Vídeo Anexado</span></div> ) : 
                               ( <i className="fa-solid fa-dumbbell text-4xl text-slate-300"></i> )}
                              
                              <div className="absolute inset-0 bg-brand-dark/20 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center"><div className="bg-white/90 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transform scale-50 group-hover:scale-100 transition-transform duration-300 delay-100"><i className="fa-solid fa-eye text-brand-blue text-xl"></i></div></div>
                            </div>
                            
                            <div className="p-5 sm:p-6 flex-1 flex flex-col bg-white">
                              <span className={`text-[9px] font-black uppercase tracking-widest ${cat.color} ${cat.bg} px-2.5 py-1 rounded-md border ${cat.border} mb-3 self-start shadow-sm`}>{ex.muscleGroup}</span>
                              <h3 className="font-extrabold text-slate-800 text-lg leading-tight group-hover:text-brand-blue transition-colors line-clamp-2">{ex.title}</h3>
                            </div>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        // CÓDIGO EXTERMINADOR DE CACHE (Limpa o celular de todos os monitores)
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let reg of registrations) { reg.unregister(); }
          });
        }

        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-pattern"><div className="bg-white p-8 rounded-3xl shadow-xl flex flex-col items-center"><div className="w-16 h-16 border-4 border-slate-100 border-t-brand-blue rounded-full animate-spin mb-4"></div><p className="text-brand-blue font-black tracking-widest uppercase text-xs">Carregando Plataforma...</p></div></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} updateSessionData={setSession} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
