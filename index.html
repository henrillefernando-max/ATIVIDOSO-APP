<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="Logo_ATV_2024_Colorido_v2.png">

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Nunito', 'sans-serif'] }, colors: { brand: { blue: '#202B5C', dark: '#161E42', red: '#D12836', redDark: '#A81A26', light: '#F8FAFC' } } } }
    }
  </script>
  <style>
    body { background-color: #f8fafc; color: #334155; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .bg-pattern { background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; }
    .blob-shape { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }

</head>
<body class="bg-pattern">
  <div id="root"><div style="display:flex;justify-content:center;align-items:center;min-height:100vh;"><h2 style="font-weight:900;">Carregando ATIVIDOSO...</h2></div></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://rewkwzxuogdopzkqliwi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld2t3enh1b2dkb3B6a3FsaXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDc3MjYsImV4cCI6MjEwMzI4MzcyNn0.ZW_KB3wl21aB00zCcyEqBQbOOFpGdOoxuctwU-6ICFM";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = {
      'mmss': { title: 'Mobilidade e fortalecimento de MMSS', shortTitle: 'MMSS e Tronco', icon: 'fa-child-reaching', color: 'text-sky-500', bg: 'bg-sky-50', border: 'border-sky-200', subgroups: ['Todos', 'Bíceps', 'Tríceps', 'Peito', 'Costas', 'Abdômen', 'Ombro', 'Punho', 'Outro'] },
      'mmii': { title: 'Mobilidade e fortalecimento de MMII', shortTitle: 'Membros Inferiores', icon: 'fa-person-walking', color: 'text-emerald-500', bg: 'bg-emerald-50', border: 'border-emerald-200', subgroups: ['Todos', 'Quadríceps', 'Glúteos', 'Isquiotibiais', 'Panturrilhas', 'Tornozelo e Pé', 'Outro'] },
      'cardio': { title: 'Aeróbicos e condicionamento cardiorrespiratório', shortTitle: 'Aeróbicos e Cardio', icon: 'fa-heart-pulse', color: 'text-rose-500', bg: 'bg-rose-50', border: 'border-rose-200', subgroups: ['Todos', 'Caminhada', 'Marcha', 'Circuitos', 'Resistência Contínua', 'Outro'] },
      'dupla_tarefa': { title: 'Dupla tarefa (motora e cognitiva)', shortTitle: 'Dupla Tarefa', icon: 'fa-brain', color: 'text-violet-500', bg: 'bg-violet-50', border: 'border-violet-200', subgroups: ['Todos', 'Motora', 'Cognitiva', 'Motora + Cognitiva', 'Controle Postural', 'Equilíbrio', 'Coordenação', 'Atenção Dividida', 'Outro'] }
    };

    const AGENDA_DATA = [
      { act: 17, date: "14/08/2026", title: "RETORNO: Gincana/ dinâmica", resp: "Todos os integrantes do projeto" },
      { act: 18, date: "21/08/2026", title: "Mobilidade e fortalecimento MMSS", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 19, date: "28/08/2026", title: "Mobilidade e fortalecimento MMII", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 20, date: "04/09/2026", title: "Aeróbicos e condicionamento", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 21, date: "11/09/2026", title: "Dupla tarefa (motora e cognitiva)", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 22, date: "18/09/2026", title: "Mobilidade e fortalecimento MMSS", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 23, date: "25/09/2026", title: "Mobilidade e fortalecimento MMII", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 24, date: "02/10/2026", title: "Aeróbicos e condicionamento", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 25, date: "09/10/2026", title: "Mobilidade e fortalecimento MMII", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 26, date: "16/10/2026", title: "Atividade educativa em saúde", resp: "Todos" },
      { act: 27, date: "23/10/2026", title: "Aeróbicos e condicionamento", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 28, date: "30/10/2026", title: "Dupla tarefa (motora e cognitiva)", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 29, date: "06/11/2026", title: "Mobilidade e fortalecimento MMSS", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 30, date: "13/11/2026", title: "Mobilidade e fortalecimento MMII", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 31, date: "27/11/2026", title: "Avaliação participativa", resp: "Todos" },
      { act: 32, date: "04/12/2026", title: "Encerramento do semestre", resp: "Todos" }
    ];

    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        if (isLogin) {
          const { data, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (authError) { setError("E-mail ou senha incorretos."); setLoading(false); return; }
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
          onLogin({ id: data.user.id, email: data.user.email, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
        } else {
          const { data, error: signUpError } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
          if (signUpError) { setError(signUpError.message); setLoading(false); } 
          else {
            if (data.user) { await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name: name, role: 'Monitor' }]); alert("Conta criada! Faça login."); setIsLogin(true); setPassword(''); }
            setLoading(false);
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl w-full max-w-md border border-slate-100 overflow-hidden relative z-10">
            <div className="bg-gradient-to-br from-brand-blue to-brand-dark p-8 text-center">
              <img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo" className="h-16 mx-auto mb-2 object-contain" onError={(e) => e.target.style.display = 'none'} />
              <h2 className="text-2xl font-black text-white">Bem-vindo(a)</h2>
            </div>
            <div className="p-8">
              <form onSubmit={handleSubmit} className="space-y-4">
                {!isLogin && ( <input type="text" value={name} onChange={e=>setName(e.target.value)} required className="w-full px-4 py-3 rounded-xl bg-slate-50 border outline-none text-sm font-semibold" placeholder="Seu Nome Completo" /> )}
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-4 py-3 rounded-xl bg-slate-50 border outline-none text-sm font-semibold" placeholder="E-mail" />
                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full px-4 py-3 rounded-xl bg-slate-50 border outline-none text-sm font-semibold" placeholder="Senha" />
                {error && <div className="text-rose-500 text-xs font-bold text-center">{error}</div>}
                <button type="submit" disabled={loading} className="w-full bg-brand-red hover:bg-brand-redDark text-white font-black py-3.5 rounded-xl transition shadow-md">{loading ? 'Aguarde...' : (isLogin ? 'Entrar no Aplicativo' : 'Criar Conta')}</button>
              </form>
              <div className="mt-6 text-center"><button onClick={() => {setIsLogin(!isLogin); setError('');}} className="text-sm font-bold text-slate-500">{isLogin ? "Criar conta." : "Já tenho conta."}</button></div>
            </div>
          </div>
        </div>
      );
    };

    const Dashboard = ({ session, onLogout, updateSessionData }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      const [selectedExercise, setSelectedExercise] = useState(null);
      
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [participantsList, setParticipantsList] = useState([]);
      
      // Cadastro Forms
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false });

      // Circuitos / Aula
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);
      const [planDetails, setPlanDetails] = useState({ activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] });

      // Perfil & Avisos
      const [newAnnouncement, setNewAnnouncement] = useState({ title: '', content: '', link_url: '' });
      const [profileForm, setProfileForm] = useState({ full_name: session.full_name, team_group: session.team_group || '' });
      const [profileAvatarFile, setProfileAvatarFile] = useState(null);
      const [profileStatus, setProfileStatus] = useState('');

      useEffect(() => {
        const fetchAll = async () => {
          const [{data:ex}, {data:ci}, {data:an}, {data:pa}] = await Promise.all([
            supabaseClient.from('exercises').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('circuits').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('announcements').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('participants').select('*').order('name', { ascending: true })
          ]);
          if(ex) setExercises(ex); if(ci) setSavedCircuits(ci); if(an) setAnnouncements(an); if(pa) setParticipantsList(pa);
        };
        fetchAll();
      }, [currentView, circuitMode]);

      const upcomingActivity = useMemo(() => {
        if(!session.team_group || session.team_group === 'Nenhum') return null;
        const today = new Date(); today.setHours(0,0,0,0);
        for (let item of AGENDA_DATA) {
          if (item.resp.includes(session.team_group) || item.resp.includes('Todos')) {
            const [d, m, y] = item.date.split('/'); const itemDate = new Date(y, m - 1, d); itemDate.setDate(itemDate.getDate() + 1); 
            if (itemDate >= today) return item;
          }
        }
        return null;
      }, [session.team_group]);

      const approvedExercises = exercises.filter(ex => ex.status === 'approved');
      const filteredExercises = approvedExercises.filter(ex => (filterCat === 'all' || ex.category === filterCat) && (filterSub === 'Todos' || ex.muscleGroup === filterSub) && (ex.title.toLowerCase().includes(searchQuery.toLowerCase())));

      // PERFIL
      const handleSaveProfile = async (e) => {
        e.preventDefault(); setProfileStatus('Salvando...');
        let newAvatarUrl = session.avatar_url;
        if (profileAvatarFile) {
          const fileName = `avatar_${session.id}_${Date.now()}.${profileAvatarFile.name.split('.').pop()}`;
          const { error } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, profileAvatarFile);
          if (!error) newAvatarUrl = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName).data.publicUrl;
        }
        const { error } = await supabaseClient.from('profiles').update({ full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }).eq('id', session.id);
        if(!error) { setProfileStatus('Salvo!'); updateSessionData({ ...session, full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }); }
      };

      // AVISOS
      const handlePostAnnouncement = async (e) => {
        e.preventDefault();
        const { data } = await supabaseClient.from('announcements').insert([newAnnouncement]).select();
        if(data) { setAnnouncements([data[0], ...announcements]); setNewAnnouncement({ title: '', content: '', link_url: '' }); }
      };
      const handleDeleteAnnouncement = async (id) => { if(window.confirm("Apagar?")) { await supabaseClient.from('announcements').delete().eq('id', id); setAnnouncements(announcements.filter(a => a.id !== id)); } };

      // EXERCÍCIOS
      const handleFormSubmit = async (e) => {
        e.preventDefault(); setFormStatus({ loading: true, success: false });
        let url = null;
        if (mediaFile) {
          const fName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${mediaFile.name.split('.').pop()}`;
          await supabaseClient.storage.from('midia_exercicios').upload(fName, mediaFile);
          url = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fName).data.publicUrl;
        }
        const ex = { title: formData.title, category: formCat, "muscleGroup": formMuscleSelect==='Outro'?formCustomMuscle:formMuscleSelect, difficulty: formData.difficulty, equipment: formData.equipment, dosage: formData.dosage, "videoUrl": formData.videoUrl, "mediaUrl": url, instructions: formData.instructions, precautions: formData.precautions, status: 'pending', author: session.full_name };
        const { error } = await supabaseClient.from('exercises').insert([ex]);
        if (!error) { setFormStatus({ loading: false, success: true }); setFormData({ title:'', difficulty:'Iniciante / Leve', equipment:'Nenhum', dosage:'', videoUrl:'', instructions:'', precautions:'' }); setFormCat(''); setFormMuscleSelect(''); setMediaFile(null); }
      };
      const handleApprove = async (id) => { await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id); setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex)); };
      const handleReject = async (id) => { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); };
      const handleDeleteExercise = async (id) => { if(window.confirm("Apagar exercício?")) { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); setCurrentView('library'); } };

      // AULAS / RELATÓRIOS
      const handleAddParticipant = async () => {
        const name = prompt('Nome do idoso:');
        if(name) { const { data } = await supabaseClient.from('participants').insert([{ name }]).select(); if(data) setParticipantsList([...participantsList, data[0]].sort((a,b)=>a.name.localeCompare(b.name))); }
      };
      const updateAttendance = (idx, field, val) => {
         const list = [...planDetails.attendanceList]; list[idx][field] = val;
         setPlanDetails({...planDetails, attendanceList: list, attendanceCount: field==='present' ? list.filter(p=>p.present).length.toString() : planDetails.attendanceCount});
      };
      const startPlanning = () => { setPlanDetails({ activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['','','','',''], proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] }); setCircuit([[],[],[],[],[]]); setCircuitMode('plan'); };
      const startEditingReport = () => { 
        let list = viewingCircuit.details.attendanceList || [];
        if (list.length === 0) list = participantsList.map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
        else { const ids = list.map(c=>c.id); list = [...list, ...participantsList.filter(p=>!ids.includes(p.id)).map(p=>({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }))].sort((a,b)=>a.name.localeCompare(b.name)); }
        setPlanDetails({ ...viewingCircuit.details, attendanceList: list }); setCircuitMode('report_edit'); 
      };
      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Preencha Número, Tema e Data!');
        const { data, error } = await supabaseClient.from('circuits').insert([{ activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name }]).select();
        if (!error) { alert('Salvo!'); setSavedCircuits([data[0], ...savedCircuits]); setCircuitMode('history'); }
      };
      const handleUpdateReport = async () => {
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (!error) { alert('Relatório Salvo!'); setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? { ...c, details: planDetails } : c)); setViewingCircuit({ ...viewingCircuit, details: planDetails }); setCircuitMode('view'); }
      };
      const handleGeneratePDF = (circuitData) => {
        const d = circuitData.details;
        let stHtml = ''; circuitData.stations.forEach((st, i) => { stHtml += `<div style="margin-bottom:10px;"><strong>Estação ${i+1}</strong> (Resp: ${d.stationResponsibles?.[i]||'-'}): ${st.length===0?'Sem ex.':st.map(e=>e.title).join(', ')}</div>`; });
        let vitHtml = ''; if(d.attendanceList && d.attendanceList.some(p=>p.present)) {
          vitHtml = `<table style="width:100%;border-collapse:collapse;font-size:11px;margin:20px 0;text-align:center;"><tr style="background:#f1f5f9;border-bottom:2px solid #cbd5e1;"><th style="padding:4px;text-align:left;">NOME</th><th>FC (I/F)</th><th>SpO2 (I/F)</th><th>PA (I/F)</th></tr>` + d.attendanceList.filter(p=>p.present).map(p=>`<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:4px;text-align:left;">${p.name}</td><td>${p.fc_in||'-'} / ${p.fc_out||'-'}</td><td>${p.spo2_in||'-'} / ${p.spo2_out||'-'}</td><td>${p.pa_in||'-'} / ${p.pa_out||'-'}</td></tr>`).join('') + `</table>`;
        }
        const element = document.createElement('div');
        element.innerHTML = `<div style="font-family:Arial;font-size:14px;color:#333;line-height:1.5;padding:30px;"><h2 style="text-align:center;text-transform:uppercase;">ATIVIDADE ${d.activityNum||'X'} – ${d.theme||'-'}</h2><p><strong>DATA:</strong> ${circuitData.activity_date.split('-').reverse().join('/')}</p><p><strong>DISCENTES:</strong> ${d.students||'-'}</p><br><p><strong>OBJETIVOS:</strong> ${d.objectives||'-'}</p><p><strong>PROPOSTAS:</strong> ${d.proposedActivities||'-'}</p><p><strong>MATERIAIS:</strong> ${d.materials||'-'}</p><p><strong>OPERAÇÃO (SV, Som, Cuid.):</strong> ${d.vitalSigns||'-'} | ${d.soundAndPhotos||'-'} | ${d.specialCare||'-'}</p><br><p><strong>AQUECIMENTO:</strong> ${d.warmUp||'-'}</p>${stHtml}<p><strong>DESAQUECIMENTO:</strong> ${d.coolDown||'-'}</p><br>${vitHtml}<p><strong>RELATO NARRATIVO:</strong> ${d.developmentNarrative||'-'}</p><p><strong>EVOLUÇÃO:</strong> ${d.dailyEvolution||'-'}</p><p><strong>RESULTADOS:</strong> ${d.resultObtained||'-'}</p><p><strong>TOTAL PRESENTES:</strong> ${d.attendanceCount||'-'}</p></div>`;
        html2pdf().set({ margin: 0.4, filename: `Relatorio_ATIV_${d.activityNum||'00'}.pdf` }).from(element).save();
      };

      const NavBtn = ({v, icon, text}) => <button onClick={()=>setCurrentView(v)} className={`flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold w-full transition-all ${currentView===v ? 'bg-brand-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><i className={`fa-solid ${icon} w-5`}></i> {text}</button>;

      return (
        <div className="min-h-screen flex bg-slate-50 relative">
          {isMobileMenuOpen && <div className="fixed inset-0 bg-black/40 z-40 md:hidden" onClick={()=>setIsMobileMenuOpen(false)}></div>}
          
          <aside className={`w-72 bg-white flex flex-col h-screen fixed md:relative z-50 transition-transform duration-300 border-r border-slate-200 ${isMobileMenuOpen?'translate-x-0':'-translate-x-full'} md:translate-x-0`}>
            <div className="p-6 text-center"><h1 className="text-2xl font-black text-brand-blue">ATIV<span className="text-brand-red">IDOSO</span></h1></div>
            <div className="px-6 pb-4 border-b flex items-center gap-3 cursor-pointer" onClick={()=>setCurrentView('perfil')}>
              {session.avatar_url ? <img src={session.avatar_url} className="w-10 h-10 rounded-full object-cover shadow-sm"/> : <div className="w-10 h-10 bg-brand-red text-white flex items-center justify-center rounded-full font-bold">{session.full_name[0]}</div>}
              <div className="overflow-hidden"><p className="text-sm font-bold text-slate-800 truncate">{session.full_name}</p><p className="text-[10px] text-emerald-600 font-bold bg-emerald-50 px-2 rounded-full inline-block">{session.team_group || 'Sem Grupo'}</p></div>
            </div>
            <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
              <NavBtn v="home" icon="fa-home" text="Início & Mural" />
              <NavBtn v="library" icon="fa-dumbbell" text="Acervo de Exercícios" />
              <NavBtn v="circuito" icon="fa-clipboard-list" text="Aulas e Relatórios" />
              <NavBtn v="cadastro" icon="fa-circle-plus" text="Criar Exercício" />
              {isAdmin && <button onClick={()=>setCurrentView('aprovacoes')} className={`flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-bold w-full transition-all ${currentView==='aprovacoes' ? 'bg-amber-500 text-white' : 'text-slate-600 hover:bg-slate-50'}`}><div className="flex gap-3"><i className="fa-solid fa-check-double w-5"></i> Aprovações</div>{pendingCount>0 && <span className="bg-white text-amber-600 text-[10px] px-2 rounded-full">{pendingCount}</span>}</button>}
            </nav>
            <div className="p-4 border-t"><button onClick={onLogout} className="w-full text-slate-500 hover:text-rose-500 font-bold text-sm py-2"><i className="fa-solid fa-power-off mr-2"></i>Sair</button></div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header className="h-16 bg-white border-b px-6 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3"><button onClick={()=>setIsMobileMenuOpen(true)} className="md:hidden text-slate-500"><i className="fa-solid fa-bars text-xl"></i></button><h2 className="font-black text-slate-800 uppercase tracking-widest text-sm">{currentView}</h2></div>
            </header>
            
            <div className="flex-1 overflow-y-auto p-4 sm:p-8">
              
              {/* === PERFIL === */}
              {currentView === 'perfil' && (
                <div className="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                  <h2 className="text-xl font-black mb-6 border-b pb-4">Meu Perfil</h2>
                  {profileStatus && <div className="mb-4 text-emerald-600 font-bold">{profileStatus}</div>}
                  <form onSubmit={handleSaveProfile} className="space-y-4">
                    <div className="flex items-center gap-4 mb-4">{session.avatar_url && <img src={session.avatar_url} className="w-16 h-16 rounded-full object-cover"/>}<input type="file" onChange={e=>setProfileAvatarFile(e.target.files[0])} className="text-xs" /></div>
                    <input type="text" value={profileForm.full_name} onChange={e=>setProfileForm({...profileForm, full_name:e.target.value})} className="w-full p-3 rounded-xl bg-slate-50 border outline-none font-bold" />
                    <select value={profileForm.team_group} onChange={e=>setProfileForm({...profileForm, team_group:e.target.value})} className="w-full p-3 rounded-xl bg-slate-50 border outline-none font-bold"><option value="Nenhum">Sem Grupo</option><option value="E1">E1</option><option value="E2">E2</option><option value="E3">E3</option><option value="E4">E4</option></select>
                    <button className="bg-brand-blue text-white font-bold px-6 py-3 rounded-xl">Salvar Perfil</button>
                  </form>
                </div>
              )}

              {/* === HOME / MURAL === */}
              {currentView === 'home' && (
                <div className="max-w-5xl mx-auto space-y-6">
                  {upcomingActivity && (
                    <div className="bg-emerald-500 p-6 rounded-2xl text-white shadow-lg flex items-center justify-between">
                      <div><h2 className="font-black text-xl mb-1"><i className="fa-solid fa-bell mr-2"></i> Atenção, Grupo {session.team_group}!</h2><p className="text-sm">Vocês darão aula em: <strong>{upcomingActivity.date}</strong> - {upcomingActivity.title}</p></div>
                      <button onClick={()=>{setCurrentView('circuito');setCircuitMode('plan');}} className="bg-white text-emerald-600 px-4 py-2 font-bold rounded-lg shadow-sm">Planejar</button>
                    </div>
                  )}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                      <h3 className="font-black text-lg mb-4 border-b pb-2">Mural de Avisos</h3>
                      {isAdmin && ( <form onSubmit={handlePostAnnouncement} className="flex gap-2 mb-6"><input value={newAnnouncement.title} onChange={e=>setNewAnnouncement({...newAnnouncement, title:e.target.value})} placeholder="Aviso..." className="flex-1 p-2 bg-slate-50 border rounded-lg text-sm" required /><button className="bg-brand-blue text-white px-4 rounded-lg font-bold text-sm">+</button></form> )}
                      <div className="space-y-3">
                        {announcements.map(a => (<div key={a.id} className="p-4 bg-slate-50 rounded-xl relative">{isAdmin && <button onClick={()=>handleDeleteAnnouncement(a.id)} className="absolute top-3 right-3 text-rose-500"><i className="fa-solid fa-trash"></i></button>}<p className="font-bold text-slate-800">{a.title}</p><p className="text-sm text-slate-600">{a.content}</p></div>))}
                      </div>
                    </div>
                    <div className="space-y-4">
                      <div className="bg-white p-6 rounded-3xl shadow-sm flex items-center gap-4"><div className="text-3xl text-sky-500"><i className="fa-solid fa-dumbbell"></i></div><div><p className="text-2xl font-black">{approvedExercises.length}</p><p className="text-xs text-slate-500 font-bold uppercase">Exercícios</p></div></div>
                      <div className="bg-white p-6 rounded-3xl shadow-sm flex items-center gap-4"><div className="text-3xl text-emerald-500"><i className="fa-solid fa-calendar-check"></i></div><div><p className="text-2xl font-black">{savedCircuits.length}</p><p className="text-xs text-slate-500 font-bold uppercase">Aulas</p></div></div>
                    </div>
                  </div>
                </div>
              )}

              {/* === BIBLIOTECA === */}
              {currentView === 'library' && (
                <div className="max-w-6xl mx-auto">
                  <div className="mb-6 flex gap-2 overflow-x-auto p-1"><button onClick={()=>setFilterCat('all')} className={`px-4 py-2 rounded-full text-xs font-bold ${filterCat==='all'?'bg-slate-800 text-white':'bg-white'}`}>Todos</button>{Object.keys(CATEGORIES).map(k=><button key={k} onClick={()=>setFilterCat(k)} className={`px-4 py-2 rounded-full text-xs font-bold ${filterCat===k?'bg-brand-blue text-white':'bg-white'}`}>{CATEGORIES[k].shortTitle}</button>)}</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {filteredExercises.map(ex => (
                      <div key={ex.id} className="bg-white rounded-2xl overflow-hidden shadow-sm cursor-pointer border hover:border-brand-blue transition" onClick={()=>{setSelectedExercise(ex);setCurrentView('detail');}}>
                        <div className="h-32 bg-slate-100 flex items-center justify-center text-slate-300 text-3xl">{ex.mediaUrl||ex.videoUrl ? <i className="fa-solid fa-play text-brand-red"></i> : <i className="fa-solid fa-image"></i>}</div>
                        <div className="p-4"><p className="text-[9px] uppercase font-black text-brand-red">{ex.muscleGroup}</p><h3 className="font-bold text-sm leading-tight mt-1 truncate">{ex.title}</h3></div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* === DETALHES DO EXERCÍCIO === */}
              {currentView === 'detail' && selectedExercise && (
                <div className="max-w-3xl mx-auto bg-white rounded-3xl overflow-hidden shadow-md">
                   <div className="p-6 border-b flex justify-between"><button onClick={()=>setCurrentView('library')} className="font-bold text-slate-500"><i className="fa-solid fa-arrow-left"></i> Voltar</button>{isAdmin && <button onClick={()=>handleDeleteExercise(selectedExercise.id)} className="text-rose-500"><i className="fa-solid fa-trash"></i></button>}</div>
                   <div className="p-6 bg-slate-50"><h1 className="text-2xl font-black">{selectedExercise.title}</h1><p className="text-xs font-bold text-brand-red uppercase">{selectedExercise.muscleGroup}</p></div>
                   <div className="aspect-video bg-black flex items-center justify-center">
                      {(selectedExercise.mediaUrl || selectedExercise.videoUrl) ? <a href={selectedExercise.videoUrl||selectedExercise.mediaUrl} target="_blank" className="text-white font-bold bg-brand-red px-6 py-3 rounded-full"><i className="fa-brands fa-youtube mr-2"></i> Abrir Mídia</a> : <span className="text-white">Sem mídia</span>}
                   </div>
                   <div className="p-6 space-y-4">
                      <p><strong>Equipamento:</strong> {selectedExercise.equipment}</p>
                      <p><strong>Dosagem:</strong> {selectedExercise.dosage}</p>
                      <div><strong>Passo a Passo:</strong><p className="bg-slate-50 p-4 rounded-xl text-sm whitespace-pre-line mt-2">{selectedExercise.instructions}</p></div>
                      {selectedExercise.precautions && <div><strong className="text-amber-600">Precauções:</strong><p className="bg-amber-50 text-amber-900 p-4 rounded-xl text-sm whitespace-pre-line mt-2">{selectedExercise.precautions}</p></div>}
                   </div>
                </div>
              )}

              {/* === CADASTRO DE EXERCÍCIO === */}
              {currentView === 'cadastro' && (
                <div className="max-w-3xl mx-auto bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                  <h2 className="text-2xl font-black mb-6 border-b pb-4">Cadastrar Exercício</h2>
                  {formStatus.success ? <div className="text-center p-10"><i className="fa-solid fa-check-circle text-5xl text-emerald-500 mb-4"></i><h3 className="font-bold text-xl">Enviado para aprovação!</h3><button onClick={()=>setFormStatus({success:false})} className="mt-4 bg-brand-blue text-white px-6 py-2 rounded-xl">Novo Cadastro</button></div> : 
                  <form onSubmit={handleFormSubmit} className="space-y-4">
                    <input type="text" placeholder="Título" value={formData.title} onChange={e=>setFormData({...formData,title:e.target.value})} required className="w-full p-3 bg-slate-50 rounded-xl outline-none font-bold"/>
                    <div className="grid grid-cols-2 gap-4">
                      <select required value={formCat} onChange={e=>{setFormCat(e.target.value);setFormMuscleSelect('');}} className="p-3 bg-slate-50 rounded-xl outline-none"><option value="">Categoria...</option>{Object.keys(CATEGORIES).map(k=><option key={k} value={k}>{CATEGORIES[k].title}</option>)}</select>
                      <select required value={formMuscleSelect} onChange={e=>setFormMuscleSelect(e.target.value)} disabled={!formCat} className="p-3 bg-slate-50 rounded-xl outline-none"><option value="">Músculo...</option>{formCat && CATEGORIES[formCat].subgroups.map(s=><option key={s} value={s}>{s}</option>)}</select>
                    </div>
                    {formMuscleSelect==='Outro' && <input type="text" placeholder="Qual músculo?" value={formCustomMuscle} onChange={e=>setFormCustomMuscle(e.target.value)} required className="w-full p-3 bg-red-50 rounded-xl outline-none"/>}
                    <div className="grid grid-cols-2 gap-4">
                      <input type="text" placeholder="Dosagem (Ex: 3x10)" value={formData.dosage} onChange={e=>setFormData({...formData,dosage:e.target.value})} required className="p-3 bg-slate-50 rounded-xl outline-none"/>
                      <input type="text" placeholder="Equipamento" value={formData.equipment} onChange={e=>setFormData({...formData,equipment:e.target.value})} className="p-3 bg-slate-50 rounded-xl outline-none"/>
                    </div>
                    <div className="flex gap-4">
                      <input type="url" placeholder="Link YouTube" value={formData.videoUrl} onChange={e=>setFormData({...formData,videoUrl:e.target.value})} className="flex-1 p-3 bg-slate-50 rounded-xl outline-none"/>
                      <input type="file" accept="image/*,video/*" onChange={e=>setMediaFile(e.target.files[0])} className="p-3 bg-blue-50 text-xs rounded-xl"/>
                    </div>
                    <textarea rows="4" placeholder="Passo a Passo..." value={formData.instructions} onChange={e=>setFormData({...formData,instructions:e.target.value})} required className="w-full p-3 bg-slate-50 rounded-xl outline-none"></textarea>
                    <textarea rows="2" placeholder="Precauções..." value={formData.precautions} onChange={e=>setFormData({...formData,precautions:e.target.value})} className="w-full p-3 bg-amber-50 rounded-xl outline-none"></textarea>
                    <button type="submit" disabled={formStatus.loading} className="w-full bg-brand-red text-white font-black py-4 rounded-xl">{formStatus.loading?'Enviando...':'Enviar Exercício'}</button>
                  </form>}
                </div>
              )}

              {/* === APROVAÇÕES === */}
              {currentView === 'aprovacoes' && isAdmin && (
                <div className="max-w-3xl mx-auto space-y-4">
                  <h2 className="text-2xl font-black mb-6">Fila de Aprovação</h2>
                  {exercises.filter(ex=>ex.status==='pending').map(ex => (
                    <div key={ex.id} className="bg-white p-5 rounded-2xl shadow-sm border flex flex-col sm:flex-row justify-between items-center gap-4">
                      <div><p className="text-[10px] uppercase font-bold text-amber-500">Por: {ex.author}</p><h3 className="font-black text-lg">{ex.title}</h3></div>
                      <div className="flex gap-2"><button onClick={()=>{setSelectedExercise(ex);setCurrentView('detail');}} className="px-3 py-2 bg-slate-100 rounded-lg text-xs font-bold">Ver</button><button onClick={()=>handleApprove(ex.id)} className="px-3 py-2 bg-emerald-100 text-emerald-600 rounded-lg text-xs font-bold">Aprovar</button><button onClick={()=>handleReject(ex.id)} className="px-3 py-2 bg-rose-100 text-rose-600 rounded-lg text-xs font-bold">Recusar</button></div>
                    </div>
                  ))}
                  {pendingCount === 0 && <p className="text-center text-slate-400">Nenhum exercício pendente.</p>}
                </div>
              )}

              {/* === AULAS E RELATÓRIOS === */}
              {currentView === 'circuito' && (
                <div className="max-w-5xl mx-auto">
                  <div className="flex gap-2 p-1 bg-white rounded-full mb-6 w-max mx-auto shadow-sm border">
                    <button onClick={()=>setCircuitMode('agenda')} className={`px-5 py-2 rounded-full text-xs font-bold ${circuitMode==='agenda'?'bg-slate-800 text-white':''}`}>Agenda</button>
                    <button onClick={startPlanning} className={`px-5 py-2 rounded-full text-xs font-bold ${circuitMode==='plan'?'bg-emerald-500 text-white':''}`}>Planejar</button>
                    <button onClick={()=>setCircuitMode('history')} className={`px-5 py-2 rounded-full text-xs font-bold ${circuitMode==='history'||circuitMode==='view'||circuitMode==='report_edit'?'bg-brand-blue text-white':''}`}>Relatórios</button>
                  </div>

                  {circuitMode === 'agenda' && (
                    <div className="bg-white rounded-3xl shadow-sm p-6 overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50 uppercase text-[10px]"><tr><th className="p-4">Data</th><th className="p-4">Tema</th></tr></thead><tbody>{AGENDA_DATA.map((item,i)=><tr key={i} className="border-b"><td className="p-4 font-bold whitespace-nowrap">{item.date}</td><td className="p-4">{item.title}<br/><span className="text-[10px] text-slate-400">{item.resp}</span></td></tr>)}</tbody></table></div>
                  )}

                  {circuitMode === 'plan' && (
                    <div className="bg-white p-8 rounded-3xl shadow-sm space-y-6">
                      <h2 className="text-xl font-black border-b pb-4">Planejar Aula</h2>
                      <div className="grid grid-cols-3 gap-4"><input type="text" placeholder="Nº (Ex: 39)" value={planDetails.activityNum} onChange={e=>setPlanDetails({...planDetails,activityNum:e.target.value})} className="p-3 bg-slate-50 rounded-xl" /><input type="date" value={planDetails.date} onChange={e=>setPlanDetails({...planDetails,date:e.target.value})} className="p-3 bg-slate-50 rounded-xl" /><input type="text" placeholder="Tema" value={planDetails.theme} onChange={e=>setPlanDetails({...planDetails,theme:e.target.value})} className="p-3 bg-slate-50 rounded-xl" /></div>
                      <input type="text" placeholder="Responsáveis pela Aula" value={planDetails.students} onChange={e=>setPlanDetails({...planDetails,students:e.target.value})} className="w-full p-3 bg-slate-50 rounded-xl" />
                      
                      <div className="pt-6 border-t">
                        <textarea placeholder="Aquecimento Coletivo" value={planDetails.warmUp} onChange={e=>setPlanDetails({...planDetails,warmUp:e.target.value})} className="w-full p-3 bg-slate-50 rounded-xl mb-4"></textarea>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {circuit.map((st, i) => (
                            <div key={i} className="border rounded-xl p-4 bg-slate-50"><p className="font-black mb-2">Estação {i+1}</p><input placeholder="Responsável" value={planDetails.stationResponsibles[i]} onChange={e=>{let a=[...planDetails.stationResponsibles];a[i]=e.target.value;setPlanDetails({...planDetails,stationResponsibles:a})}} className="w-full p-2 text-xs mb-2 rounded border"/>
                              {st.map(ex=><div key={ex.id} className="flex justify-between text-xs bg-white p-2 border mb-1 rounded"><span>{ex.title}</span><button onClick={()=>removeFromCircuit(i,ex.id)} className="text-rose-500"><i className="fa-solid fa-x"></i></button></div>)}
                              <select onChange={e=>addToCircuit(i,e.target.value)} className="w-full p-2 text-xs bg-white border mt-2"><option value="">+ Exercício</option>{approvedExercises.map(e=><option key={e.id} value={e.id}>{e.title}</option>)}</select>
                            </div>
                          ))}
                        </div>
                        <textarea placeholder="Desaquecimento" value={planDetails.coolDown} onChange={e=>setPlanDetails({...planDetails,coolDown:e.target.value})} className="w-full p-3 bg-slate-50 rounded-xl mt-4"></textarea>
                      </div>
                      <button onClick={handleSavePlan} className="w-full bg-emerald-500 text-white font-black py-4 rounded-xl">Salvar Planejamento</button>
                    </div>
                  )}

                  {circuitMode === 'report_edit' && viewingCircuit && (
                    <div className="bg-white p-8 rounded-3xl shadow-sm space-y-6">
                      <h2 className="text-xl font-black border-b pb-4">Preencher Pós-Aula</h2>
                      
                      <div className="bg-slate-50 p-4 rounded-xl border">
                        <div className="flex justify-between items-center mb-4"><h3 className="font-bold">Sinais Vitais e Presença</h3><button onClick={handleAddParticipant} className="text-xs bg-brand-blue text-white px-3 py-1 rounded">Novo Idoso</button></div>
                        <div className="max-h-64 overflow-y-auto space-y-2 pr-2">
                          {planDetails.attendanceList.map((p, i) => (
                            <div key={p.id} className="p-3 bg-white border rounded-xl"><label className="flex items-center gap-2 font-bold"><input type="checkbox" checked={p.present} onChange={e=>updateAttendance(i,'present',e.target.checked)}/>{p.name}</label>
                              {p.present && <div className="mt-2 grid grid-cols-3 gap-2"><input placeholder="FC I/F" value={`${p.fc_in}/${p.fc_out}`} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'fc_in',v[0]||'');updateAttendance(i,'fc_out',v[1]||'');}} className="text-xs p-1 border text-center"/><input placeholder="SpO2 I/F" value={`${p.spo2_in}/${p.spo2_out}`} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'spo2_in',v[0]||'');updateAttendance(i,'spo2_out',v[1]||'');}} className="text-xs p-1 border text-center"/><input placeholder="PA I/F" value={`${p.pa_in}/${p.pa_out}`} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'pa_in',v[0]||'');updateAttendance(i,'pa_out',v[1]||'');}} className="text-xs p-1 border text-center"/></div>}
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4"><textarea placeholder="Objetivos..." value={planDetails.objectives} onChange={e=>setPlanDetails({...planDetails,objectives:e.target.value})} className="p-3 border rounded-xl"></textarea><textarea placeholder="Materiais..." value={planDetails.materials} onChange={e=>setPlanDetails({...planDetails,materials:e.target.value})} className="p-3 border rounded-xl"></textarea></div>
                      <div className="grid grid-cols-2 gap-4"><input placeholder="Resp. Sinais Vitais" value={planDetails.vitalSigns} onChange={e=>setPlanDetails({...planDetails,vitalSigns:e.target.value})} className="p-3 border rounded-xl" /><input placeholder="Resp. Som/Fotos" value={planDetails.soundAndPhotos} onChange={e=>setPlanDetails({...planDetails,soundAndPhotos:e.target.value})} className="p-3 border rounded-xl" /></div>
                      <textarea rows="4" placeholder="Relato Narrativo..." value={planDetails.developmentNarrative} onChange={e=>setPlanDetails({...planDetails,developmentNarrative:e.target.value})} className="w-full p-3 border rounded-xl"></textarea>
                      <textarea rows="3" placeholder="Evolução Clínica / Intercorrências..." value={planDetails.dailyEvolution} onChange={e=>setPlanDetails({...planDetails,dailyEvolution:e.target.value})} className="w-full p-3 border rounded-xl bg-amber-50"></textarea>
                      
                      <div className="flex gap-4"><button onClick={()=>setCircuitMode('view')} className="px-6 py-3 border font-bold rounded-xl">Cancelar</button><button onClick={handleUpdateReport} className="flex-1 bg-brand-blue text-white font-black rounded-xl">Salvar e Gerar Relatório</button></div>
                    </div>
                  )}

                  {circuitMode === 'history' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {savedCircuits.map(c => (
                        <div key={c.id} className="bg-white p-6 rounded-2xl border shadow-sm cursor-pointer" onClick={()=>{setViewingCircuit(c);setCircuitMode('view');}}>
                          <span className="text-[10px] font-black bg-slate-100 px-2 py-1 rounded-full">{c.activity_date}</span>
                          <h3 className="font-black mt-2">Ativ. {c.details?.activityNum}</h3><p className="text-xs text-slate-500 truncate">{c.details?.theme}</p>
                        </div>
                      ))}
                    </div>
                  )}

                  {circuitMode === 'view' && viewingCircuit && (
                    <div className="bg-white p-8 rounded-3xl shadow-sm space-y-4">
                      <div className="flex gap-2"><button onClick={()=>setCircuitMode('history')} className="px-4 py-2 border rounded-xl text-sm font-bold">Voltar</button><button onClick={startEditingReport} className="px-4 py-2 bg-emerald-50 text-emerald-600 rounded-xl text-sm font-bold">Preencher</button><button onClick={()=>handleGeneratePDF(viewingCircuit)} className="px-4 py-2 bg-brand-blue text-white rounded-xl text-sm font-bold">PDF</button>{isAdmin && <button onClick={()=>handleDeleteCircuit(viewingCircuit.id)} className="px-4 py-2 text-rose-500 font-bold ml-auto"><i className="fa-solid fa-trash"></i></button>}</div>
                      <div className="border-t pt-4">
                        <h2 className="font-black text-xl text-center">Atividade {viewingCircuit.details?.activityNum}</h2>
                        <p className="text-center text-sm">{viewingCircuit.details?.theme}</p>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-slate-200 border-t-brand-blue rounded-full animate-spin"></div></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} updateSessionData={setSession} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
