<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATIVIDOSO - Plataforma Integrada</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#202b5c',
              dark: '#161e42',
              red: '#e63946',
              redDark: '#c52833'
            }
          }
        }
      }

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .hover-lift { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    .bg-pattern { background-color: #f8fafc; background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 24px 24px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-red selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Configuração Supabase
    const SUPABASE_URL = "https://rewkwzxuogdopzkqliwi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld2t3enh1b2dkb3B6a3FsaXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAwMDAwMDAsImV4cCI6MjA2NTc2MDAwMH0.exemplo"; // Substitua pela sua anon key real se necessário
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DADOS FIXOS DA AGENDA SEMESTRAL 2026.2
    const AGENDA_DATA = [
      { act: "01", date: "14/08/2026", title: "Apresentação da disciplina e Alinhamento", resp: "Todos" },
      { act: "02", date: "21/08/2026", title: "Avaliação Funcional e Cognitiva Inicial", resp: "E1" },
      { act: "03", date: "28/08/2026", title: "Mobilidade e fortalecimento muscular de MMII", resp: "E2" },
      { act: "04", date: "04/09/2026", title: "Exercícios de dupla tarefa (motora e cognitiva)", resp: "E3" },
      { act: "05", date: "11/09/2026", title: "Treino de equilíbrio estático e dinâmico", resp: "E4" },
      { act: "06", date: "18/09/2026", title: "Prevenção de quedas e agilidade", resp: "E1" },
      { act: "07", date: "25/09/2026", title: "Condicionamento aeróbico leve", resp: "E2" },
      { act: "08", date: "02/10/2026", title: "Fortalecimento de MMSS e tronco", resp: "E3" },
      { act: "09", date: "09/10/2026", title: "Circuito funcional adaptado para idosos", resp: "E4" },
      { act: "10", date: "16/10/2026", title: "Atividade lúdica e gincana cognitiva", resp: "E1" },
      { act: "11", date: "23/10/2026", title: "Flexibilidade e amplitude de movimento", resp: "E2" },
      { act: "12", date: "30/10/2026", title: "Treino de marcha e transições posturais", resp: "E3" },
      { act: "13", date: "06/11/2026", title: "Fortalecimento global em circuito", resp: "E4" },
      { act: "14", date: "13/11/2026", title: "Reavaliação funcional e cognitiva", resp: "E1" },
      { act: "15", date: "20/11/2026", title: "Vivência prática e integração final", resp: "E2" },
      { act: "16", date: "27/11/2026", title: "Encerramento e entrega de relatórios", resp: "Todos" }
    ];

    const CATEGORIES = {
      mmss: { title: "Membros Superiores", shortTitle: "MMSS", icon: "fa-hand-fist", color: "text-blue-600", bg: "bg-blue-50", border: "border-blue-100", subgroups: ["Todos", "Ombro", "Cotovelo / Punho", "Mãos / Destreza"] },
      mmii: { title: "Membros Inferiores", shortTitle: "MMII", icon: "fa-shoe-prints", color: "text-emerald-600", bg: "bg-emerald-50", border: "border-emerald-100", subgroups: ["Todos", "Quadril", "Joelho", "Tornozelo / Pé"] },
      core: { title: "Core e Tronco", shortTitle: "Core", icon: "fa-child-reaching", color: "text-amber-600", bg: "bg-amber-50", border: "border-amber-100", subgroups: ["Todos", "Abdômen", "Lombar", "Postura"] },
      aerobic: { title: "Aeróbico e Marcha", shortTitle: "Aeróbico", icon: "fa-heart-pulse", color: "text-rose-600", bg: "bg-rose-50", border: "border-rose-100", subgroups: ["Todos", "Marcha", "Resistência", "Agilidade"] },
      dual: { title: "Dupla Tarefa", shortTitle: "Dupla Tarefa", icon: "fa-brain", color: "text-purple-600", bg: "bg-purple-50", border: "border-purple-100", subgroups: ["Todos", "Cognitiva + Motora", "Equilíbrio + Fala"] }
    };

    const DEFAULT_PARTICIPANTS = [
      { id: "1", name: "Dona Maria Conceição" },
      { id: "2", name: "Seu José Antonio" },
      { id: "3", name: "Dona Raimunda Nonata" },
      { id: "4", name: "Seu Francisco das Chagas" }
    ];

    // ==========================================
    // TELA DE LOGIN / CADASTRO
    // ==========================================
    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [teamGroup, setTeamGroup] = useState('E1');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        if (isLogin) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            setError('E-mail ou senha incorretos.');
            setLoading(false);
          } else if (data.session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.session.user.id).single();
            onLogin({ ...data.session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) {
            setError(error.message);
            setLoading(false);
          } else if (data.user) {
            await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name: fullName, role: 'Monitor', team_group: teamGroup }]);
            onLogin({ ...data.user, full_name: fullName, role: 'Monitor', team_group: teamGroup });
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-pattern p-6">
          <div className="bg-white w-full max-w-md p-8 sm:p-10 rounded-[2.5rem] shadow-xl border border-slate-100 animate-fade-in">
            <div className="text-center mb-8">
              <span className="text-3xl font-black text-brand-blue tracking-tight">ATIV<span className="text-brand-red">IDOSO</span></span>
              <p className="text-xs font-extrabold text-slate-400 uppercase tracking-widest mt-2">{isLogin ? 'Acesso à Plataforma' : 'Cadastro de Novo Monitor'}</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <>
                  <div>
                    <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Nome Completo</label>
                    <input type="text" value={fullName} onChange={e=>setFullName(e.target.value)} required className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm font-semibold" placeholder="Seu nome" />
                  </div>
                  <div>
                    <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Grupo da Quadra</label>
                    <select value={teamGroup} onChange={e=>setTeamGroup(e.target.value)} className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm font-bold text-emerald-700">
                      <option value="E1">Grupo E1</option><option value="E2">Grupo E2</option><option value="E3">Grupo E3</option><option value="E4">Grupo E4</option>
                    </select>
                  </div>
                </>
              )}
              <div>
                <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">E-mail</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm font-semibold" placeholder="seu.email@faculdade.com" />
              </div>
              <div>
                <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Senha</label>
                <div className="relative">
                  <input type={showPassword ? "text" : "password"} value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full pl-5 pr-12 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm font-semibold" placeholder="••••••••" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 p-1 hover:text-brand-blue"><i className={showPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye"}></i></button>
                </div>
              </div>
              {error && <div className="bg-rose-50 text-rose-600 p-4 rounded-2xl text-xs font-bold border border-rose-100 flex items-center gap-2"><i className="fa-solid fa-circle-exclamation text-lg"></i> {error}</div>}
              <button type="submit" disabled={loading} className="w-full bg-brand-red hover:bg-brand-redDark text-white font-black py-4 rounded-2xl transition-all shadow-md mt-4 text-base">
                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isLogin ? 'Entrar no Aplicativo' : 'Criar Conta')}
              </button>
            </form>
            <div className="mt-8 text-center border-t border-slate-100 pt-6">
              <button onClick={() => {setIsLogin(!isLogin); setError('');}} className="text-sm font-bold text-slate-500 hover:text-brand-blue">
                {isLogin ? "Primeira vez na equipe? Cadastre-se." : "Já é da equipe? Clique para Entrar."}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // PLATAFORMA / DASHBOARD
    // ==========================================
    const Dashboard = ({ session, onLogout, updateSessionData }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      const [selectedExercise, setSelectedExercise] = useState(null);
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [participantsList, setParticipantsList] = useState(DEFAULT_PARTICIPANTS);

      // Cadastro Exercicio
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false });

      // Circuitos / Aula
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);
      const [planDetails, setPlanDetails] = useState({ 
        activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], 
        proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', 
        developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] 
      });

      // Perfil & Avisos
      const [newAnnouncement, setNewAnnouncement] = useState({ title: '', content: '', link_url: '' });
      const [profileForm, setProfileForm] = useState({ full_name: session.full_name, team_group: session.team_group || '' });
      const [profileAvatarFile, setProfileAvatarFile] = useState(null);
      const [profileStatus, setProfileStatus] = useState('');

      // Busca inicial
      useEffect(() => {
        const fetchAll = async () => {
          const [{data:ex}, {data:ci}, {data:an}, {data:pa}] = await Promise.all([
            supabaseClient.from('exercises').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('circuits').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('announcements').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('participants').select('*').order('name', { ascending: true })
          ]);
          if(ex) setExercises(ex); 
          if(ci) setSavedCircuits(ci); 
          if(an) setAnnouncements(an); 
          if(pa && pa.length > 0) setParticipantsList(pa);
        };
        fetchAll();
      }, [currentView, circuitMode]);

      // Alerta da Agenda (Cálculo de Data Blindado contra Fuso Horário)
      const upcomingActivity = useMemo(() => {
        if(!session.team_group || session.team_group === 'Nenhum') return null;
        
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        const mesAtual = hoje.getMonth() + 1;
        const diaAtual = hoje.getDate();
        
        const numeroHoje = parseInt(`${anoAtual}${String(mesAtual).padStart(2, '0')}${String(diaAtual).padStart(2, '0')}`);
        let atividadeDestaSemana = null;
        
        for (let item of AGENDA_DATA) {
          const [d, m, y] = item.date.split('/'); 
          const numeroAtividade = parseInt(`${y}${m}${d}`);
          
          if (numeroAtividade >= numeroHoje) {
            atividadeDestaSemana = item;
            break; 
          }
        }

        if (!atividadeDestaSemana) return null;

        const grupoUsuario = session.team_group.toLowerCase();
        const responsaveis = atividadeDestaSemana.resp.toLowerCase();

        if (responsaveis.includes(grupoUsuario) || responsaveis.includes('todos')) {
          return atividadeDestaSemana; 
        }
        
        return null; 
      }, [session.team_group]);

      const approvedExercises = exercises.filter(ex => ex.status === 'approved');
      const filteredExercises = approvedExercises.filter(ex => 
        (filterCat === 'all' || ex.category === filterCat) && 
        (filterSub === 'Todos' || ex.muscleGroup === filterSub) && 
        (ex.title.toLowerCase().includes(searchQuery.toLowerCase()))
      );
      const pendingCount = exercises.filter(ex => ex.status === 'pending').length;

      const getYouTubeId = (url) => {
        if (!url) return null;
        const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
        return match ? match[1] : null;
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault(); 
        setProfileStatus('Salvando...');
        let newAvatarUrl = session.avatar_url;
        
        if (profileAvatarFile) {
          const fileName = `avatar_${session.id}_${Date.now()}.${profileAvatarFile.name.split('.').pop()}`;
          const { error } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, profileAvatarFile);
          if (!error) {
            newAvatarUrl = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName).data.publicUrl;
          }
        }
        
        const { error } = await supabaseClient.from('profiles').update({ 
          full_name: profileForm.full_name, 
          team_group: profileForm.team_group, 
          avatar_url: newAvatarUrl 
        }).eq('id', session.id);
        
        if(!error) { 
          setProfileStatus('Salvo com sucesso!'); 
          updateSessionData({ ...session, full_name: profileForm.full_name, team_group: profileForm.team_group, avatar_url: newAvatarUrl }); 
        } else {
          setProfileStatus('Erro ao salvar.');
        }
      };

      const handlePostAnnouncement = async (e) => {
        e.preventDefault();
        const { data } = await supabaseClient.from('announcements').insert([{
          title: newAnnouncement.title, 
          content: newAnnouncement.content, 
          link_url: newAnnouncement.link_url,
          author: session.full_name 
        }]).select();
        
        if(data) { 
          setAnnouncements([data[0], ...announcements]); 
          setNewAnnouncement({ title: '', content: '', link_url: '' }); 
        }
      };
      
      const handleDeleteAnnouncement = async (id) => { 
        if(window.confirm("Apagar este aviso permanentemente?")) { 
          await supabaseClient.from('announcements').delete().eq('id', id); 
          setAnnouncements(announcements.filter(a => a.id !== id)); 
        } 
      };

      const handleSendEmail = () => {
         const subject = "ATIVIDOSO - Lembrete de Planejamento da Aula";
         const body = `Olá Monitor(a),\n\nLembramos que o seu grupo está responsável por realizar a próxima atividade na quadra.\n\nPor favor, acesse a plataforma ATIVIDOSO para realizar o planejamento prévio e enviar a aula na aba 'Aulas e Relatórios'.\n\nAtenciosamente,\nCoordenação ATIVIDOSO`;
         const emailLink = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
         window.open(emailLink, '_blank');
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault(); 
        setFormStatus({ loading: true, success: false });
        let url = null;
        
        if (mediaFile) {
          const fName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${mediaFile.name.split('.').pop()}`;
          await supabaseClient.storage.from('midia_exercicios').upload(fName, mediaFile);
          url = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fName).data.publicUrl;
        }
        
        const ex = { 
          title: formData.title, 
          category: formCat, 
          "muscleGroup": formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect, 
          difficulty: formData.difficulty, 
          equipment: formData.equipment, 
          dosage: formData.dosage, 
          "videoUrl": formData.videoUrl, 
          "mediaUrl": url, 
          instructions: formData.instructions, 
          precautions: formData.precautions, 
          status: 'pending', 
          author: session.full_name 
        };
        
        const { error } = await supabaseClient.from('exercises').insert([ex]);
        
        if (!error) { 
          setFormStatus({ loading: false, success: true }); 
          setFormData({ title:'', difficulty:'Iniciante / Leve', equipment:'Nenhum', dosage:'', videoUrl:'', instructions:'', precautions:'' }); 
          setFormCat(''); 
          setFormMuscleSelect(''); 
          setMediaFile(null); 
        } else {
          setFormStatus({ loading: false, success: false });
          alert("Erro ao enviar: " + error.message);
        }
      };

      const handleAddParticipant = async () => {
        const name = prompt('Digite o nome completo do idoso:');
        if(name) {
          const { data, error } = await supabaseClient.from('participants').insert([{ name }]).select();
          if(!error && data) {
            setParticipantsList([...participantsList, data[0]].sort((a,b)=>a.name.localeCompare(b.name)));
            if (circuitMode === 'report_edit') {
               const newP = { id: data[0].id, name: data[0].name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' };
               setPlanDetails({...planDetails, attendanceList: [...planDetails.attendanceList, newP].sort((a,b)=>a.name.localeCompare(b.name))});
            }
          }
        }
      };

      const updateAttendance = (idx, field, val) => {
         const list = [...planDetails.attendanceList]; 
         list[idx][field] = val;
         setPlanDetails({
           ...planDetails, 
           attendanceList: list, 
           attendanceCount: field === 'present' ? list.filter(p=>p.present).length.toString() : planDetails.attendanceCount
         });
      };

      const startPlanning = () => { 
        setPlanDetails({ activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['','','','',''], proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] }); 
        setCircuit([[],[],[],[],[]]); 
        setCircuitMode('plan'); 
      };

      const startEditingReport = () => { 
        let list = viewingCircuit.details.attendanceList || [];
        if (list.length === 0) {
          list = participantsList.map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
        } else { 
          const ids = list.map(c=>c.id); 
          const newParts = participantsList.filter(p=>!ids.includes(p.id)).map(p=>({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
          list = [...list, ...newParts].sort((a,b)=>a.name.localeCompare(b.name)); 
        }
        setPlanDetails({ ...viewingCircuit.details, attendanceList: list }); 
        setCircuitMode('report_edit'); 
      };

      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Por favor, preencha o Número, Tema e Data!');
        const { data, error } = await supabaseClient.from('circuits').insert([{ activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name }]).select();
        if (!error) { 
          alert('Planejamento Salvo com Sucesso!'); 
          setSavedCircuits([data[0], ...savedCircuits]); 
          setCircuitMode('history'); 
        } else {
          alert('Erro ao salvar: ' + error.message);
        }
      };

      const handleUpdateReport = async () => {
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (!error) { 
          alert('Relatório Clínico Salvo!'); 
          setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? { ...c, details: planDetails } : c)); 
          setViewingCircuit({ ...viewingCircuit, details: planDetails }); 
          setCircuitMode('view'); 
        } else {
          alert('Erro ao atualizar: ' + error.message);
        }
      };

      const handleDeleteCircuit = async (id) => { 
        if(window.confirm("Apagar permanentemente este relatório do sistema?")) { 
          await supabaseClient.from('circuits').delete().eq('id', id); 
          setSavedCircuits(savedCircuits.filter(c => c.id !== id)); 
          setCircuitMode('history'); 
        } 
      };

      const addToCircuit = (stationIndex, exerciseId) => { 
        if (!exerciseId) return; 
        const exercise = approvedExercises.find(ex => ex.id === exerciseId); 
        if (!exercise) return; 
        const newCircuit = [...circuit]; 
        if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) { 
          newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise]; 
          setCircuit(newCircuit); 
        } 
      };

      const removeFromCircuit = (stationIndex, exerciseId) => { 
        const newCircuit = [...circuit]; 
        newCircuit[stationIndex] = newCircuit[stationIndex].filter(ex => ex.id !== exerciseId); 
        setCircuit(newCircuit); 
      };

      const handleGeneratePDF = (circuitData) => {
        const d = circuitData.details;
        let stHtml = ''; 
        circuitData.stations.forEach((st, i) => { 
          stHtml += `<div style="margin-bottom:10px;"><strong>Estação ${i+1}</strong> (Resp: ${d.stationResponsibles?.[i]||'-'}): ${st.length===0?'Sem ex.':st.map(e=>e.title).join(', ')}</div>`; 
        });
        
        let vitHtml = ''; 
        if(d.attendanceList && d.attendanceList.some(p=>p.present)) {
          vitHtml = `<br><p><strong>QUADRO CLÍNICO E FREQUÊNCIA NOMINAL:</strong></p><table style="width:100%;border-collapse:collapse;font-size:11px;margin:10px 0;text-align:center;"><tr style="background:#f1f5f9;border-bottom:2px solid #cbd5e1;"><th style="padding:6px;text-align:left;">NOME DO PACIENTE</th><th>FC (I/F)</th><th>SpO2 (I/F)</th><th>PA (I/F)</th></tr>` + 
          d.attendanceList.filter(p=>p.present).map(p=>`<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:6px;text-align:left;font-weight:bold;">${p.name}</td><td>${p.fc_in||'-'} / ${p.fc_out||'-'}</td><td>${p.spo2_in||'-'} / ${p.spo2_out||'-'}</td><td>${p.pa_in||'-'} / ${p.pa_out||'-'}</td></tr>`).join('') + 
          `</table>`;
        }
        
        const element = document.createElement('div');
        element.innerHTML = `
          <div style="font-family:Arial; font-size:14px; color:#333; line-height:1.5; padding:30px;">
            <div style="text-align:center; margin-bottom:30px;">
              <h2 style="margin:0; font-size:18px; color:#161E42; text-transform:uppercase;">ATIVIDADE ${d.activityNum||'X'} – ${d.theme||'-'}</h2>
            </div>
            <p><strong>DATA:</strong> ${circuitData.activity_date.split('-').reverse().join('/')}</p>
            <p><strong>DISCENTES RESPONSÁVEIS:</strong> ${d.students||'-'}</p><br>
            <p><strong>OBJETIVOS:</strong> ${d.objectives||'-'}</p>
            <p><strong>ATIVIDADES PROPOSTAS:</strong> ${d.proposedActivities||'-'}</p>
            <p><strong>MATERIAIS:</strong> ${d.materials||'-'}</p>
            <br>
            <p><strong>AQUECIMENTO:</strong> ${d.warmUp||'-'}</p>
            ${stHtml}
            <p><strong>DESAQUECIMENTO:</strong> ${d.coolDown||'-'}</p>
            ${vitHtml}<br>
            <p><strong>RELATO NARRATIVO:</strong><br/>${d.developmentNarrative||'-'}</p><br>
            <p><strong>EVOLUÇÃO CLÍNICA:</strong><br/>${d.dailyEvolution||'Sem anotações.'}</p><br>
            <p><strong>TOTAL DE PRESENTES:</strong> ${d.attendanceCount||'-'}</p>
          </div>
        `;
        html2pdf().set({ margin: 0.4, filename: `Relatorio_ATIV_${d.activityNum||'00'}.pdf`, html2canvas: { scale: 2 } }).from(element).save();
      };

      const handleNavClick = (view, mode = null) => {
        setCurrentView(view);
        if(mode) setCircuitMode(mode);
        setIsMobileMenuOpen(false);
      };

      const NavBtn = ({v, icon, text}) => (
        <button onClick={() => handleNavClick(v)} className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold w-full transition-all ${currentView === v ? 'bg-brand-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 hover:text-brand-blue'}`}>
          <i className={`fa-solid ${icon} w-5 text-center text-lg`}></i> {text}
        </button>
      );

      return (
        <div className="min-h-screen flex bg-slate-50 relative">
          {isMobileMenuOpen && <div className="fixed inset-0 bg-black/40 z-40 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}></div>}
          
          <aside className={`w-72 bg-white flex flex-col h-screen fixed md:relative z-50 transition-transform duration-300 border-r border-slate-200 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden absolute top-6 right-6 text-slate-400 hover:text-brand-red bg-slate-50 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>

            <div className="p-8 flex flex-col items-center justify-center gap-2 mt-4">
              <span className="text-2xl font-black text-brand-blue">ATIV<span className="text-brand-red">IDOSO</span></span>
            </div>
            
            <div className="px-6 pb-6 mb-2 border-b border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition p-2 rounded-2xl mx-4" onClick={() => handleNavClick('perfil')}>
              <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-brand-red to-orange-400 flex items-center justify-center text-white font-black text-xl shadow-md uppercase shrink-0 ring-4 ring-red-50">{session.full_name.charAt(0)}</div>
              <div className="overflow-hidden">
                <p className="text-sm font-extrabold text-slate-800 leading-tight truncate">{session.full_name}</p>
                <div className="flex gap-1 mt-1">
                  <span className="text-[9px] text-brand-blue font-bold uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded-full">{session.role}</span>
                  {session.team_group && session.team_group !== 'Nenhum' && <span className="text-[9px] text-emerald-600 font-bold uppercase tracking-widest bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100"><i className="fa-solid fa-users"></i> {session.team_group}</span>}
                </div>
              </div>
            </div>

            <nav className="flex-1 px-4 py-4 flex flex-col gap-1.5 overflow-y-auto">
              <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 pl-3">Meu Espaço</p>
              <NavBtn v="home" icon="fa-house-chimney-medical" text="Início & Mural" />
              <NavBtn v="perfil" icon="fa-user-astronaut" text="Meu Perfil" />
              
              <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 mt-6 pl-3">Atividades e Saúde</p>
              <NavBtn v="library" icon="fa-dumbbell" text="Acervo de Exercícios" />
              <NavBtn v="circuito" icon="fa-clipboard-list" text="Aulas e Diário Clínico" />
              
              <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 mt-6 pl-3">Gestão</p>
              <button onClick={() => { handleNavClick('cadastro'); setFormStatus({loading: false, success: false}); }} className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold w-full transition-all ${currentView === 'cadastro' ? 'bg-brand-red text-white shadow-md' : 'text-slate-600 hover:bg-rose-50 hover:text-brand-red'}`}><i className="fa-solid fa-circle-plus w-5 text-center text-lg"></i> Criar Exercício</button>
            </nav>
            <div className="p-6 border-t border-slate-100"><button onClick={onLogout} className="flex items-center justify-center gap-2 px-4 py-3 rounded-2xl text-sm font-bold text-slate-500 hover:bg-rose-50 hover:text-rose-600 w-full"><i className="fa-solid fa-arrow-right-from-bracket text-lg"></i> Sair do App</button></div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden w-full bg-slate-50/50 relative">
            <header className="h-20 bg-white border-b border-slate-100 px-6 sm:px-8 flex items-center justify-between shrink-0 z-10 pt-4">
              <div className="flex items-center gap-4">
                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden w-10 h-10 bg-white rounded-full shadow-sm border border-slate-200 text-slate-600 flex items-center justify-center"><i className="fa-solid fa-bars"></i></button>
                <h2 className="font-black text-slate-800 text-xl sm:text-2xl tracking-tight">
                  {currentView === 'home' && "Início e Mural"}
                  {currentView === 'perfil' && "Meu Perfil"}
                  {currentView === 'library' && "Biblioteca Clínica"}
                  {currentView === 'cadastro' && "Novo Conteúdo"}
                  {currentView === 'circuito' && "Aulas e Diário"}
                </h2>
              </div>
            </header>
            
            <div className="flex-1 overflow-y-auto p-4 sm:p-8 pt-6">
              {currentView === 'perfil' && (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div className="bg-white p-8 sm:p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <h2 className="text-2xl font-black text-slate-800 mb-8 border-b border-slate-100 pb-4">Configurações do Perfil</h2>
                    {profileStatus && <div className="mb-6 p-4 bg-emerald-50 text-emerald-600 rounded-xl text-sm font-bold text-center">{profileStatus}</div>}
                    <form onSubmit={handleSaveProfile} className="space-y-6">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Nome</label><input type="text" value={profileForm.full_name} onChange={e=>setProfileForm({...profileForm, full_name: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 font-semibold" required /></div>
                        <div>
                          <label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Seu Grupo</label>
                          <select value={profileForm.team_group} onChange={e=>setProfileForm({...profileForm, team_group: e.target.value})} className="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 font-bold text-emerald-700">
                            <option value="">Selecione...</option><option value="Nenhum">Nenhum</option>
                            <option value="E1">Grupo E1</option><option value="E2">Grupo E2</option><option value="E3">Grupo E3</option><option value="E4">Grupo E4</option>
                          </select>
                        </div>
                      </div>
                      <button type="submit" className="px-8 py-3.5 bg-brand-blue text-white font-black rounded-2xl shadow-md">Salvar Perfil</button>
                    </form>
                  </div>
                </div>
              )}

              {currentView === 'home' && (
                <div className="max-w-6xl mx-auto space-y-8">
                  {upcomingActivity && (
                    <div className="bg-emerald-500 p-6 sm:p-8 rounded-[2rem] text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-6">
                      <div>
                        <h2 className="text-xl sm:text-2xl font-black mb-1">Atenção, {session.team_group}! É a vez de vocês!</h2>
                        <p className="text-emerald-50 font-semibold mb-3">A agenda indica que o seu grupo está responsável pela próxima aula na quadra.</p>
                        <p className="font-bold bg-white/10 p-3 rounded-xl inline-block">{upcomingActivity.date} — {upcomingActivity.title}</p>
                      </div>
                      <button onClick={() => handleNavClick('circuito', 'plan')} className="px-6 py-3 bg-white text-emerald-600 font-black rounded-xl shadow-sm">Planejar Aula</button>
                    </div>
                  )}
                  <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center py-12">
                    <h3 className="text-xl font-black text-slate-700">Bem-vindo ao ATIVIDOSO!</h3>
                    <p className="text-sm text-slate-400 mt-2">Navegue pelas abas ao lado para gerenciar o acervo e relatórios clínicos.</p>
                  </div>
                </div>
              )}

              {currentView === 'circuito' && (
                <div className="max-w-5xl mx-auto space-y-6">
                  <div className="flex gap-2 p-2 bg-white rounded-full shadow-sm border border-slate-200 w-max">
                    <button onClick={() => setCircuitMode('agenda')} className={`px-6 py-3 rounded-full text-xs font-extrabold ${circuitMode === 'agenda' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}>Cronograma</button>
                    <button onClick={startPlanning} className={`px-6 py-3 rounded-full text-xs font-extrabold ${circuitMode === 'plan' ? 'bg-emerald-500 text-white' : 'text-slate-500'}`}>Planejar Aula</button>
                  </div>
                  {circuitMode === 'agenda' && (
                    <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                      <table className="w-full text-sm text-left">
                        <thead className="bg-slate-50 text-slate-400 font-extrabold uppercase text-[10px]">
                          <tr><th className="px-6 py-5">Ativ.</th><th className="px-6 py-5">Data</th><th className="px-6 py-5">Tema & Responsáveis</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                          {AGENDA_DATA.map((item, idx) => (
                            <tr key={idx} className={item === upcomingActivity ? 'bg-emerald-50/50' : ''}>
                              <td className="px-6 py-5 font-black text-slate-800">{item.act}</td>
                              <td className="px-6 py-5 font-black text-emerald-600">{item.date}</td>
                              <td className="px-6 py-5"><p className="font-bold text-slate-700">{item.title}</p><span className="text-xs bg-slate-100 px-3 py-1 rounded-lg font-bold">{item.resp}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let reg of registrations) { reg.unregister(); }
          });
        }
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><p className="text-brand-blue font-black uppercase text-xs">Carregando...</p></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={() => { supabaseClient.auth.signOut(); setSession(null); }} updateSessionData={setSession} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
