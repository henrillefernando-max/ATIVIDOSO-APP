  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://rewkwzxuogdopzkqliwi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld2t3enh1b2dkb3B6a3FsaXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDc3MjYsImV4cCI6MjEwMzI4MzcyNn0.ZW_KB3wl21aB00zCcyEqBQbOOFpGdOoxuctwU-6ICFM";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = {
      'mmss': { title: 'Mobilidade e fortalecimento de MMSS', shortTitle: 'MMSS e Tronco', icon: 'fa-child-reaching', color: 'text-sky-500', bg: 'bg-sky-50', border: 'border-sky-200', subgroups: ['Todos', 'Bíceps', 'Tríceps', 'Peito', 'Costas', 'Abdômen', 'Ombro', 'Punho', 'Outro'] },
      'mmii': { title: 'Mobilidade e fortalecimento de MMII', shortTitle: 'Membros Inferiores', icon: 'fa-person-walking', color: 'text-emerald-500', bg: 'bg-emerald-50', border: 'border-emerald-200', subgroups: ['Todos', 'Quadríceps', 'Glúteos', 'Isquiotibiais', 'Panturrilhas', 'Tornozelo e Pé', 'Outro'] },
      'cardio': { title: 'Aeróbicos e condicionamento cardiorrespiratório', shortTitle: 'Aeróbicos e Cardio', icon: 'fa-heart-pulse', color: 'text-rose-500', bg: 'bg-rose-50', border: 'border-rose-200', subgroups: ['Todos', 'Caminhada', 'Marcha', 'Circuitos', 'Resistência Contínua', 'Outro'] },
      'dupla_tarefa': { title: 'Dupla tarefa (motora e cognitiva)', shortTitle: 'Dupla Tarefa', icon: 'fa-brain', color: 'text-violet-500', bg: 'bg-violet-50', border: 'border-violet-200', subgroups: ['Todos', 'Motora', 'Cognitiva', 'Motora + Cognitiva', 'Controle Postural', 'Equilíbrio', 'Coordenação', 'Atenção Dividida', 'Outro'] }
    };

    const AGENDA_DATA = [
      { act: 17, date: "14/08/2026", title: "RETORNO DAS ATIVIDADES: Gincana/ dinâmica", resp: "Todos os integrantes do projeto" },
      { act: 18, date: "21/08/2026", title: "Mobilidade e fortalecimento muscular de MMSS", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 19, date: "28/08/2026", title: "Mobilidade e fortalecimento muscular de MMII", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 20, date: "04/09/2026", title: "Exercícios aeróbicos e condicionamento", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 21, date: "11/09/2026", title: "Exercícios de dupla tarefa (motora e cognitiva)", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 22, date: "18/09/2026", title: "Mobilidade e fortalecimento muscular de MMSS", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 23, date: "25/09/2026", title: "Mobilidade e fortalecimento muscular de MMII", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 24, date: "02/10/2026", title: "Exercícios aeróbicos e condicionamento", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 25, date: "09/10/2026", title: "Mobilidade e fortalecimento muscular de MMII", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 26, date: "16/10/2026", title: "Atividade educativa em saúde e promoção do autocuidado", resp: "Todos" },
      { act: 27, date: "23/10/2026", title: "Exercícios aeróbicos e condicionamento", resp: "E1: Emyle, Vitória E., Vitória A., Gustavo" },
      { act: 28, date: "30/10/2026", title: "Exercícios de dupla tarefa (motora e cognitiva)", resp: "E2: Henrille, Clara, Lívia, Raíssa" },
      { act: 29, date: "06/11/2026", title: "Mobilidade e fortalecimento muscular de MMSS", resp: "E4: Letícia R., Nyslanny, Danyllo" },
      { act: 30, date: "13/11/2026", title: "Mobilidade e fortalecimento muscular de MMII", resp: "E3: Sarah, Ellen, Maria Clara, Davi" },
      { act: 31, date: "27/11/2026", title: "Avaliação participativa dos participantes", resp: "Todos" },
      { act: 32, date: "04/12/2026", title: "Atividade temática de integração/confraternização", resp: "Todos" }
    ];

    // LOGIN PAGE
    const LoginPage = ({ onLogin }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        if (isLogin) {
          const { data, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (authError) { setError("E-mail ou senha incorretos."); setLoading(false); return; }
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
          onLogin({ id: data.user.id, email: data.user.email, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
        } else {
          const { data, error: signUpError } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
          if (signUpError) { setError(signUpError.message); } 
          else {
            if (data.user) {
              await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name: name, role: 'Monitor' }]);
              alert("Conta criada! Faça login."); setIsLogin(true); setPassword('');
            }
          }
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden bg-pattern">
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-red/10 blob-shape blur-3xl"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-[30rem] h-[30rem] bg-brand-blue/10 blob-shape-2 blur-3xl"></div>
          
          <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-100 relative z-10 overflow-hidden">
            <div className="bg-gradient-to-br from-brand-blue to-brand-dark p-10 text-center relative">
              <img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo ATIVIDOSO" className="h-16 mx-auto mb-4 object-contain drop-shadow-lg" onError={(e) => { e.target.style.display = 'none'; }} />
              <h2 className="text-2xl font-black text-white relative z-10 tracking-tight">Bem-vindo(a)</h2>
              <p className="text-brand-light/80 text-xs font-bold uppercase tracking-widest mt-1">{isLogin ? 'App do Projeto' : 'Nova Conta'}</p>
            </div>
            
            <div className="p-8 sm:p-10">
              <form onSubmit={handleSubmit} className="space-y-5">
                {!isLogin && ( <div><label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Seu Nome</label><input type="text" value={name} onChange={e=>setName(e.target.value)} required className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-semibold" /></div> )}
                <div><label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Seu E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-semibold" /></div>
                <div><label className="block text-xs font-extrabold text-slate-500 uppercase mb-2 pl-2">Senha</label>
                  <div className="relative">
                    <input type={showPassword ? "text" : "password"} value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" className="w-full pl-5 pr-12 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm transition-all font-semibold" />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 p-1"><i className={showPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye"}></i></button>
                  </div>
                </div>
                {error && <div className="bg-rose-50 text-rose-600 p-4 rounded-2xl text-xs font-bold border border-rose-100 flex items-center gap-2"><i className="fa-solid fa-circle-exclamation text-lg"></i> {error}</div>}
                
                <button type="submit" disabled={loading} className="w-full bg-brand-red hover:bg-brand-redDark text-white font-black py-4 rounded-2xl transition-all shadow-md mt-4 text-base">
                  {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isLogin ? 'Entrar no Aplicativo' : 'Criar Conta')}
                </button>
              </form>
              <div className="mt-8 text-center border-t border-slate-100 pt-6">
                <button onClick={() => {setIsLogin(!isLogin); setError('');}} className="text-sm font-bold text-slate-500">{isLogin ? "Cadastre-se aqui." : "Já é da equipe? Entrar."}</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // PLATAFORMA DASHBOARD
    const Dashboard = ({ session, onLogout, updateSessionData }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [selectedExercise, setSelectedExercise] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [participantsList, setParticipantsList] = useState([]); // Nova lista de Idosos
      
      // Cadastro Exercicio
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false, error: '' });

      // Circuitos
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);
      
      // NOVO STATE DE PLANO DE AULA (Agora com lista de presença e evolução)
      const [planDetails, setPlanDetails] = useState({ 
        activityNum: '', theme: '', date: '', students: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], 
        proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', 
        developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] 
      });

      useEffect(() => {
        const fetchData = async () => {
          const { data: exData } = await supabaseClient.from('exercises').select('*').order('created_at', { ascending: false });
          if (exData) setExercises(exData);
          const { data: circData } = await supabaseClient.from('circuits').select('*').order('created_at', { ascending: false });
          if (circData) setSavedCircuits(circData);
          const { data: annData } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending: false });
          if (annData) setAnnouncements(annData);
          const { data: partData } = await supabaseClient.from('participants').select('*').order('name', { ascending: true });
          if (partData) setParticipantsList(partData);
        };
        fetchData();
      }, [currentView, circuitMode]);

      const pendingCount = exercises.filter(ex => ex.status === 'pending').length;
      const approvedExercises = exercises.filter(ex => ex.status === 'approved');

      const handleNavClick = (view, mode = null) => { setCurrentView(view); if(mode) setCircuitMode(mode); setIsMobileMenuOpen(false); };

      const getYouTubeId = (url) => {
        if (!url) return null;
        const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
        return match ? match[1] : null;
      };

      const filteredExercises = useMemo(() => {
        return approvedExercises.filter(ex => {
          const matchCat = filterCat === 'all' || ex.category === filterCat;
          const matchSub = filterSub === 'Todos' || ex.muscleGroup === filterSub;
          const matchSearch = ex.title.toLowerCase().includes(searchQuery.toLowerCase()) || ex.muscleGroup.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSub && matchSearch;
        });
      }, [searchQuery, filterCat, filterSub, approvedExercises]);

      const upcomingActivity = useMemo(() => {
        if(!session.team_group || session.team_group === 'Nenhum') return null;
        const today = new Date(); today.setHours(0,0,0,0);
        for (let item of AGENDA_DATA) {
          if (item.resp.includes(session.team_group) || item.resp.includes('Todos')) {
            const [d, m, y] = item.date.split('/');
            const itemDate = new Date(y, m - 1, d);
            itemDate.setDate(itemDate.getDate() + 1); 
            if (itemDate >= today) return item;
          }
        }
        return null;
      }, [session.team_group]);

      // EXERCÍCIOS
      const handleFormSubmit = async (e) => {
        e.preventDefault(); setFormStatus({ loading: true, success: false, error: '' });
        let uploadedMediaUrl = null;
        if (mediaFile) {
          const fileExt = mediaFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          const { error: uploadError } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, mediaFile);
          if (uploadError) { setFormStatus({ loading: false, success: false, error: 'Erro ao enviar mídia.' }); return; }
          const { data } = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName);
          uploadedMediaUrl = data.publicUrl;
        }
        const finalMuscleGroup = formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect;
        const newExercise = { title: formData.title, category: formCat, "muscleGroup": finalMuscleGroup, difficulty: formData.difficulty, equipment: formData.equipment, dosage: formData.dosage, "videoUrl": formData.videoUrl, "mediaUrl": uploadedMediaUrl, instructions: formData.instructions, precautions: formData.precautions, status: 'pending', author: session.full_name };
        const { error } = await supabaseClient.from('exercises').insert([newExercise]);
        if (error) setFormStatus({ loading: false, success: false, error: error.message });
        else { setFormStatus({ loading: false, success: true, error: '' }); setFormData({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' }); setFormCat(''); setFormMuscleSelect(''); setFormCustomMuscle(''); setMediaFile(null); }
      };

      const handleApprove = async (id) => { await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id); setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex)); };
      const handleReject = async (id) => { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); };
      const handleDeleteExercise = async (id) => { if(window.confirm("Você vai apagar este exercício. Tem certeza?")) { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); setCurrentView('library'); } };

      // PARTICIPANTES (SINAIS VITAIS)
      const handleAddParticipant = async () => {
        const name = prompt('Digite o nome completo do novo idoso:');
        if(name) {
          const { data, error } = await supabaseClient.from('participants').insert([{ name }]).select();
          if(!error && data) setParticipantsList([...participantsList, data[0]].sort((a,b) => a.name.localeCompare(b.name)));
        }
      };

      const updateAttendance = (index, field, value) => {
         const newList = [...planDetails.attendanceList];
         newList[index][field] = value;
         
         // Atualiza contador automático de presença
         if(field === 'present') {
           const presences = newList.filter(p => p.present).length;
           setPlanDetails({...planDetails, attendanceList: newList, attendanceCount: presences.toString()});
         } else {
           setPlanDetails({...planDetails, attendanceList: newList});
         }
      };

      // RELATÓRIOS E AULA
      const startPlanning = () => { 
        setPlanDetails({ activityNum: '', theme: '', date: '', students: '', proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], developmentNarrative: '', dailyEvolution: '', resultObtained: '', attendanceCount: '', attendanceList: [] }); 
        setCircuit([[], [], [], [], []]); 
        setCircuitMode('plan'); 
      };

      const startEditingReport = () => { 
        // Mescla a lista salva no relatório com os idosos atuais do banco
        let currentList = viewingCircuit.details.attendanceList || [];
        if (currentList.length === 0) {
           currentList = participantsList.map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
        } else {
           const existingIds = currentList.map(c => c.id);
           const newParts = participantsList.filter(p => !existingIds.includes(p.id)).map(p => ({ id: p.id, name: p.name, present: false, fc_in:'', fc_out:'', spo2_in:'', spo2_out:'', pa_in:'', pa_out:'' }));
           currentList = [...currentList, ...newParts].sort((a,b) => a.name.localeCompare(b.name));
        }
        setPlanDetails({ ...viewingCircuit.details, attendanceList: currentList }); 
        setCircuitMode('report_edit'); 
      };

      const handleDeleteCircuit = async (id) => { if(window.confirm("Deseja apagar este Relatório?")) { await supabaseClient.from('circuits').delete().eq('id', id); setSavedCircuits(savedCircuits.filter(c => c.id !== id)); setCircuitMode('history'); } };
      
      const addToCircuit = (stationIndex, exerciseId) => {
        if (!exerciseId) return;
        const exercise = approvedExercises.find(ex => ex.id === exerciseId);
        if (!exercise) return;
        const newCircuit = [...circuit];
        if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) { newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise]; setCircuit(newCircuit); }
      };
      const removeFromCircuit = (stationIndex, exerciseId) => { const newCircuit = [...circuit]; newCircuit[stationIndex] = newCircuit[stationIndex].filter(ex => ex.id !== exerciseId); setCircuit(newCircuit); };
      const updateStationResponsible = (index, value) => { const updated = [...planDetails.stationResponsibles]; updated[index] = value; setPlanDetails({ ...planDetails, stationResponsibles: updated }); };

      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Preencha Número, Tema e Data!');
        const newSavedCircuit = { activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name };
        const { data, error } = await supabaseClient.from('circuits').insert([newSavedCircuit]).select();
        if (error) alert('Erro ao salvar planejamento: ' + error.message);
        else { alert('Aula Planejada com Sucesso!'); setSavedCircuits([data[0], ...savedCircuits]); setCircuitMode('history'); }
      };

      const handleUpdateReport = async () => {
        const updatedCircuit = { ...viewingCircuit, details: planDetails };
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (error) alert('Erro ao atualizar: ' + error.message);
        else { alert('Relatório Salvo!'); setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? updatedCircuit : c)); setViewingCircuit(updatedCircuit); setCircuitMode('view'); }
      };

      const handleGeneratePDF = (circuitData) => {
        const d = circuitData.details;
        const dateFormatted = circuitData.activity_date.split('-').reverse().join('/');
        let stationsHtml = '';
        circuitData.stations.forEach((station, idx) => {

                        <div key={ex.id} className="bg-white rounded-[2rem] border border-slate-100 shadow-sm hover-lift flex flex-col cursor-pointer overflow-hidden group" onClick={() => { setSelectedExercise(ex); setCurrentView('detail'); }}>

                    </div>
                    <div className="w-full bg-slate-900 aspect-video flex items-center justify-center relative shadow-inner overflow-hidden">
                      {getYouTubeId(selectedExercise.videoUrl) ? ( <iframe className="w-full h-full absolute inset-0" src={`https://www.youtube-nocookie.com/embed/${getYouTubeId(selectedExercise.videoUrl)}?rel=0`} frameBorder="0" allowFullScreen></iframe> ) : selectedExercise.mediaUrl ? ( selectedExercise.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i) ? ( <video src={selectedExercise.mediaUrl} controls className="w-full h-full object-contain bg-black"></video> ) : ( <img src={selectedExercise.mediaUrl} className="w-full h-full object-cover" /> ) ) : ( <div className="text-slate-500 text-center"><i className="fa-solid fa-video-slash text-3xl mb-2"></i></div> )}
                    </div>
                    <div className="p-6 sm:p-10 space-y-10">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="bg-blue-50/50 p-6 rounded-3xl"><h4 className="text-[10px] font-black text-slate-400 uppercase">Equipamento</h4><p className="font-extrabold text-slate-700 mt-1">{selectedExercise.equipment}</p></div>
                        <div className="bg-red-50/50 p-6 rounded-3xl"><h4 className="text-[10px] font-black text-slate-400 uppercase">Dosagem</h4><p className="font-extrabold text-slate-700 mt-1">{selectedExercise.dosage}</p></div>
                      </div>
                      <div className="grid md:grid-cols-2 gap-8">
                        <div><h4 className="text-sm font-black text-slate-800 uppercase mb-4"><i className="fa-solid fa-list-ol text-brand-blue mr-2"></i> Passo a Passo</h4><div className="whitespace-pre-line bg-slate-50 p-6 rounded-3xl text-sm font-medium leading-loose text-slate-600">{selectedExercise.instructions}</div></div>
                        <div><h4 className="text-sm font-black text-slate-800 uppercase mb-4"><i className="fa-solid fa-triangle-exclamation text-amber-500 mr-2"></i> Precauções</h4><div className="whitespace-pre-line bg-amber-50 p-6 rounded-3xl text-sm font-bold leading-loose text-amber-900">{selectedExercise.precautions || 'Nenhuma restrição.'}</div></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-pattern"><div className="w-12 h-12 border-4 border-slate-100 border-t-brand-blue rounded-full animate-spin"></div></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} updateSessionData={setSession} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
