                                      <div><p className="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 text-center">FC (Inic/Fin)</p><input placeholder="Ex: 80/90" value={p.fc_in ? `${p.fc_in}/${p.fc_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'fc_in',v[0]||'');updateAttendance(i,'fc_out',v[1]||'');}} className="w-full text-xs font-bold text-center py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 rounded-lg outline-none focus:border-brand-blue dark:text-slate-100 transition-colors shadow-inner"/></div>
                                      <div><p className="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 text-center">SpO2 (Inic/Fin)</p><input placeholder="Ex: 98/97" value={p.spo2_in ? `${p.spo2_in}/${p.spo2_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'spo2_in',v[0]||'');updateAttendance(i,'spo2_out',v[1]||'');}} className="w-full text-xs font-bold text-center py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 rounded-lg outline-none focus:border-brand-blue dark:text-slate-100 transition-colors shadow-inner"/></div>
                                      <div><p className="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 text-center">PA (Inic/Fin)</p><input placeholder="Ex: 12x8/13x8" value={p.pa_in ? `${p.pa_in}/${p.pa_out}` : ''} onChange={e=>{let v=e.target.value.split('/');updateAttendance(i,'pa_in',v[0]||'');updateAttendance(i,'pa_out',v[1]||'');}} className="w-full text-xs font-bold text-center py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 rounded-lg outline-none focus:border-brand-blue dark:text-slate-100 transition-colors shadow-inner"/></div>
                                   </div>
                                )}
                              </div> 
                            ))}
                          </div>
                        </div>

                        <div className="space-y-5 mb-8 relative z-10">
                          <h3 className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800 pb-2">Objetivos e Operação Prática</h3>
                          <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Finalidade da Aula</label><textarea rows="2" value={planDetails.objectives} onChange={e=>setPlanDetails({...planDetails, objectives: e.target.value})} className="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-medium focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors"></textarea></div>
                          <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Síntese de Atividades</label><textarea rows="2" value={planDetails.proposedActivities} onChange={e=>setPlanDetails({...planDetails, proposedActivities: e.target.value})} className="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-medium focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors"></textarea></div>
                          <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Materiais Acionados</label><textarea rows="2" value={planDetails.materials} onChange={e=>setPlanDetails({...planDetails, materials: e.target.value})} className="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-medium focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors"></textarea></div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Monitores na Aferição</label><input type="text" value={planDetails.vitalSigns} onChange={e=>setPlanDetails({...planDetails, vitalSigns: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-bold focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors" /></div>
                            <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Registro Audiovisual</label><input type="text" value={planDetails.soundAndPhotos} onChange={e=>setPlanDetails({...planDetails, soundAndPhotos: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-bold focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors" /></div>
                          </div>
                        </div>

                        <div className="space-y-5 mb-8 relative z-10">
                          <h3 className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800 pb-2">Documentação Narrativa Oficial</h3>
                          <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Relato Comportamental do Grupo</label><textarea rows="4" value={planDetails.developmentNarrative} onChange={e=>setPlanDetails({...planDetails, developmentNarrative: e.target.value})} className="w-full p-5 rounded-2xl bg-blue-50/50 dark:bg-slate-900 border border-brand-blue/20 dark:border-slate-700 outline-none text-sm font-medium leading-relaxed focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors shadow-inner"></textarea></div>
                          
                          <div className="mt-6">
                            <div className="flex flex-col sm:flex-row justify-between sm:items-center mb-3 px-2 gap-3">
                               <label className="text-[10px] font-black uppercase tracking-widest text-amber-600 dark:text-amber-500 flex items-center gap-2"><i className="fa-solid fa-file-medical"></i> Evolução Sistêmica Clínica</label>
                               <button type="button" onClick={handleGenerateAutoEvolution} className="text-[9px] bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-black uppercase tracking-widest transition-colors shadow-md flex items-center justify-center gap-1.5"><i className="fa-solid fa-wand-magic-sparkles"></i> Gerar via Sinais Vitais</button>
                            </div>
                            <textarea rows="6" value={planDetails.dailyEvolution} onChange={e=>setPlanDetails({...planDetails, dailyEvolution: e.target.value})} className="w-full p-5 rounded-2xl bg-amber-50 dark:bg-amber-900/10 border border-amber-200 dark:border-amber-800/50 outline-none text-sm font-medium leading-relaxed focus:border-amber-400 text-amber-900 dark:text-amber-100 transition-colors shadow-inner" placeholder="O sistema pode redigir este bloco automaticamente baseado na tabela acima."></textarea>
                          </div>
                          <div className="pt-4"><label className="block text-[10px] font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-2 pl-2">Total Verificado de Idosos Presentes</label><input type="text" value={planDetails.attendanceCount} onChange={e=>setPlanDetails({...planDetails, attendanceCount: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 outline-none text-sm font-bold focus:border-brand-blue text-slate-800 dark:text-slate-100 transition-colors w-full sm:w-1/3" placeholder="Ex: 32" /></div>
                        </div>

                        <div className="pt-8 border-t border-slate-100 dark:border-slate-800 flex justify-end relative z-10"><button onClick={handleUpdateReport} className="w-full sm:w-auto px-12 py-4 bg-brand-blue hover:bg-brand-dark text-white font-black uppercase tracking-widest text-xs rounded-xl shadow-[0_8px_20px_-6px_rgba(32,43,92,0.5)] transition-transform hover:-translate-y-1 flex items-center justify-center gap-3"><i className="fa-solid fa-file-signature text-base"></i> Assinar Prontuário</button></div>
                      </div>
                    </div> 
                  )}

                  {circuitMode === 'history' && ( 
                    <div className="animate-fade-in">
                      {savedCircuits.length === 0 ? ( 
                        <div className="bg-white dark:bg-slate-900 py-24 text-center border border-slate-200 dark:border-slate-800 rounded-[2rem] shadow-sm transition-colors">
                           <div className="w-32 h-32 bg-slate-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6">
                              <i className="fa-solid fa-folder-open text-5xl text-slate-300 dark:text-slate-600"></i>
                           </div>
                           <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-2">Base de dados vazia</h3>
                           <p className="text-sm font-medium text-slate-500 dark:text-slate-400 max-w-sm mx-auto">Nenhum diário registrado. Inicie o planejamento de uma nova aula para alimentar o acervo semestral.</p>
                        </div> 
                      ) : ( 
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {savedCircuits.map(circ => { 
                            const isComplete = circ.details?.resultObtained || circ.details?.dailyEvolution; 
                            return ( 
                              <div key={circ.id} className="bg-white dark:bg-slate-900 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm cursor-pointer hover:shadow-lg transition-all flex flex-col hover:-translate-y-1 relative overflow-hidden group" onClick={() => {setViewingCircuit(circ); setCircuitMode('view');}}>
                                <div className={`absolute top-0 left-0 w-full h-2 transition-colors ${isComplete ? 'bg-brand-blue' : 'bg-emerald-400'}`}></div>
                                <div className="flex justify-between items-start mb-6">
                                  <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-inner transition-colors ${isComplete ? 'bg-blue-50 dark:bg-blue-900/30 text-brand-blue' : 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500'}`}><i className={`fa-solid ${isComplete ? 'fa-file-signature' : 'fa-calendar-day'}`}></i></div>
                                  <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-700">{circ.activity_date.split('-').reverse().join('/')}</span>
                                </div>
                                <h3 className="text-lg font-black text-slate-800 dark:text-slate-100 mb-2 group-hover:text-brand-blue dark:group-hover:text-brand-light transition-colors">Aula Oficial {circ.details?.activityNum || '-'}</h3>
                                <p className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-6 line-clamp-2 leading-relaxed">{circ.details?.theme || 'Tema não definido.'}</p>
                                <div className={`mt-auto pt-5 border-t border-slate-100 dark:border-slate-800 text-[10px] uppercase tracking-widest font-black text-right flex justify-end items-center gap-2 transition-colors ${isComplete ? 'text-brand-blue dark:text-brand-light' : 'text-emerald-600 dark:text-emerald-400'}`}>{isComplete ? 'Acessar Prontuário' : 'Preencher Pós-Aula'} <i className="fa-solid fa-arrow-right group-hover:translate-x-1.5 transition-transform"></i></div>
                              </div> 
                            ) 
                          })}
                        </div> 
                      )}
                    </div> 
                  )}

                  {circuitMode === 'view' && viewingCircuit && ( 
                    <div className="space-y-6 animate-fade-in pb-12">
                      <div className="flex flex-wrap gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 transition-colors">
                        <button onClick={() => setCircuitMode('history')} className="px-6 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"><i className="fa-solid fa-arrow-left mr-2"></i> Voltar</button>
                        {isAdmin && ( <button onClick={() => handleDeleteCircuit(viewingCircuit.id)} className="px-6 py-3 bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-800/50 text-rose-600 dark:text-rose-400 text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-colors md:ml-auto"><i className="fa-solid fa-trash mr-1.5"></i> Excluir</button> )}
                        <button onClick={startEditingReport} className={`px-6 py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-colors ${!isAdmin && "md:ml-auto"} border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800`}><i className="fa-solid fa-pen mr-1.5"></i> Editar Pós-Aula</button>
                        <button onClick={() => handleGenerateReportPDF(viewingCircuit)} className="px-6 py-3 bg-slate-800 dark:bg-slate-700 text-white text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-slate-900 dark:hover:bg-slate-600 transition-colors shadow-sm"><i className="
