    const Dashboard = ({ session, onLogout, updateSessionData, darkMode, setDarkMode }) => {

      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const touchStartX = useRef(null);
      const touchEndX = useRef(null);

      const onTouchStart = (e) => {
        touchEndX.current = null;
        touchStartX.current = e.targetTouches[0].clientX;
      };
      const onTouchMove = (e) => {
        touchEndX.current = e.targetTouches[0].clientX;
      };
      const onTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;
        const distance = touchStartX.current - touchEndX.current;
        if (distance < -40 && touchStartX.current < 50 && !isMobileMenuOpen) setIsMobileMenuOpen(true);
        if (distance > 40 && isMobileMenuOpen) setIsMobileMenuOpen(false);
      };

               localStorage.setItem('atv_draft_circuit', JSON.stringify(circuit));
               localStorage.setItem('atv_draft_mode', circuitMode);

               setHasDraft(true);

            return () => clearTimeout(timer);

         localStorage.removeItem('atv_draft_planDetails');

        const matchSub = filterSub === 'Todos' || ex.muscleGroup === filterSub;
        return matchSearch && matchCat && matchSub;
      });

      const getYouTubeId = (url) => {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      };

      const upcomingActivity = useMemo(() => {
        if(!session.team_group || session.team_group === 'Nenhum') return null;
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        const mesAtual = hoje.getMonth() + 1;
        const diaAtual = hoje.getDate();
        const numeroHoje = parseInt(`${anoAtual}${String(mesAtual).padStart(2, '0')}${String(diaAtual).padStart(2, '0')}`);
        
        let atividadeDestaSemana = null;
        for (let item of AGENDA_DATA) {
          const [d, m, y] = item.date.split('/');

          if (numeroAtividade >= numeroHoje) {
            atividadeDestaSemana = item;
            break; 
          }

                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registrations) => { for (let reg of registrations) { reg.unregister(); } });
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || 'Monitor', role: profile?.role || 'Monitor', avatar_url: profile?.avatar_url, team_group: profile?.team_group });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-950 transition-colors duration-300"><div className="flex flex-col items-center"><img src="Logo_ATV_2024_Colorido_v2.png" alt="Logo" className="h-28 drop-shadow-sm" onError={(e) => e.target.style.display='none'} /><p className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-6">Autenticando acesso...</p></div><div className="flex gap-2 mt-4"><div className="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600 animate-pulse"></div><div className="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 animate-pulse" style={{animationDelay: '0.2s'}}></div><div className="w-2 h-2 rounded-full bg-slate-500 dark:bg-slate-400 animate-pulse" style={{animationDelay: '0.4s'}}></div></div></div>;
      
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} updateSessionData={setSession} darkMode={darkMode} setDarkMode={setDarkMode} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
