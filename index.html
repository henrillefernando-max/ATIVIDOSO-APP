    };

    // ==========================================

        e.preventDefault(); setLoading(true); setError(''); setSuccessMsg('');

        if (isLogin) {
          const { data, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (authError) {
            setError(authError.message.includes("Invalid login") ? "E-mail ou senha incorretos." : "Erro: " + authError.message);
            setLoading(false); return;
          }
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
          onLogin({ 
            id: data.user.id, 
            email: data.user.email, 
            full_name: profile?.full_name || data.user?.user_metadata?.full_name || 'Monitor', 
            role: profile?.role || 'Monitor' 
          });
        } else {
          const { data, error: signUpError } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
          if (signUpError) { setError("Erro ao criar conta: " + signUpError.message); }

          <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] w-full max-w-md overflow-hidden border border-slate-100 relative z-10">

    // ==========================================
    // DASHBOARD COMPLETO (ESTÉTICO & ORGÂNICO)
    // ==========================================
    const Dashboard = ({ session, onLogout }) => {
      const isAdmin = session.role === 'admin' || session.role === 'Coordenador / Admin';

      // Estados de Navegação
      const [currentView, setCurrentView] = useState('home');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [selectedExercise, setSelectedExercise] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('all');
      const [filterSub, setFilterSub] = useState('Todos');
      
      // Dados
      const [exercises, setExercises] = useState([]);
      const [savedCircuits, setSavedCircuits] = useState([]);
      
      // Formulário Cadastro de Exercício
      const [formCat, setFormCat] = useState('');
      const [formMuscleSelect, setFormMuscleSelect] = useState('');
      const [formCustomMuscle, setFormCustomMuscle] = useState('');
      const [mediaFile, setMediaFile] = useState(null); 
      const [formData, setFormData] = useState({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' });
      const [formStatus, setFormStatus] = useState({ loading: false, success: false, error: '' });

      // Estações e Relatório
      const [circuitMode, setCircuitMode] = useState('agenda');
      const [circuit, setCircuit] = useState([[], [], [], [], []]);
      const [viewingCircuit, setViewingCircuit] = useState(null);
      const [planDetails, setPlanDetails] = useState({
        activityNum: '', theme: '', date: '', students: '', 
        warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''],
        proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', 
        specialCare: '', materials: '', developmentNarrative: '', resultObtained: '', attendanceCount: ''
      });

      useEffect(() => {
        const fetchData = async () => {
          const { data: exData } = await supabaseClient.from('exercises').select('*').order('created_at', { ascending: false });
          if (exData) setExercises(exData);
          const { data: circData } = await supabaseClient.from('circuits').select('*').order('created_at', { ascending: false });
          if (circData) setSavedCircuits(circData);
        };
        fetchData();
      }, [currentView, circuitMode]);

      const pendingCount = exercises.filter(ex => ex.status === 'pending').length;
      const approvedExercises = exercises.filter(ex => ex.status === 'approved');

      const handleNavClick = (view, mode = null) => { setCurrentView(view); if(mode) setCircuitMode(mode); setIsMobileMenuOpen(false); };

      const getYouTubeId = (url) => {
        if (!url) return null;
        const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
        return match ? match[1] : null;
      };

      const filteredExercises = useMemo(() => {
        return approvedExercises.filter(ex => {
          const matchCat = filterCat === 'all' || ex.category === filterCat;
          const matchSub = filterSub === 'Todos' || ex.muscleGroup === filterSub;
          const matchSearch = ex.title.toLowerCase().includes(searchQuery.toLowerCase()) || ex.muscleGroup.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSub && matchSearch;
        });
      }, [searchQuery, filterCat, filterSub, approvedExercises]);

      // FUNÇÕES DE EXERCÍCIOS
      const handleFormSubmit = async (e) => {
        e.preventDefault(); setFormStatus({ loading: true, success: false, error: '' });
        let uploadedMediaUrl = null;
        if (mediaFile) {
          const fileExt = mediaFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          const { error: uploadError } = await supabaseClient.storage.from('midia_exercicios').upload(fileName, mediaFile);
          if (uploadError) { setFormStatus({ loading: false, success: false, error: 'Erro ao enviar mídia.' }); return; }
          const { data } = supabaseClient.storage.from('midia_exercicios').getPublicUrl(fileName);
          uploadedMediaUrl = data.publicUrl;
        }
        const finalMuscleGroup = formMuscleSelect === 'Outro' ? formCustomMuscle : formMuscleSelect;
        const newExercise = { title: formData.title, category: formCat, "muscleGroup": finalMuscleGroup, difficulty: formData.difficulty, equipment: formData.equipment, dosage: formData.dosage, "videoUrl": formData.videoUrl, "mediaUrl": uploadedMediaUrl, instructions: formData.instructions, precautions: formData.precautions, status: 'pending', author: session.full_name };
        const { error } = await supabaseClient.from('exercises').insert([newExercise]);
        if (error) setFormStatus({ loading: false, success: false, error: error.message });
        else { setFormStatus({ loading: false, success: true, error: '' }); setFormData({ title: '', difficulty: 'Iniciante / Leve', equipment: 'Nenhum', dosage: '', videoUrl: '', instructions: '', precautions: '' }); setFormCat(''); setFormMuscleSelect(''); setFormCustomMuscle(''); setMediaFile(null); }
      };

      const handleApprove = async (id) => { await supabaseClient.from('exercises').update({ status: 'approved' }).eq('id', id); setExercises(exercises.map(ex => ex.id === id ? { ...ex, status: 'approved' } : ex)); };
      const handleReject = async (id) => { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); };
      const handleDeleteExercise = async (id) => { if(window.confirm("ATENÇÃO: Você vai apagar este exercício. Tem certeza?")) { await supabaseClient.from('exercises').delete().eq('id', id); setExercises(exercises.filter(ex => ex.id !== id)); setCurrentView('library'); } };

      // FUNÇÕES DE RELATÓRIOS E AULA
      const startPlanning = () => { setPlanDetails({ activityNum: '', theme: '', date: '', students: '', proposedActivities: '', objectives: '', vitalSigns: '', soundAndPhotos: '', specialCare: '', materials: '', warmUp: '', coolDown: 'Todos', stationResponsibles: ['', '', '', '', ''], developmentNarrative: '', resultObtained: '', attendanceCount: '' }); setCircuit([[], [], [], [], []]); setCircuitMode('plan'); };
      const startEditingReport = () => { setPlanDetails(viewingCircuit.details); setCircuitMode('report_edit'); };
      const handleDeleteCircuit = async (id) => { if(window.confirm("Deseja apagar este Relatório permanentemente?")) { await supabaseClient.from('circuits').delete().eq('id', id); setSavedCircuits(savedCircuits.filter(c => c.id !== id)); setCircuitMode('history'); } };
      
      const addToCircuit = (stationIndex, exerciseId) => {
        if (!exerciseId) return;
        const exercise = approvedExercises.find(ex => ex.id === exerciseId);
        if (!exercise) return;
        const newCircuit = [...circuit];
        if (!newCircuit[stationIndex].find(ex => ex.id === exerciseId)) { newCircuit[stationIndex] = [...newCircuit[stationIndex], exercise]; setCircuit(newCircuit); }
      };
      const removeFromCircuit = (stationIndex, exerciseId) => { const newCircuit = [...circuit]; newCircuit[stationIndex] = newCircuit[stationIndex].filter(ex => ex.id !== exerciseId); setCircuit(newCircuit); };
      const updateStationResponsible = (index, value) => { const updated = [...planDetails.stationResponsibles]; updated[index] = value; setPlanDetails({ ...planDetails, stationResponsibles: updated }); };

      const handleSavePlan = async () => {
        if (!planDetails.date || !planDetails.theme || !planDetails.activityNum) return alert('Preencha Número, Tema e Data!');
        const newSavedCircuit = { activity_date: planDetails.date, stations: circuit, details: planDetails, author: session.full_name };
        const { data, error } = await supabaseClient.from('circuits').insert([newSavedCircuit]).select();
        if (error) alert('Erro ao salvar planejamento: ' + error.message);
        else { alert('Aula Planejada com Sucesso!'); setSavedCircuits([data[0], ...savedCircuits]); setCircuitMode('history'); }
      };

      const handleUpdateReport = async () => {
        const updatedCircuit = { ...viewingCircuit, details: planDetails };
        const { error } = await supabaseClient.from('circuits').update({ details: planDetails }).eq('id', viewingCircuit.id);
        if (error) alert('Erro ao atualizar: ' + error.message);
        else { alert('Relatório Salvo!'); setSavedCircuits(savedCircuits.map(c => c.id === viewingCircuit.id ? updatedCircuit : c)); setViewingCircuit(updatedCircuit); setCircuitMode('view'); }
      };

      const handleGeneratePDF = (circuitData) => {
        const d = circuitData.details;
        const dateFormatted = circuitData.activity_date.split('-').reverse().join('/');

                          <h2 className="font-black uppercase text-lg sm:text-xl tracking-wide">ATIVIDADE {viewingCircuit.details?.activityNum || 'X'} – {viewingCircuit.details?.theme}</h2>

                          <div className="flex justify-between border-b border-dashed border-slate-200 pb-4">
                            <p><strong>DATA:</strong> {viewingCircuit.activity_date.split('-').reverse().join('/')}</p>
                            <p className="text-right"><strong>DISCENTES:</strong> {viewingCircuit.details?.students}</p>
                          </div>
                          
                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">ATIVIDADE(S) PROPOSTA(S)</p><p className="whitespace-pre-line text-slate-600 bg-slate-50 p-4 rounded-xl">{viewingCircuit.details?.proposedActivities || 'Não informado.'}</p></div>
                          <div><p className="font-bold text-brand-blue mb-2 text-xs uppercase tracking-widest">OBJETIVO(S) DA(S) ATIVIDADE(S)</p><p className="text-justify whitespace-pre-line text-slate-600">{viewingCircuit.details?.objectives || 'Não informado.'}</p></div>

                          <div className="bg-amber-50 p-5 rounded-2xl border border-amber-100 text-amber-900">

                  {/* Busca e Filtros Orgânicos */}
                  <div className="bg-white p-4 sm:p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col gap-4">
                    <div className="relative w-full">
                      <i className="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-400 text-lg"></i>

                      </div>

                               isVideo ? ( <div className="w-full h-full bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center group-hover:scale-105 transition-transform duration-700"><i className="fa-solid fa-circle-play text-4xl text-brand-red mb-2 drop-shadow-md"></i><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Vídeo Anexado</span></div> ) : 
                               ( <i className="fa-solid fa-dumbbell text-4xl text-slate-300"></i> )}
                              
                              <div className="absolute inset-0 bg-brand-dark/20 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center"><div className="bg-white/90 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transform scale-50 group-hover:scale-100 transition-transform duration-300 delay-100"><i className="fa-solid fa-eye text-brand-blue text-xl"></i></div></div>
                            </div>
                            
                            <div className="p-5 sm:p-6 flex-1 flex flex-col bg-white">
                              <span className={`text-[9px] font-black uppercase tracking-widest ${cat.color} ${cat.bg} px-2.5 py-1 rounded-md border ${cat.border} mb-3 self-start shadow-sm`}>{ex.muscleGroup}</span>
                              <h3 className="font-extrabold text-slate-800 text-lg leading-tight group-hover:text-brand-blue transition-colors line-clamp-2">{ex.title}</h3>
                            </div>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* ==========================================
                  TELA: DETALHES DO EXERCÍCIO (CLÍNICO)
              ========================================== */}
              {currentView === 'detail' && selectedExercise && (
                <div className="max-w-4xl mx-auto pb-12 animate-fade-in">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <button onClick={() => setCurrentView('library')} className="w-full sm:w-auto text-sm font-extrabold text-slate-500 hover:text-brand-blue bg-white px-6 py-3 rounded-2xl border border-slate-200 shadow-sm transition-all flex items-center justify-center hover:-translate-x-1"><i className="fa-solid fa-arrow-left mr-2"></i> Voltar ao Acervo</button>
                    {isAdmin && (
                       <button onClick={() => handleDeleteExercise(selectedExercise.id)} className="w-full sm:w-auto text-sm font-extrabold text-rose-500 hover:bg-rose-500 hover:text-white bg-white px-6 py-3 rounded-2xl border border-rose-200 shadow-sm transition-all flex items-center justify-center"><i className="fa-solid fa-trash mr-2"></i> Remover do Acervo</button>
                    )}
                  </div>

                  <div className="bg-white rounded-[2.5rem] border border-slate-100 shadow-lg overflow-hidden">
                    <div className="p-6 sm:p-10 border-b border-slate-100 bg-gradient-to-br from-slate-50 to-white relative overflow-hidden">
                      {/* Decoração sutil */}
                      <div className="absolute top-0 right-0 w-32 h-32 bg-brand-blue/5 rounded-bl-full"></div>
                      
                      <div className="flex flex-wrap items-center gap-3 mb-5 relative z-10">
                        <span className="text-[10px] sm:text-[11px] font-black uppercase tracking-widest text-white bg-brand-blue px-4 py-2 rounded-xl shadow-md">{CATEGORIES[selectedExercise.category]?.shortTitle || selectedExercise.category}</span>
                        <span className="text-[10px] sm:text-[11px] font-black uppercase tracking-widest text-brand-red bg-red-50 border border-red-100 px-4 py-2 rounded-xl">{selectedExercise.difficulty}</span>
                      </div>
                      <h1 className="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-800 mb-6 leading-tight tracking-tight relative z-10">{selectedExercise.title}</h1>
                      <div className="flex flex-wrap gap-4 text-xs font-bold text-slate-600 relative z-10">
                        <div className="bg-white border border-slate-200 px-5 py-3 rounded-2xl flex items-center gap-2 shadow-sm"><div className="w-6 h-6 rounded-full bg-brand-red/10 text-brand-red flex items-center justify-center"><i className="fa-solid fa-bullseye"></i></div> Foco Principal: <span className="text-brand-blue font-black ml-1">{selectedExercise.muscleGroup}</span></div>
                      </div>
                    </div>
                    
                    {/* Exibição da Mídia */}
                    <div className="w-full bg-slate-900 aspect-video flex items-center justify-center relative shadow-inner overflow-hidden">
                      {getYouTubeId(selectedExercise.videoUrl) ? ( 
                        <iframe className="w-full h-full absolute inset-0" src={`https://www.youtube-nocookie.com/embed/${getYouTubeId(selectedExercise.videoUrl)}?rel=0`} title="Tutorial" frameBorder="0" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe> 
                      ) : selectedExercise.mediaUrl ? (
                        selectedExercise.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i) ? (
                          <video src={selectedExercise.mediaUrl} controls className="w-full h-full object-contain bg-black"></video>
                        ) : (
                          <img src={selectedExercise.mediaUrl} className="w-full h-full object-cover" />
                        )
                      ) : ( 
                        <div className="text-center text-slate-500 flex flex-col items-center"><div className="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-video-slash text-3xl"></i></div><p className="font-bold text-sm tracking-widest uppercase">Sem demonstração visual</p></div> 
                      )}
                    </div>
                    
                    {getYouTubeId(selectedExercise.videoUrl) && (
                      <div className="bg-brand-red text-center py-3">
                        <a href={selectedExercise.videoUrl} target="_blank" className="text-xs font-black text-white hover:text-white/80 uppercase tracking-widest transition-colors flex items-center justify-center gap-2"><i className="fa-brands fa-youtube text-lg"></i> Abrir aplicativo do YouTube</a>
                      </div>
                    )}

                    <div className="p-6 sm:p-10 space-y-10">
                      
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-blue-50/50 p-6 rounded-3xl border border-brand-blue/10 flex items-center gap-4">
                          <div className="w-12 h-12 bg-white rounded-2xl shadow-sm text-brand-blue flex items-center justify-center text-xl shrink-0"><i className="fa-solid fa-cube"></i></div>
                          <div><h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Equipamento</h4><p className="font-extrabold text-slate-700 text-sm sm:text-base">{selectedExercise.equipment || 'Nenhum'}</p></div>
                        </div>
                        <div className="bg-red-50/50 p-6 rounded-3xl border border-brand-red/10 flex items-center gap-4">
                          <div className="w-12 h-12 bg-white rounded-2xl shadow-sm text-brand-red flex items-center justify-center text-xl shrink-0"><i className="fa-solid fa-stopwatch-20"></i></div>
                          <div><h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Dosagem Clínica</h4><p className="font-extrabold text-slate-700 text-sm sm:text-base">{selectedExercise.dosage}</p></div>
                        </div>
                      </div>

                      <div className="grid lg:grid-cols-2 gap-8">
                        <div>
                          <h4 className="text-sm font-black text-slate-800 uppercase flex items-center gap-3 mb-5"><div className="w-8 h-8 rounded-full bg-brand-blue text-white flex items-center justify-center text-xs"><i className="fa-solid fa-list-ol"></i></div> Como Executar</h4>
                          <div className="whitespace-pre-line bg-slate-50 p-6 sm:p-8 rounded-[2rem] border border-slate-100 text-sm font-medium leading-loose text-slate-600 shadow-inner">{selectedExercise.instructions}</div>
                        </div>
                        <div>
                          <h4 className="text-sm font-black text-slate-800 uppercase flex items-center gap-3 mb-5"><div className="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs"><i className="fa-solid fa-triangle-exclamation"></i></div> Cuidados & Precauções</h4>
                          <div className="whitespace-pre-line bg-amber-50/50 p-6 sm:p-8 rounded-[2rem] border border-amber-100 text-sm font-bold leading-loose text-amber-900 shadow-inner">{selectedExercise.precautions || 'Nenhuma restrição registrada para a execução padrão.'}</div>
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              )}

              {/* ==========================================
                  TELA: CADASTRO COM ANEXO (UPLOAD)
              ========================================== */}
              {currentView === 'cadastro' && (
                <div className="max-w-4xl mx-auto bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                  <div className="bg-gradient-to-br from-brand-blue to-brand-dark p-8 sm:p-10 text-white relative overflow-hidden">
                    <div className="absolute -top-12 -right-12 w-32 h-32 bg-white/5 blob-shape"></div>
                    <div className="absolute -bottom-8 -left-8 w-24 h-24 bg-brand-red/20 blob-shape-2"></div>
                    <h2 className="text-2xl sm:text-3xl font-black flex items-center gap-4 relative z-10"><div className="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-sm border border-white/20"><i className="fa-solid fa-file-medical text-brand-red text-xl"></i></div> Novo Exercício Clínico</h2>
                    <p className="text-sm text-slate-300 mt-4 relative z-10 max-w-xl leading-relaxed">Adicione um novo exercício ao acervo do projeto. Após o envio, a coordenação fará a revisão técnica e científica.</p>
                  </div>
                  
                  {formStatus.success ? (
                    <div className="p-10 sm:p-20 text-center bg-white"><div className="w-32 h-32 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-6xl mx-auto mb-6 relative"><div className="absolute inset-0 border-4 border-emerald-500/20 rounded-full animate-ping"></div><i className="fa-solid fa-check"></i></div><h3 className="text-2xl sm:text-3xl font-black text-slate-800 mb-2">Salvo com Sucesso!</h3><p className="text-slate-500 font-medium mb-8 max-w-sm mx-auto">Sua contribuição foi enviada e está na fila para aprovação técnica.</p><button onClick={() => setFormStatus({loading: false, success: false, error: ''})} className="px-8 py-4 rounded-2xl font-black text-white bg-brand-blue hover:bg-brand-dark transition-all shadow-[0_8px_20px_-6px_rgba(32,43,92,0.4)] hover:-translate-y-1 w-full sm:w-auto"><i className="fa-solid fa-plus mr-2"></i> Adicionar Outro</button></div>
                  ) : (
                    <form className="p-6 sm:p-10 space-y-10" onSubmit={handleFormSubmit}>
                      <div className="space-y-5">
                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-3 pl-2 flex items-center gap-2"><i className="fa-solid fa-1 text-slate-300"></i> Informações Básicas</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                          <div className="md:col-span-2"><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Título do Exercício *</label><input type="text" value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} required className="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10 outline-none text-sm transition-all font-semibold" placeholder="Ex: Sentar e Levantar da Cadeira" /></div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Classificação (Tema) *</label><select required value={formCat} onChange={(e) => {setFormCat(e.target.value); setFormMuscleSelect('');}} className="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10 outline-none text-sm transition-all font-semibold text-slate-700"><option value="">Selecione...</option>{Object.keys(CATEGORIES).map(k => <option key={k} value={k}>{CATEGORIES[k].title}</option>)}</select></div>
                          <div>
                            <label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Foco Muscular / Motricidade *</label>
                            <select required value={formMuscleSelect} onChange={e=>setFormMuscleSelect(e.target.value)} className="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm transition-all font-semibold text-slate-700 disabled:opacity-50" disabled={!formCat}><option value="">Selecione...</option>{formCat && CATEGORIES[formCat].subgroups.filter(s => s !== 'Todos').map(sub => (<option key={sub} value={sub}>{sub}</option>))}</select>
                            {formMuscleSelect === 'Outro' && (<input type="text" value={formCustomMuscle} onChange={e=>setFormCustomMuscle(e.target.value)} required className="w-full px-5 py-4 mt-3 rounded-2xl bg-white border border-brand-red focus:ring-4 focus:ring-brand-red/10 outline-none text-sm transition-all font-semibold" placeholder="Qual o foco exato?" />)}
                          </div>
                        </div>
                      </div>

                      <div className="space-y-5">
                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-3 pl-2 flex items-center gap-2"><i className="fa-solid fa-2 text-slate-300"></i> Parâmetros e Mídia</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Dosagem (Séries/Reps) *</label><input type="text" value={formData.dosage} onChange={e=>setFormData({...formData, dosage: e.target.value})} required className="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm transition-all font-semibold" placeholder="Ex: 3x10 ou Livre" /></div>
                          <div><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Nível de Exigência *</label><select required value={formData.difficulty} onChange={e=>setFormData({...formData, difficulty: e.target.value})} className="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm transition-all font-semibold text-slate-700"><option value="Iniciante / Leve">Iniciante / Leve</option><option value="Intermediário">Intermediário</option><option value="Avançado / Desafiador">Avançado / Desafiador</option></select></div>
                          
                          <div className="md:col-span-2 bg-blue-50/50 p-6 rounded-3xl border border-brand-blue/10 grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="md:col-span-2"><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Equipamento Necessário</label><input type="text" value={formData.equipment} onChange={e=>setFormData({...formData, equipment: e.target.value})} className="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 focus:border-brand-blue outline-none text-sm transition-all font-semibold" placeholder="Halter, TheraBand, Step..." /></div>
                            <div><label className="block text-xs font-extrabold text-brand-blue mb-2 pl-2"><i className="fa-brands fa-youtube mr-1 text-brand-red"></i> Link do YouTube</label><input type="url" value={formData.videoUrl} onChange={e=>setFormData({...formData, videoUrl: e.target.value})} className="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 focus:border-brand-blue outline-none text-sm transition-all font-semibold" placeholder="https://..." /></div>
                            <div>
                               <label className="block text-xs font-extrabold text-brand-blue mb-2 pl-2"><i className="fa-solid fa-cloud-arrow-up mr-1 text-emerald-500"></i> Ou Anexar (Foto/Vídeo)</label>
                               <input type="file" accept="image/*,video/*" onChange={e=>setMediaFile(e.target.files[0])} className="w-full px-3 py-3 rounded-2xl border-2 border-dashed border-brand-blue/20 bg-white hover:bg-slate-50 transition-colors outline-none text-xs font-bold text-slate-500 file:mr-3 file:py-1.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-brand-blue file:text-white file:cursor-pointer cursor-pointer" />
                            </div>
                          </div>

                          <div className="md:col-span-2"><label className="block text-xs font-extrabold text-slate-600 mb-2 pl-2">Passo a Passo da Execução *</label><textarea rows="5" value={formData.instructions} onChange={e=>setFormData({...formData, instructions: e.target.value})} required className="w-full p-5 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-brand-blue outline-none text-sm leading-relaxed transition-all font-medium" placeholder="Descreva os movimentos de forma clara..."></textarea></div>
                        </div>
                      </div>

                      <div className="space-y-5">
                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-3 pl-2 flex items-center gap-2"><i className="fa-solid fa-3 text-slate-300"></i> Aspectos Clínicos</h3>
                        <div><label className="block text-xs font-extrabold text-amber-700 mb-2 pl-2">Precauções e Contraindicações</label><textarea rows="3" value={formData.precautions} onChange={e=>setFormData({...formData, precautions: e.target.value})} className="w-full p-5 rounded-2xl bg-amber-50/50 border border-amber-200 focus:bg-white focus:border-amber-400 outline-none text-sm leading-relaxed text-amber-900 transition-all font-medium" placeholder="Ex: Evitar em caso de artrose avançada..."></textarea></div>
                      </div>

                      <div className="pt-8 border-t border-slate-100 flex justify-end relative z-10">
                        <button type="submit" disabled={formStatus.loading} className="w-full sm:w-auto px-10 py-4 bg-brand-red hover:bg-brand-redDark text-white font-black rounded-2xl shadow-[0_8px_20px_-6px_rgba(209,40,54,0.4)] transition-all hover:-translate-y-1 text-base flex items-center justify-center gap-3">
                          {formStatus.loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Processando...</> : <><i className="fa-solid fa-paper-plane"></i> Submeter à Coordenação</>}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              )}

              {/* ==========================================
                  TELA: APROVAÇÕES PENDENTES (ADMIN)
              ========================================== */}
              {currentView === 'aprovacoes' && (
                <div className="max-w-4xl mx-auto space-y-8">
                  <div className="bg-gradient-to-r from-amber-500 to-orange-500 p-8 rounded-[2rem] text-white shadow-lg relative overflow-hidden">
                    <i className="fa-solid fa-clipboard-check absolute -right-6 -bottom-6 text-9xl opacity-20 transform -rotate-12"></i>
                    <h2 className="text-2xl sm:text-3xl font-black mb-2 relative z-10">Central de Avaliação</h2>
                    <p className="text-amber-100 font-medium relative z-10">Revise o conteúdo enviado pelos monitores antes de adicioná-lo ao acervo.</p>
                  </div>
                  
                  {pendingCount === 0 ? (
                    <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-16 text-center flex flex-col items-center"><div className="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6"><i className="fa-solid fa-inbox text-4xl text-slate-300"></i></div><h3 className="text-2xl font-black text-slate-800">Fila Vazia!</h3><p className="text-slate-500 font-medium mt-2">Nenhum exercício aguardando revisão no momento.</p></div>
                  ) : (
                    <div className="space-y-6">
                      {exercises.filter(ex => ex.status === 'pending').map(ex => {
                        const ytId = getYouTubeId(ex.videoUrl);
                        const ytThumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : null;
                        const isImage = ex.mediaUrl && ex.mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)/i);
                        const isVideo = ex.mediaUrl && ex.mediaUrl.match(/\.(mp4|webm|ogg|mov)/i);

                        return (
                          <div key={ex.id} className="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-4 sm:p-6 flex flex-col md:flex-row gap-6 items-start hover-lift transition-all">
                            
                            <div className="w-full md:w-56 aspect-video bg-slate-100 rounded-2xl overflow-hidden shrink-0 flex items-center justify-center relative">
                              {ytThumb ? ( <img src={ytThumb} className="w-full h-full object-cover" /> ) : 
                               isImage ? ( <img src={ex.mediaUrl} className="w-full h-full object-cover" /> ) : 
                               isVideo ? ( <div className="w-full h-full bg-slate-200 flex flex-col items-center justify-center"><i className="fa-solid fa-film text-3xl text-slate-400 mb-1"></i><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Vídeo</span></div> ) : 
                               ( <i className="fa-solid fa-dumbbell text-3xl text-slate-300"></i> )}
                            </div>

                            <div className="flex-1 w-full flex flex-col">
                              <div className="flex justify-between items-start mb-3"><span className="text-[10px] font-black uppercase tracking-widest text-amber-600 bg-amber-50 border border-amber-100 px-3 py-1.5 rounded-lg inline-block shadow-sm">Pendente</span><span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-slate-50 px-3 py-1 rounded-full">Autor: {ex.author}</span></div>
                              <h3 className="font-black text-slate-800 text-xl leading-tight mb-2">{ex.title}</h3>
                              <p className="text-xs font-bold text-slate-500 mb-6 flex items-center gap-2"><i className="fa-solid fa-bullseye text-brand-red"></i> Foco: {ex.muscleGroup}</p>
                              
                              <div className="flex flex-wrap sm:flex-nowrap gap-3 mt-auto pt-5 border-t border-slate-100">
                                <button onClick={() => {setSelectedExercise(ex); setCurrentView('detail');}} className="flex-1 sm:flex-none px-4 py-3 bg-white border border-slate-200 text-slate-600 font-extrabold text-xs rounded-xl hover:bg-slate-50 hover:text-brand-blue transition-colors text-center shadow-sm"><i className="fa-solid fa-eye sm:mr-2"></i> <span className="hidden sm:inline">Analisar</span></button>
                                <button onClick={() => handleApprove(ex.id)} className="flex-1 sm:flex-none px-4 py-3 bg-emerald-50 text-emerald-600 font-extrabold text-xs rounded-xl hover:bg-emerald-500 hover:text-white transition-colors text-center shadow-sm"><i className="fa-solid fa-check sm:mr-2"></i> <span className="hidden sm:inline">Aprovar</span></button>
                                <button onClick={() => handleReject(ex.id)} className="flex-1 sm:flex-none px-4 py-3 bg-rose-50 text-rose-500 font-extrabold text-xs rounded-xl sm:ml-auto hover:bg-rose-500 hover:text-white transition-colors text-center shadow-sm"><i className="fa-solid fa-trash sm:mr-2"></i> <span className="hidden sm:inline">Recusar</span></button>
                              </div>
                            </div>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    // INICIALIZAÇÃO
    const App = () => {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
          if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            setSession({ ...session.user, full_name: profile?.full_name || session.user.user_metadata?.full_name || 'Monitor', role: profile?.role || 'Monitor' });
          }
          setLoadingAuth(false);
        });
      }, []);

      const handleLogout = async () => { await supabaseClient.auth.signOut(); setSession(null); };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-pattern"><div className="bg-white p-8 rounded-3xl shadow-xl flex flex-col items-center"><div className="w-16 h-16 border-4 border-slate-100 border-t-brand-blue rounded-full animate-spin mb-4"></div><p className="text-brand-blue font-black tracking-widest uppercase text-xs">Carregando Plataforma...</p></div></div>;
      if (!session) return <LoginPage onLogin={setSession} />;
      return <Dashboard session={session} onLogout={handleLogout} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
